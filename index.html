 I will show you.'","","He asks no questions."],"src":"G12"},{"id":"M5","type":"mcq","skill":"Apply a concept","topic":"Covenant","stem":"Which modern example is most like the relationship created in Genesis 12?","options":["A boss who gives orders to workers and promises them nothing in return","A person who privately believes something","A mentor and student who each commit to the other","A shopper who buys one item and leaves"],"ans":2,"exp":"A covenant is two-way and ongoing.","why":["That is one-sided command.","That is belief, not a two-sided bond.","","A covenant is ongoing."],"src":"G12"},{"id":"M6","type":"mcq","skill":"Evaluate a claim","topic":"Covenant","stem":"A classmate says, 'Genesis 12 gives Avram nothing in return for leaving.' Which part of the passage best refutes this?","options":["Verses 2 and 3","Verse 1 only","Verse 4 only","The mention of Lot"],"ans":0,"exp":"Verses 2–3 hold the promises.","why":["","Verse 1 is the command.","Verse 4 is Avram's response.","Lot is a companion, not a promise."],"src":"G12"},{"id":"M7","type":"mcq","skill":"Compare interpretations","topic":"Avraham","stem":"How does the palace midrash change our picture of Avraham compared with Genesis 12?","options":["He is shown refusing to believe in G-d","He is shown as a king who already owns a great palace","He is shown arguing about Sodom","He is shown searching before G-d speaks"],"ans":3,"exp":"Genesis 12 starts with G-d's call; the midrash starts with Avraham's question.","why":["He seeks the owner.","He is the traveler, not the owner.","That is Genesis 18.",""],"src":"BR"},{"id":"M8","type":"mcq","skill":"Best-supported conclusion","topic":"Avraham","stem":"Which position is best supported by Rambam alone?","options":["G-d chose Avraham with no search by him","Avraham took the first step","Avraham learned of G-d from a teacher","Avraham's family taught him one G-d"],"ans":1,"exp":"Position B: Avraham chose G-d.","why":["Rambam stresses Avraham's search.","","Rambam says he had no teacher.","He was among idolaters."],"src":"RAM"},{"id":"M9","type":"mcq","skill":"Limits of a source","topic":"Avraham","stem":"Which is the best reason a historian might treat Rambam differently from Genesis 12?","options":["Rambam contradicts every single detail found in Genesis 12","Rambam interprets the story centuries later","Rambam never mentions Ur or idolaters","Rambam was an eyewitness to Avraham's life"],"ans":1,"exp":"Interpretation vs. the base text.","why":["He adds to the story; he doesn't contradict it all.","","He mentions both.","He lived much later."],"src":"RAM"},{"id":"M10","type":"mcq","skill":"Best-supported conclusion","topic":"Avraham","stem":"Based on Genesis 12, the midrash and Rambam together, which position is best supported?","options":["Only G-d chose, and Avraham did nothing","Only Avraham chose, and G-d did nothing","Neither chose; Avraham inherited his role","Avraham and G-d chose each other"],"ans":3,"exp":"Each source shows a different side; together they support Position C.","why":["Rambam and the midrash show Avraham searching.","Genesis 12 shows G-d calling.","The sources show active choosing.",""]},{"id":"M11","type":"mcq","skill":"Character from evidence","topic":"Avraham","stem":"Which conclusion about Avraham is best supported by Genesis 13?","options":["He gave up an advantage to keep peace","He was afraid of losing a fight with Lot","He wanted the well-watered plain for himself","He disobeyed G-d by separating from Lot"],"ans":0,"exp":"Lot got first choice.","why":["","No fear is mentioned.","Lot chose it.","No command is broken."],"src":"G13"},{"id":"M12","type":"mcq","skill":"Compare two sources","topic":"Avraham","stem":"Which pair best shows Avraham acting differently in different situations?","options":["Arguing with G-d in Genesis 12; silent before G-d in Genesis 18","Silent in both stories","Silent in Genesis 12; arguing in Genesis 18","Arguing for himself in both"],"ans":2,"exp":"Obedience in one, challenge in the other.","why":["It is the reverse.","He argues in Genesis 18.","","In 18 he argues for strangers."],"src":"G18"},{"id":"M13","type":"mcq","skill":"Significance","topic":"Avraham","stem":"Why is Avraham's argument for Sodom significant for understanding the relationship with G-d?","options":["It shows the relationship between them had already ended","It shows Avraham owned Sodom","It shows questioning can be part of it","It shows G-d refused to listen"],"ans":2,"exp":"Your reflection: Judaism leaves room for questioning.","why":["It continues afterward.","He had no claim to Sodom.","","G-d listens to the argument."],"src":"G18"},{"id":"M14","type":"mcq","skill":"Character from evidence","topic":"Avraham","stem":"Which statement about Avraham in the Hagar story is best supported?","options":["He avoided responsibility for the conflict","He protected Hagar from harm","He argued with G-d for Hagar's sake","He ordered Hagar to run away into the wilderness"],"ans":0,"exp":"A weakness, which matters for 'chosen, not perfect.'","why":["","He left her 'in your hands.'","No argument appears.","Sarai treated her harshly and she fled."],"src":"G16"},{"id":"M15","type":"mcq","skill":"Compare two sources","topic":"Avraham","stem":"Which question best captures the tension between Genesis 18 and Genesis 22?","options":["Why Lot left for the Jordan plain","Why Sarai gave Hagar to Avraham","Why Pharaoh feared the Israelites in Exodus chapter 1","Why he argues for strangers but not his son"],"ans":3,"exp":"He challenges G-d for Sodom but rises early to obey at the Akeida.","why":["That is Genesis 13.","That is Genesis 16.","That is Exodus 1.",""],"src":"G22"},{"id":"M16","type":"mcq","skill":"Best-supported conclusion","topic":"Avraham","stem":"Using the five stories, which claim about why G-d chose Avraham is strongest?","options":["He was chosen because he never made a mistake","He was chosen despite flaws, for his faith and moral courage","He was chosen because he was the richest man","He was chosen only because he always obeyed in silence, never questioning"],"ans":1,"exp":"Strengths and weaknesses both appear.","why":["The Hagar story shows a flaw.","","Wealth isn't given as a reason.","He also argues in Genesis 18."]},{"id":"M17","type":"mcq","skill":"Apply a concept","topic":"Covenant","stem":"A student is named team captain and then says, 'Now I never have to listen to anyone.' How does this misunderstand chosenness as your class defined it?","options":["Being chosen means you can't make mistakes","Being chosen adds duties, not privileges","Being chosen means nothing at all","Being chosen means only others have duties"],"ans":1,"exp":"Chosenness = responsibility, not superiority or perfection.","why":["Chosen doesn't mean perfect.","","It brings responsibility.","The chosen one takes on duties."]},{"id":"M18","type":"mcq","skill":"Distinguish concepts","topic":"Covenant","stem":"Which best explains why a covenant is different from personal belief?","options":["It requires believing in many gods","It happens only privately, inside a single person's mind","It needs no action from anyone","It creates commitments on both sides"],"ans":3,"exp":"Belief alone doesn't make someone Jewish; the covenant adds obligations.","why":["The covenant is with one G-d.","That describes private belief.","It requires action.",""]},{"id":"M19","type":"mcq","skill":"Sequence","topic":"Covenant","stem":"Which order best shows how the covenant develops?","options":["Avraham's call → brit milah → Sinai → renewal","Sinai → Avraham's call → brit milah → renewal","Renewal → Sinai → Avraham's call → brit milah","Brit milah → renewal → Avraham's call → Sinai"],"ans":0,"exp":"Individual call, covenant sign, national covenant, renewal by the next generation.","why":["","Sinai comes long after Avraham.","Renewal comes last.","The call comes first."]},{"id":"M20","type":"mcq","skill":"Significance","topic":"Covenant","stem":"Why does passing righteousness and justice to future generations matter for the covenant?","options":["It lets later generations ignore it","It means the covenant ends the moment Avraham himself dies","The covenant lasts only if each generation keeps it","It applies only to Avraham himself"],"ans":2,"exp":"Your notes: responsibility for Avraham and his descendants.","why":["The opposite.","It continues through descendants.","","It passes to his descendants."]},{"id":"M21","type":"mcq","skill":"Compare covenants","topic":"Covenant","stem":"Which statement best compares the covenant with Avraham and the covenant at Sinai?","options":["Both were made with the whole people","Both had no conditions at all","One individual first; then a whole people with laws","Sinai replaced Avraham's covenant entirely and erased its promises"],"ans":2,"exp":"Individual vs. national; promise vs. conditions and laws.","why":["Avraham's was with one man.","Sinai has conditions.","","It builds on it."],"src":"SIN"},{"id":"M22","type":"mcq","skill":"Significance","topic":"Covenant","stem":"What was most significant about 'we will do and obey'?","options":["The people committed to act together","The people refused the covenant","Only the leaders agreed","The laws were forced on them against their will"],"ans":0,"exp":"A shared choice that turns a family into a nation.","why":["","They accepted it.","All the people answered.","They chose them."],"src":"SIN"},{"id":"M23","type":"mcq","skill":"Apply a concept","topic":"Covenant","stem":"Someone notices a friend being mocked, says nothing, and later says, 'It wasn't my fault.' What would the Yom Kippur lesson say?","options":["Guilty, because they mocked the friend","Not involved at all, since it wasn't theirs","Only responsible if a teacher saw it","Not guilty, but still responsible to act"],"ans":3,"exp":"Guilt ≠ responsibility; noticing isn't acting.","why":["They didn't do the mocking.","Belonging asks something of them.","Responsibility doesn't depend on being seen.",""]},{"id":"M24","type":"mcq","skill":"Family tree","topic":"Family Tree","stem":"Which order of generations is correct?","options":["Avraham → Yishmael → Yaakov → 12 sons","Avraham → Yitzchak → Yaakov → 12 sons","Yitzchak → Avraham → Yaakov → 12 sons","Avraham → Yaakov → Yitzchak → 12 sons"],"ans":1,"exp":"Jewish lineage runs through Yitzchak and Yaakov.","why":["Yaakov is Yitzchak's son.","","Avraham is Yitzchak's father.","Yitzchak comes before Yaakov."]},{"id":"M25","type":"mcq","skill":"Family tree","topic":"Family Tree","stem":"Joseph and Benjamin share a mother. Who is she?","options":["Leah","Rachel","Zilpah","Rivka"],"ans":1,"exp":"Rachel, Yaakov's beloved wife.","why":["Leah's sons include Reuben and Judah.","","Zilpah's sons are Gad and Asher.","Rivka is Yaakov's mother."]},{"id":"M26","type":"mcq","skill":"Evidence","topic":"Family to Nation","stem":"Which detail best supports calling Yaakov's group a family in Genesis 46?","options":["It describes them filling the land","It calls them 'the Israelite people'","It describes laws given at Sinai","It counts 70 related persons"],"ans":3,"exp":"Small, related by blood and marriage.","why":["That's Exodus 1.","That's Pharaoh in Exodus 1.","That's much later.",""],"src":"G46"},{"id":"M27","type":"mcq","skill":"Cause and effect","topic":"Family to Nation","stem":"What is the most direct cause of Pharaoh's new attitude toward the Israelites?","options":["Their rapid growth in Egypt","Their departure from Goshen","Their acceptance of the Torah","Their alliance with Egypt's enemies"],"ans":0,"exp":"Growth plus a king who 'did not know Joseph.'","why":["","They stayed in Goshen.","That came later, at Sinai.","He fears they might; they haven't."],"src":"EX1"},{"id":"M28","type":"mcq","skill":"Evidence vs. inference","topic":"Family to Nation","stem":"Which statement is Pharaoh's fear rather than a fact stated in the text?","options":["The Israelites multiplied greatly","A new king arose over Egypt who did not know Joseph","The Israelites would join Egypt's enemies","Joseph and all of his generation died"],"ans":2,"exp":"He says they 'may' join enemies, a fear, not an event.","why":["The text states this as fact.","Stated as fact.","","Stated as fact."],"src":"EX1"},{"id":"M29","type":"mcq","skill":"Cause and effect","topic":"Family to Nation","stem":"Which pair gives the best practical explanation for staying in Egypt?","options":["Slavery and the threat of Pharaoh's army","The Ten Commandments and the Mishkan","Fertile land and Joseph's protection","The Jordan crossing and manna"],"ans":2,"exp":"Goshen was fertile; Joseph had power.","why":["Those came later.","Those came after the Exodus.","","Those came later."],"src":"G47"},{"id":"M30","type":"mcq","skill":"Covenant connection","topic":"Family to Nation","stem":"How might Joseph's words have encouraged later generations to remain in Egypt?","options":["They could wait for G-d to bring them out","They made Egypt the promised land","They commanded an immediate departure","They told them to fight Pharaoh and take Egypt's land"],"ans":0,"exp":"Pakod yifkod: leaving is on G-d's timing.","why":["","He names Canaan as the promised land.","He speaks of the future.","Nothing about fighting."],"src":"G50"},{"id":"M31","type":"mcq","skill":"Evidence vs. inference","topic":"Family to Nation","stem":"Which is something a historian may INFER about why the Israelites stayed in Egypt, rather than what the Torah says?","options":["\"The iniquity of the Amorites is not yet complete\"","\"G-d will surely take notice of you\"","\"They acquired holdings and increased\"","Economic comfort made leaving unattractive"],"ans":3,"exp":"Torah says / we observe / historians infer.","why":["That is what the Torah says.","That is the Torah's text.","That is the Torah's text.",""]},{"id":"M32","type":"mcq","skill":"Classify","topic":"Family to Nation","stem":"By Exodus 1, which description of the Israelites is best supported?","options":["A family of 70 people","A people, not yet a nation","A nation with land and laws","A kingdom ruling Egypt"],"ans":1,"exp":"Shared history and identity; no land or government.","why":["They have grown far beyond 70.","","They have no land or laws of their own yet.","They are about to be oppressed."]},{"id":"M33","type":"mcq","skill":"Evaluate rankings","topic":"Family to Nation","stem":"Which reason best supports ranking the Ten Commandments above manna in creating a nation?","options":["Manna happened before the Exodus","Laws gave everyone the same standards","The Ten Commandments ended slavery","Manna was given only to Moshe and the priests"],"ans":1,"exp":"Laws hold a nation together; manna sustained them but added no new feature.","why":["Manna came after the Exodus.","","Leaving Egypt ended slavery.","Manna fed everyone."]},{"id":"M34","type":"mcq","skill":"Counterevidence","topic":"Family to Nation","stem":"A student claims, 'The Israelites became a nation only when they entered the land.' Which evidence best challenges this?","options":["They crossed the Jordan on dry ground","Pharaoh called them far too numerous for Egypt to handle","Genesis counts Yaakov's household as 70 persons","Sinai calls them 'a holy nation' in the wilderness"],"ans":3,"exp":"Exodus 19 and Deuteronomy 27 both speak to them before the land.","why":["That supports the student's timing.","That shows a people, not nationhood.","That shows a family.",""],"src":"SIN"},{"id":"M35","type":"mcq","skill":"Best-supported conclusion","topic":"Israel","stem":"Based on the table, which conclusion is best supported?","options":["Having the most seats did not mean governing","Likud won a majority of 61 seats","Yashar won the election outright","The poll of polls was the final official election result"],"ans":0,"exp":"Largest party ≠ majority ≠ government.","why":["","No bloc reached 61.","Likud led the count.","Polls aren't results."],"src":"KN"},{"id":"M36","type":"mcq","skill":"Apply a concept","topic":"Israel","stem":"A coalition of six parties holds 62 seats. One partner with 4 seats quits. What is the most likely result?","options":["The government gets stronger","The president takes over","The government may fall","The party that quit becomes largest"],"ans":2,"exp":"Coalitions are fragile.","why":["It drops to 58, below a majority.","The president is ceremonial.","","4 seats is small."]},{"id":"M37","type":"mcq","skill":"Cause and effect","topic":"Israel","stem":"According to your notes, what happened after World War I that led to outside powers governing the land?","options":["Israel declared independence","The Knesset was created","The Ottoman Empire fell","Egypt conquered the region"],"ans":2,"exp":"Ottoman collapse → mandate system.","why":["That came much later.","Israel didn't exist yet.","","Britain and France wanted it."]},{"id":"M38","type":"mcq","skill":"Distinguish claims","topic":"Antisemitism","stem":"Which statement is the strongest example of hostility toward Jews as Jews?","options":["Statement 2 alone","Statement 1 alone","Both, since both mention Israel","Neither, since both are opinions"],"ans":0,"exp":"Criticism of a government ≠ hostility toward Jews as Jews.","why":["","It criticizes a policy with evidence.","Mentioning Israel isn't hostility to Jews.","Statement 2 targets Jews as a group."],"src":"AS"},{"id":"M39","type":"mcq","skill":"Overgeneralization","topic":"Antisemitism","stem":"Which claim from your review is an overgeneralization that was marked false?","options":["A small group can pose a serious risk","Both scriptures mention warfare","Some protesters may hold extreme views","All Palestinians are Muslim"],"ans":3,"exp":"'All' turns some into everyone.","why":["Marked true; not an overgeneralization.","Marked true.","Limited, not overgeneralized.",""]},{"id":"M40","type":"mcq","skill":"Apply a concept","topic":"Traditions","stem":"A community moves to a new country and keeps its prayers and school but switches its daily language. Which idea from the reading does this best show?","options":["Refusing to adapt to the new country at all","Adapting while preserving what matters","Adapting so completely nothing is left","Depending on one building to survive"],"ans":1,"exp":"The balance between preserving and changing.","why":["They changed their language.","","They kept prayers and school.","The reading says Jewish life never depended on one building."],"src":"WWS"}]}]},"cheat":[{"title":"Skills on the test","kind":"list","items":["Best-supported conclusion: what the source proves, not just what's true.","Compare two sources or events.","Cause and effect.","Evidence vs. inference.","Spot overgeneralization ('all,' 'everyone').","Apply a concept to a new example.","Test claims against counterevidence; weigh interpretations; know a source's limits."]},{"title":"One-line answers","kind":"list","items":["Covenant = two-way, ongoing, passed down.","Chosen = responsibility, not perfection.","Torah gives no reason for choosing Avraham.","Family → people (Exodus 1) → nation (laws, worship, land).","Pakod yifkod: 'G-d will surely take notice of you.'","Largest party ≠ governing party; need 61."]}],"topicDeck":{"Avraham":2,"Covenant":3,"Family Tree":4,"Family to Nation":5,"Antisemitism":6,"Israel":7,"Traditions":8}}};
/* 00-core.js */
"use strict";
/* Shared helpers, storage keys and the unit picked in the address (#unit-id). */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const shuf = (a) => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const ask = (m) => (typeof confirm === "function" ? confirm(m) : true);
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const fmt1 = (x) => String(Math.round(x * 10) / 10);

/* Inline SVG icons (stroke = currentColor). */
const svg = (d, w) =>
  '<svg class="ic" width="' + (w || 18) + '" height="' + (w || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>";
const ICON = {
  back: svg('<path d="M15 6l-6 6 6 6"/>'),
  grid: svg('<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  x: svg('<path d="M6 6l12 12M18 6L6 18"/>', 16),
  arrow: svg('<path d="M5 12h14M13 6l6 6-6 6"/>', 16),
  chev: svg('<path d="M9 6l6 6-6 6"/>', 16),
  flag: svg('<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>', 16),
  print: svg('<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>', 16),
  clock: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', 16),
  shuffle: svg('<path d="M3 7h3.5c4 0 6 10 10 10H21"/><path d="M3 17h3.5c1.6 0 2.8-1.6 3.8-3.5"/><path d="M14 9.5c.9-1.4 1.9-2.5 3.5-2.5H21"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/>', 16),
  undo: svg('<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>', 16),
  redo: svg('<path d="M3 12a9 9 0 1015.5-6.2"/><path d="M21 3v6h-6"/>', 16),
};

/* Which unit is open: the part of the address after #. No match means the course home page. */
const UNIT = (() => {
  const id = decodeURIComponent(location.hash.slice(1));
  return COURSE.units.find((u) => u.id === id) || null;
})();
const D = UNIT ? UNITDATA[UNIT.id] : null;
addEventListener("hashchange", () => location.reload());

/* Saved progress is namespaced per course and unit, so kits on the same github.io site never overwrite each other. */
const keyOf = (u, part) => "sk:" + COURSE.id + ":" + u.id + ":" + part;
const PREFK = "sk:" + COURSE.id + ":prefs";
COURSE.units.forEach((u) => {
  /* One-time copy from the keys the old single-unit kits used. */
  const legacy = u.legacyKeys || {};
  ["kit", "pt"].forEach((part) => {
    try {
      const k = keyOf(u, part);
      if (legacy[part] && localStorage.getItem(k) === null) {
        const v = localStorage.getItem(legacy[part]);
        if (v !== null) localStorage.setItem(k, v);
      }
    } catch (e) {}
  });
});
const LSK = UNIT ? keyOf(UNIT, "kit") : null;
const PTK = UNIT ? keyOf(UNIT, "pt") : null;
const readJSON = (k) => {
  try {
    const r = localStorage.getItem(k);
    return r ? JSON.parse(r) : null;
  } catch (e) {
    return null;
  }
};
const writeJSON = (k, v) => {
  try {
    localStorage.setItem(k, JSON.stringify(v));
  } catch (e) {}
};

/* Theme and text size apply to the whole course, including the unit list. */
const PREF_DEF = { theme: "auto", size: 2 };
const PREFS = Object.assign({}, PREF_DEF, readJSON(PREFK) || {});
function applyPrefs() {
  const root = document.documentElement;
  root.setAttribute("data-theme", PREFS.theme);
  root.style.fontSize = [15, 16, 17, 19, 21][PREFS.size] + "px";
  root.style.setProperty("--accent-l", COURSE.accent);
  root.style.setProperty("--accent-d", COURSE.accentDark || COURSE.accent);
}
applyPrefs();

const ACT = {};
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const f = ACT[t.dataset.act];
  if (f) f(t, e);
});

/* 10-shell.js */
/* Course home (list of units) and the frame around an open unit: header, progress meter, tabs, deck chips. */
function hubLink() {
  return COURSE.hub ? '<a class="hublink" href="' + esc(COURSE.hub) + '">' + ICON.back + "Study Hub</a>" : "<span></span>";
}

/* Credit line on every kit page. The engine is MIT-licensed (kit-core/LICENSE): copies must keep this line. */
const CREDIT_URL = "https://dn4563.github.io/Study-Hub-by-David/";
function creditLine() {
  return '<footer class="credit">Study kit engine by <a href="' + CREDIT_URL + '">David Noskow</a></footer>';
}

function unitProgress(u) {
  const data = UNITDATA[u.id],
    saved = readJSON(keyOf(u, "kit")) || {},
    known = saved.known || {};
  const ids = [];
  data.decks.forEach((dk) => {
    if (dk.optional) return;
    dk.sections.forEach((sc, si) => sc.cards.forEach((c, ci) => ids.push(dk.id + "." + si + "." + ci)));
  });
  let answered = 0,
    total = 0;
  const pt = readJSON(keyOf(u, "pt"));
  data.practice.sections.forEach((s) => {
    const st = pt && pt.secs ? (pt.secs.find((x) => x.name === s.name) || {}).st || {} : {};
    s.questions.forEach((q) => {
      total++;
      const x = st[q.id];
      if (x && (x.checked || x.mark != null || Object.keys(x.pm || {}).length)) answered++;
    });
  });
  return { got: ids.filter((id) => known[id]).length, tot: ids.length, answered: answered, total: total };
}

function homeHTML() {
  let h =

function indexCards() {
  BYID = {};
  D.allDecks = D.allDecks || D.decks;
  D.allDecks.forEach((dk, di) => {
    dk.tone = di % 8;
    dk.sections.forEach((sc, si) =>
      sc.cards.forEach((c, ci) => {
        c.id = dk.id + "." + si + "." + ci;
        c.deck = dk.id;
        c.sec = dk.id + "." + si;
        BYID[c.id] = c;
      }),
    );
  });
}
/* Optional decks stay out of "All decks", the meter and the mixed quiz unless turned on in Settings. */
function rebuild() {
  D.decks = D.allDecks.filter((d) => !d.optional || SAVE.settings.optDeck);
  ALL = [];
  LESSONS = [];
  D.decks.forEach((dk) =>
    dk.sections.forEach((sc, si) => {
      sc.cards.forEach((c) => ALL.push(c));
      const n = sc.cards.length,
        parts = Math.max(1, Math.ceil(n / 5)),
        base = Math.floor(n / parts),
        extra = n % parts;
      let i = 0;
      for (let p = 0; p < parts; p++) {
        const sz = base + (p < extra ? 1 : 0);
        LESSONS.push({
          id: dk.id + "." + si + "." + p,
          deck: dk.id,
          sec: dk.id + "." + si,
          secName: sc.name,
          part: p,
          parts: parts,
          title: sc.name + (parts > 1 ? " (part " + (p + 1) + " of " + parts + ")" : ""),
          cards: sc.cards.slice(i, i + sz),
        });
        i += sz;
      }
    }),
  );
}

  if (ci >= 0 && okTxt) h += '<div class="why good"><div class="wh">Why the correct answer is right</div>' + quote(opts[ci]) + "<p>" + okTxt + "</p></div>";

/* 30-runner.js */
/* Question builders and the one-at-a-time runner used by Quiz, the final mixed quiz and retries. */
let FC = null,
  TM = null;
const LET = "ABCDE";
function stopTM() {
  clearInterval(TM);
  TM = null;
}
function pickDir() {
  const d = SAVE.settings.dir;
  return d === "both" ? (Math.random() < 0.5 ? "t2d" : "d2t") : d;
}
/* Distractors come from the same section first, then the same deck, then anywhere, preferring similar lengths
   so the right answer never stands out by length. */
function distractors(card, n, field) {
  const target = card[field];
  const fair = (c) => !MIX || field !== "def" || !hasTerm(c.def, card.term);
  const tiers = [
    ALL.filter((c) => c !== card && c.sec === card.sec),
    ALL.filter((c) => c !== card && c.deck === card.deck && c.sec !== card.sec),
    ALL.filter((c) => c.deck !== card.deck),
  ];
  const out = [];
  for (const tier of tiers) {
    const cand = shuf(tier);
    const close = cand.filter((c) => {
      const r = c[field].length / target.length;
      return r >= 0.7 && r <= 1.3;
    });
    const ord = close.concat(cand.filter((c) => close.indexOf(c) < 0));
    for (const c of ord) {
      if (out.length >= n) break;
      if (fair(c) && c[field] !== target && !out.some((o) => o[field] === c[field])) out.push(c);
    }
    if (out.length >= n) break;
  }
  return out;
}
/* Units with "learnMix" on (set per unit in course.json) hide the term inside definitions used as questions
   or choices, and mix in each card's applied questions. Units without it behave exactly as before. */
const MIX = !!(UNIT && UNIT.learnMix);
const STOP = /^(with|from|into|that|this|they|their|than|then|have|each|also|only|some|more|most)$/i;
/* A word counts as the term when it starts with the term word's stem and adds at most a short ending
   (isotope -> isotopes, isotopic). Longer words that merely share letters (mole -> molecules) don't. */
function termStems(term) {
  return (term.match(/[A-Za-z]{4,}/g) || []).filter((w) => !STOP.test(w)).map((w) => w.toLowerCase().slice(0, Math.max(4, w.length >= 8 ? w.length - 2 : w.length - 1)));
}
function maskTerm(text, term) {
  const stems = termStems(term);
  let hidden = 0;
  const out = text.replace(/[A-Za-z]+/g, (w) => {
    const lw = w.toLowerCase();
    if (stems.some((st) => lw.startsWith(st) && lw.length - st.length <= 3)) {
      hidden++;
      return "_____";
    }
    return w;
  });
  return { text: out, ratio: hidden / Math.max(1, (text.match(/[A-Za-z]+/g) || []).length) };
}
/* Mixed units: a definition used as the clue has the term blanked out (and is skipped if that leaves too
   little). Answer choices are never blanked: a term -> definition question is only asked when the card's
   definition doesn't contain its own term, and wrong choices that mention the asked term are left out. */
const hasTerm = (text, term) => maskTerm(text, term).ratio > 0;
const clueOK = (card) => !MIX || maskTerm(card.def, card.term).ratio <= 0.2;
const choicesOK = (card) => !MIX || !hasTerm(card.def, card.term);
const shownDef = (c) => (MIX ? maskTerm(c.def, c.term).text : c.def);
function askQ(card, a) {
  return {
    kind: "ap",
    card: card,
    ask: "Apply it",
    prompt: esc(a.q),
    options: shuf([{ t: a.right, ok: true }].concat(a.wrong.map((w) => ({ t: w[0], ok: false, why: w[1] })))),
    explain: (a.exp ? esc(a.exp) + "<br>" : "") + "<b>" + esc(card.term) + "</b>: " + esc(card.def) + hookLine(card),
  };
}
function mcQ(card, dir, nopt) {
  dir = dir || pickDir();
  const okDir = (d) => (d === "d2t" ? clueOK(card) : choicesOK(card));
  if (!okDir(dir)) dir = dir === "d2t" ? "t2d" : "d2t";
  /* No fair definition question for this card: ask its applied question instead. */
  if (!okDir(dir) && card.asks && card.asks.length) return askQ(card, card.asks[Math.floor(Math.random() * card.asks.length)]);
  nopt = nopt || 4;
  const field = dir === "t2d" ? "def" : "term";
  const opts = shuf(
    [{ t: card[field], ok: true }].concat(
      distractors(card, nopt - 1, field).map((c) => ({
        t: c[field],
        ok: false,
        why:
          dir === "t2d"
            ? 'That description belongs to "' + c.term + '", not to "' + card.term + '".'
            : '"' + c.term + '" means: ' + c.def + ' That is a different idea from the description in the question, which fits "' + card.term + '".',
      })),
    ),
  );
  return {
    kind: "mc",
    card: card,
    dir: dir,
    ask: dir === "t2d" ? "Which description best matches this term?" : "Which term matches this description?",
    prompt: dir === "t2d" ? "<b>" + esc(card.term) + "</b>" : esc(shownDef(card)),
    options: opts,
    explain: "<b>" + esc(card.term) + "</b>: " + esc(card.def) + hookLine(card),
  };
}
function tfQ(card) {
  let isTrue = Math.random() < 0.5,
    other = null;
  if (!isTrue) {
    const pool = ALL.filter((c) => c !== card && c.sec === card.sec);
    const pool2 = pool.length ? pool : ALL.filter((c) => c !== card && c.deck === card.deck);
    if (pool2.length) other = shuf(pool2)[0];
    else isTrue = true;
  }
  return {
    kind: "tf",
    card: card,
    ask: "True or false: this definition matches the term.",
    prompt: "<b>" + esc(card.term) + "</b><br>" + esc(isTrue ? card.def : other.def),
    options: [
      { t: "True", ok: isTrue },
      { t: "False", ok: !isTrue },
    ],
    explain: (isTrue ? "True. " : "False. That definition belongs to <b>" + esc(other.term) + "</b>. ") + "<b>" + esc(card.term) + "</b>: " + esc(card.def),
  };
}
function scQ(s, ask) {
  return {
    kind: "sc",
    deck: s.deck,
    ask: ask || "Apply it",
    prompt: esc(s.q),
    options: shuf(s.opts.map((t, i) => ({ t: t, ok: i === s.ans, why: i === s.ans ? "" : (s.why && s.why[i]) || "" }))),
    explain: esc(s.exp),
  };
}
const hookLine = (c) => (SAVE.settings.hooks && c.hook ? '<span class="hook"><b>Hook</b> ' + esc(c.hook) + "</span>" : "");
const fresh = (q) => (q.kind === "mc" ? mcQ(q.card, q.dir, q.options.length) : q.kind === "tf" ? tfQ(q.card) : Object.assign({}, q, { elim: [] }));
/* A missed term comes back re-rolled: 35% chance it flips direction, always with reshuffled options. */
const reroll = (q) => mcQ(q.card, Math.random() < 0.35 ? (q.dir === "t2d" ? "d2t" : "t2d") : q.dir || pickDir(), Math.max(3, q.options.length));

function startRun(cfg) {
  stopTM();
  UI.run = Object.assign({ i: 0, picked: null, sel: null, res: [], left: 0, done: false, fin: false }, cfg);
  armTM();
  render();
}
/* Per-question timer: running out counts as a miss. */
function armTM() {
  stopTM();
  const R = UI.run;
  if (!R || R.done || !R.timer) return;
  R.left = R.timer;
  TM = setInterval(() => {
    R.left--;
    const e = document.getElementById("rt");
    if (e) e.textContent = R.left + " s";
    if (R.left <= 0) {
      stopTM();
      if (R.picked === null) rpickAct(-1);
    }
  }, 1000);
}
function runHTML() {
  const R = UI.run;
  if (R.done) return resultHTML();
  const q = R.qs[R.i],
    n = R.qs.length,
    answered = R.picked !== null,
    confirmOn = SAVE.settings.confirm;
  let h =
    '<section class="panel"><div class="rtop"><h2>' +
    esc(R.title) +
    '</h2><span class="muted">Question ' +
    (R.i + 1) +
    " of " +
    n +
    "</span>" +
    (R.timer ? '<span class="timer">' + ICON.clock + '<span id="rt">' + R.left + " s</span></span>" : "") +
    '<button class="lnk" data-act="rquit">Quit</button></div>' +
    lockToggle();
  h += '<p class="qask">' + esc(q.ask) + '</p><div class="qprompt">' + q.prompt + '</div><div class="opts">';
  q.elim = q.elim || [];
  q.options.forEach((o, k) => {
    let c = "opt";
    if (answered && R.immediate) {
      if (o.ok) c += " right";
      else if (k === R.picked) c += " wrong";
    }
    if (!answered && confirmOn && R.sel === k) c += " sel";
    h += optRow(c, "rpick", k, LET[k], esc(o.t), "relim", q.elim.indexOf(k) >= 0, answered);
  });
  h += "</div>";
  if (!answered && confirmOn) h += lockHTML("rconfirm", R.sel);
  if (answered && R.immediate) {
    const ok = R.picked >= 0 && q.options[R.picked].ok;
    h +=
      '<div class="fb ' +
      (ok ? "ok" : "bad") +
      '"><b>' +
      (R.picked < 0 ? "Time's up." : ok ? "Correct." : "Not quite.") +
      "</b> " +
      q.explain +
      "</div>" +
      (q.kind === "tf" ? "" : whyHTML(q.options, R.picked, "")) +
      '<div class="qnav"><button class="btn" data-act="rnext">' +
      (R.i + 1 < n ? "Next" : "See results") +
      "</button></div>";
  }
  return h + '</section><p class="kbd">Keys: A to E or 1 to 5 picks a choice. Enter locks it in, then goes to the next question.</p>';
}
function resultHTML() {
  const R = UI.run,
    first = R.res.filter((r) => !r.q.tries),
    ok = first.filter((r) => r.ok).length,
    miss = first.filter((r) => !r.ok);
  let h =
    '<section class="panel"><h2>' +
    esc(R.title) +
    ': results</h2><p class="big">' +
    ok +
    " of " +
    first.length +
    " right on the first try (" +
    (first.length ? Math.round((ok / first.length) * 100) : 0) +
    "%)</p>";
  if (R.breakdown) h += breakdownHTML(R);
  if (miss.length) {
    h += "<h3>Review these</h3>";
    miss.forEach((r) => {
      const c = r.q.options.find((o) => o.ok);
      h += '<div class="rev"><div class="qprompt">' + r.q.prompt + "</div><p><b>Answer:</b> " + esc(c.t) + '</p><p class="muted">' + r.q.explain + "</p></div>";
    });
  }

  const q = shuf(weak.concat(other).slice(0, Math.min(SR_N, cards.length))).map((c) => ({ type: "card", id: c.id }));
  UI.L = { phase: "quiz", sr: true, queue: q, cur: null, picked: null, first: 0, firstTotal: q.length, missed: new Set(), scenMiss: [], scenMissIdx: [], recallMiss: [], tried: new Set() };
  window.scrollTo(0, 0);
  nextLearnQ();
};
ACT.lquiz = () => {
  const li = LI(),
    lesson = LESSONS[li];
  const doneC = [];
  LESSONS.forEach((l, i) => {
    if (i !== li && SAVE.done[l.id]) l.cards.forEach((c) => doneC.push(c));
  });
  /* Mixed units: a term used as a review in either of the last 2 lessons sits out this one. */
  const cool = MIX ? [].concat(...(SAVE.revHist || []).slice(-2)) : [];
  const pool = cool.length && doneC.filter((c) => cool.indexOf(c.id) < 0).length >= 3 ? doneC.filter((c) => cool.indexOf(c.id) < 0) : doneC;
  const weak = shuf(pool.filter((c) => SAVE.trouble[c.id] > 0)),
    other = shuf(pool.filter((c) => !(SAVE.trouble[c.id] > 0)));
  const reviews = weak
    .concat(other)
    .slice(0, Math.min(3, doneC.length))
    .map((c) => ({ type: "card", id: c.id, review: true }));
  if (MIX) {
    SAVE.revHist = (SAVE.revHist || []).concat([reviews.map((r) => r.id)]).slice(-2);
    save();
  }
  let q = shuf(lesson.cards).map((c) => ({ type: "card", id: c.id }));
  reviews.forEach((r) => q.splice(1 + Math.floor(Math.random() * q.length), 0, r));
  if (isLastOfDeck(lesson)) {
    const idx = [];
    D.sq.forEach((s, i) => s.deck === lesson.deck && idx.push(i));
    q = q.concat(
      shuf(idx)
        .slice(0, 6)
        .map((i) => ({ type: "sc", idx: i })),
    );
  }
  let nRecall = 0;
  if (recallOn() && !isFirstOfDeck(lesson) && earlierUnits().length && Math.random() < RECALL_RATE) {
    const pick = pickRecall();
    if (pick) {
      const nCards = q.filter((it) => it.type !== "sc").length;
      q.splice(1 + Math.floor(Math.random() * Math.max(1, nCards - 1)), 0, { type: "recall", unit: pick.u, id: pick.id });
      nRecall = 1;
    }
  }
  UI.L = { phase: "quiz", queue: q, cur: null, picked: null, first: 0, firstTotal: q.length - nRecall, missed: new Set(), scenMiss: [], scenMissIdx: [], recallMiss: [], tried: new Set() };
  nextLearnQ();
};
function learnPick(k) {
  const L = UI.L;
  if (!L || L.phase !== "quiz" || L.picked !== null || UI.run) return;
  L.picked = k;
  if (L.cur.recall) {
    const ok = !!L.cur.options[k].ok;
    recallResult(L.cur.recall, ok);
    if (!ok) (L.recallMiss = L.recallMiss || []).push(L.cur);
    return render();
  }
  const q = L.cur,
    ok = !!q.options[k].ok,
    key = L.item.type === "sc" ? "s" + L.item.idx : L.item.id,
    firstTime = !L.tried.has(key);
  L.tried.add(key);
  if (ok && firstTime) L.first++;
  if (q.card) {
    const id = q.card.id;
    if (ok) {
      if (!L.missed.has(id)) {
        setKnown(id, true);
        if (SAVE.trouble[id]) SAVE.trouble[id] = Math.max(0, SAVE.trouble[id] - 1);
        save();
      }
    } else {
      L.missed.add(id);
      SAVE.trouble[id] = (SAVE.trouble[id] || 0) + 1;
      setKnown(id, false);
      /* Mixed units bring the term back 2 or 3 questions later, in a different form; others keep the fixed 2. */
      const gap = MIX ? 2 + Math.floor(Math.random() * 2) : 2;
      L.queue.splice(Math.min(L.queue.length, gap), 0, Object.assign({}, L.item, MIX ? { avoid: q.kind === "ap" ? "ap" : "mc" } : {}));
    }
  } else if (!ok) {
    L.scenMiss.push(q);
    L.scenMissIdx.push(L.item.idx);
  }
  render();
}
ACT.lopt = (t) => {
  const L = UI.L,
    k = Number(t.dataset.k);
  if (!L || L.phase !== "quiz" || L.picked !== null) return;
  if (SAVE.settings.confirm) {
    L.sel = k;
    render();
  } else learnPick(k);
};
ACT.lconfirm = () => {
  const L = UI.L;
  if (L && L.phase === "quiz" && L.picked === null && L.sel != null) learnPick(L.sel);
};
ACT.lelim = (t) => {
  const L = UI.L;
  if (!L || L.phase !== "quiz" || L.picked !== null) return;
  const k = Number(t.dataset.k);
  toggleElim((L.cur.elim = L.cur.elim || []), k);
  if (L.sel === k) L.sel = null;
  render();
};
ACT.lnext = () => {
  if (UI.L && UI.L.phase === "quiz" && UI.L.picked !== null) nextLearnQ();
};
ACT.lfinal = () =>
  startRun({
    title: "Final mixed quiz",
    qs: shuf(ALL)
      .slice(0, 40)
      .map((c) => mcQ(c)),
    immediate: true,
    timer: 0,
    retry: true,
    breakdown: true,
  });

/* A lesson in progress survives a reload. */
function packL() {
  const L = UI.L;
  if (!L) return null;
  if (L.phase === "teach") return { phase: "teach" };
  const o = { phase: L.phase, sr: !!L.sr, first: L.first, firstTotal: L.firstTotal, missed: [...L.missed], tried: [...L.tried], scen: L.scenMissIdx || [] };
  if (L.phase === "quiz") {
    const q = L.queue.slice();
    if (L.item && L.picked === null) q.unshift(L.item);
    o.queue = q;
  }
  return o;
}
function restoreL() {
  const p = SAVE.ui && SAVE.ui.L;
  if (!p || !p.phase) return;
  try {
    if (p.phase === "teach") {
      UI.L = { phase: "teach" };
      return;
    }
    const L = {
      phase: p.phase,
      sr: !!p.sr,
      queue: (p.queue || []).filter((it) =>
        it.type === "sc" ? D.sq[it.idx] : it.type === "recall" ? COURSE.units.some((u) => u.id === it.unit && UNITDATA[u.id]) : BYID[it.id],
      ),
      cur: null,
      picked: null,
      first: p.first || 0,
      firstTotal: p.firstTotal || 0,
      missed: new Set((p.missed || []).filter((id) => BYID[id])),
      scenMissIdx: (p.scen || []).filter((i) => D.sq[i]),
      tried: new Set(p.tried || []),
    };
    L.scenMiss = L.scenMissIdx.map((i) => learnQ({ type: "sc", idx: i }));
    UI.L = L;
    if (L.phase === "quiz") {
      if (!L.queue.length) UI.L = { phase: "teach" };
      else {
        L.item = L.queue.shift();
        L.cur = learnQ(L.item);
      }
    }
  } catch (e) {
    UI.L = { phase: "teach" };
  }
}

/* 60-flash.js */
/* Flashcards, modeled on Quizlet's flashcard mode.
   Pool: not known yet / all / trouble terms / starred. Order: shuffled or section order. Side first: term or definition
   (the Swap sides button flips it in one tap).
   Two modes:
   - Sort: Not yet / Got it. "Not yet" returns the card about 4 cards later. Back undoes the last choice,
     including its Got it / trouble change. The round ends with a results screen.
   - Browse: Previous / Next through the pool, no sorting.
   Keys: Space or Up/Down flips, Right = Got it (Sort) or Next (Browse), Left = Back (Sort) or Previous (Browse),
   1 = Not yet, 2 = Got it, S = star. */
function fcBuild(onlyIds) {
  let pool = deckCards().slice();
  const p = SAVE.settings.fcPool;
  if (onlyIds) pool = pool.filter((c) => onlyIds.indexOf(c.id) >= 0);
  else if (p === "unknown") pool = pool.filter((c) => !SAVE.known[c.id]);
  else if (p === "trouble") pool = pool.filter((c) => SAVE.trouble[c.id] > 0);
  else if (p === "starred") pool = pool.filter((c) => SAVE.star[c.id]);
  if (SAVE.settings.fcOrder === "shuffle") pool = shuf(pool);
  FC = { q: pool.map((c) => c.id), list: pool.map((c) => c.id), i: 0, flip: false, total: pool.length, hist: [], got: [], learning: [] };
}
function selHTML(key, label, opts) {
  const v = SAVE.settings[key];
  return (
    "<label>" +
    label +
    ' <select data-set="' +
    key +
    '">' +
    opts.map((o) => '<option value="' + o[0] + '"' + (String(v) === String(o[0]) ? " selected" : "") + ">" + o[1] + "</option>").join("") +
    "</select></label>"
  );
}
const FC_CTL = () =>
  selHTML("fcMode", "Mode", [
    ["sort", "Sort (Got it / Not yet)"],
    ["browse", "Browse (Previous / Next)"],

  ]) +
  selHTML("fcFirst", "Show first", [
    ["term", "Term"],
    ["def", "Definition"],
  ]);
const fcBrowse = () => SAVE.settings.fcMode === "browse";
const fcCur = () => (fcBrowse() ? FC.list[FC.i] : FC.q[0]);

function fcCardHTML(c) {
  const showTerm = SAVE.settings.fcFirst === "term" ? !FC.flip : FC.flip,
    starred = !!SAVE.star[c.id];

function fcHTML() {
  if (!FC) fcBuild();

    plural(FC.q.length, "card") +
    " left this round. Keys: Space flips · 1 Not yet · 2 or → Got it · ← Back · S star.</p>";

/* Every sort records enough to undo it exactly. */
function fcPush(id) {
  FC.hist.push({ q: FC.q.slice(), got: FC.got.slice(), learning: FC.learning.slice(), known: !!SAVE.known[id], trouble: SAVE.trouble[id], id: id });
}
ACT.fcflip = () => {
  FC.flip = !FC.flip;
  render();
};
ACT.fcagain = () => {
  FC = null;
  render();
};
ACT.fcgot = () => {
  if (fcBrowse() || !FC.q.length) return;
  const id = FC.q[0];
  fcPush(id);
  FC.q.shift();
  setKnown(id, true);
  if (FC.learning.indexOf(id) < 0 && FC.got.indexOf(id) < 0) FC.got.push(id);
  FC.flip = false;
  render();
};
ACT.fcnot = () => {
  if (fcBrowse() || !FC.q.length) return;
  const id = FC.q[0];
  fcPush(id);
  FC.q.shift();
  delete SAVE.known[id];
  SAVE.trouble[id] = (SAVE.trouble[id] || 0) + 1;
  if (FC.learning.indexOf(id) < 0) FC.learning.push(id);
  FC.q.splice(Math.min(FC.q.length, 4), 0, id);
  FC.flip = false;
  save();
  render();
};
ACT.fcback = () => {
  const h = FC && FC.hist.pop();
  if (!h) return;
  FC.q = h.q;
  FC.got = h.got;
  FC.learning = h.learning;
  if (h.known) SAVE.known[h.id] = true;
  else delete SAVE.known[h.id];
  if (h.trouble === undefined) delete SAVE.trouble[h.id];
  else SAVE.trouble[h.id] = h.trouble;
  FC.flip = false;
  save();
  render();
};
ACT.fclearn = () => {
  const ids = FC.learning.slice();
  fcBuild(ids);
  render();
};
ACT.fcprev = () => {
  if (FC.i > 0) FC.i--;
  FC.flip = false;
  render();
};
ACT.fcnext = () => {
  if (FC.i < FC.list.length - 1) FC.i++;
  FC.flip = false;
  render();
};
ACT.fcswap = () => {
  SAVE.settings.fcFirst = SAVE.settings.fcFirst === "term" ? "def" : "term";
  FC.flip = false;
  save();
  render();
};
ACT.fcshuf = () => {
  if (fcBrowse()) {
    FC.list = shuf(FC.list);
    FC.i = 0;
  } else FC.q = shuf(FC.q);
  FC.flip = false;
  render();
};
ACT.fcstar = () => {
  const id = fcCur();
  if (!id) return;
  if (SAVE.star[id]) delete SAVE.star[id];
  else SAVE.star[id] = true;
  save();
  render();
};
document.addEventListener("keydown", (e) => {
  if (!UNIT || UI.tab !== "flash" || UI.run || !FC) return;
  const tg = e.target && e.target.tagName;
  if (tg === "INPUT" || tg === "TEXTAREA" || tg === "SELECT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const browse = fcBrowse();
  if (!(browse ? FC.list.length : FC.q.length)) {
    if (!browse && e.key === "ArrowLeft") ACT.fcback();
    return;
  }
  if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault();
    ACT.fcflip();
  } else if (e.key === "ArrowRight") browse ? ACT.fcnext() : ACT.fcgot();
  else if (e.key === "ArrowLeft") browse ? ACT.fcprev() : ACT.fcback();
  else if (e.key === "s" || e.key === "S") ACT.fcstar();
  else if (!browse && e.key === "1") ACT.fcnot();
  else if (!browse && e.key === "2") ACT.fcgot();
});

ACT.qstart = () => {
  initQ();
  const q = UI.q,
    decks = D.decks.map((d) => d.id).filter((id) => q.decks[id]);
  if (!decks.length) {
    UI.qmsg = "Pick at least one deck.";
    return render();
  }
  let pool = shuf(ALL.filter((c) => decks.indexOf(c.deck) >= 0));
  const f = SAVE.settings.focus;
  if (f === "trouble") pool.sort((a, b) => (SAVE.trouble[b.id] || 0) - (SAVE.trouble[a.id] || 0));
  else if (f === "unknown") pool.sort((a, b) => (SAVE.known[a.id] ? 1 : 0) - (SAVE.known[b.id] ? 1 : 0));
  let nmc = Number(q.mc) || 0,
    ntf = Number(q.tf) || 0,
    nsc = Number(q.sc) || 0;
  const qt = SAVE.settings.qType;
  if (qt === "terms") nsc = 0;
  if (qt === "scen") nmc = ntf = 0;
  const qs = [],
    np = Number(q.nopt) || 4;
  if (pool.length) {
    for (let i = 0; i < nmc; i++) qs.push(mcQ(pool[i % pool.length], null, np));
    for (let i = 0; i < ntf; i++) qs.push(tfQ(pool[(nmc + i) % pool.length]));
  }
  shuf(D.sq.filter((s) => decks.indexOf(s.deck) >= 0))
    .slice(0, nsc)
    .forEach((s) => qs.push(scQ(s)));
  if (!qs.length) {
    UI.qmsg = "Nothing to ask with those settings.";
    return render();
  }
  UI.qmsg = "";
  startRun({ title: "Quiz", qs: q.order === "shuffle" ? shuf(qs) : qs, immediate: q.fb === "immediate", timer: Number(q.timer) || 0, retry: false, breakdown: true, again: true });
};
ACT.qagain = () => {

  stopTM();
  ACT.qstart();
};

/* 90-pt.js */
/* Practice Test and exams. Sections sit behind their own top tabs. One question at a time with a numbered
   palette (gray = not visited, outlined = visited, green = correct, red = incorrect, amber = partly right,
   ring = current, corner mark = flagged). Question types: mcq, tf, label, diagram, frq, saq. */
const PT = { sec: 0, secs: [], timerOn: false, elapsed: 0, iv: null, retest: null, msg: "", intro: {}, res: null };
const TYPE_NAME = { mcq: "Multiple choice", tf: "True or false", label: "Labeling", diagram: "Diagram labeling", frq: "Free response", saq: "Short answer" };
const newSt = () => ({ elim: [], visited: false, checked: false, sel: null, correct: null, flag: false, items: {}, work: "", abox: "", ans: {}, revealed: false, mark: null, pm: {} });
const isWritten = (q) => q.type === "frq" || q.type === "saq";
const itemsOf = (q) => (q.type === "diagram" ? q.pins.map((p, i) => Object.assign({ t: "Pin " + (i + 1) }, p)) : q.items);

function initPT() {
  D.practice.sections.forEach((s) => {
    const sec = { name: s.name, mode: s.mode || "practice", exam: s.exam || s.name, tips: s.tips || [], examTips: s.examTips || [], sources: s.sources || {}, qs: s.questions, byId: {}, cur: 0, st: {}, oo: {} };
    sec.qs.forEach((q) => {
      if (q.type === "tf") {
        q.options = ["True", "False"];
        q.ai = q.ans ? 0 : 1;
      } else if (q.type === "mcq") q.ai = q.ans;
      sec.byId[q.id] = q;
      sec.st[q.id] = newSt();
      if (q.type === "mcq") sec.oo[q.id] = q.options.map((o, i) => i);
    });
    sec.orig = sec.qs.map((q) => q.id);
    sec.order = sec.orig.slice();
    PT.secs.push(sec);
  });
  PTload(readJSON(PTK));
}

/* Points earned on one question, 0 to 1, or null if not answered yet. Multi-part items earn partial credit. */
function frac(q, s) {
  if (isWritten(q)) {
    const ks = q.parts.map((p) => p.k),
      pm = s.pm || {};
    if (ks.every((k) => pm[k] !== undefined)) return ks.filter((k) => pm[k]).length / ks.length;
    return null;
  }
  if (q.type === "label" || q.type === "diagram") {
    const it = itemsOf(q);
    return s.checked ? it.filter((x, i) => s.items[i] === x.ans).length / it.length : null;
  }
  return s.checked ? (s.correct ? 1 : 0) : null;
}
function status(q, s) {
  const f = frac(q, s);
  if (f !== null) return f === 1 ? "ok" : f === 0 ? "bad" : "partial";
  return s.visited ? "vis" : "new";
}
const ptMode = () => (UI.tab === "exam" ? "exam" : "practice");
function curView() {
  const sec = PT.secs[PT.sec],
    R = PT.retest && PT.retest.sec === PT.sec ? PT.retest : null;
  return { sec: sec, R: R, ids: R ? R.ids : sec.order, st: R ? R.st : sec.st, h: R || sec };
}
function cur3() {
  const v = curView(),
    id = v.ids[v.h.cur];
  return { v: v, id: id, q: v.sec.byId[id], s: v.st[id] };
}
function secScore(sec, ids, st) {
  let pts = 0,
    n = 0;
  ids.forEach((id) => {
    const f = frac(sec.byId[id], st[id]);
    if (f !== null) {
      n++;
      pts += f;
    }
  });
  return fmt1(pts) + " of " + plural(n, "point") + " so far";
}
const fmtT = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const ul = (a) => "<ol>" + a.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ol>";

          '"' +

          ' aria-label="Question ' +
          (n + 1) +
          (st[x].flag ? ", flagged" : "") +
          '">' +
          (n + 1) +
          "</button>",
      )
      .join("") +
    "</div>";
  h += '<p class="qtitle">Question ' + (hd.cur + 1) + " of " + ids.length + ", " + TYPE_NAME[q.type] + "</p>";
  h += srcHTML(q.src ? sec.sources[q.src] : null);
  const nav =
    '<button class="btn sec" data-act="ptprev"' +
    (hd.cur === 0 ? " disabled" : "") +
    ">Previous</button>" +
    '<button class="btn sec" data-act="ptnext"' +
    (hd.cur >= ids.length - 1 ? " disabled" : "") +
    ">Next</button>" +
    '<button class="btn ghost" data-act="ptflag" aria-pressed="' +
    !!s.flag +
    '">' +
    ICON.flag +
    (s.flag ? "Flagged" : "Flag for review") +
    "</button>";
  const tp = q.topic || q.skill;
  const topic = tp ? ' <span class="skill">' + esc(tp) + "</span>" : "";
  if (q.type === "mcq" || q.type === "tf") h += choiceQHTML(q, s, sec, id, nav, topic);
  else if (q.type === "label" || q.type === "diagram") {
    h += '<div class="stem">' + esc(q.stem) + "</div>";
    if (q.type === "diagram") h += diagramHTML(q, s);
    h += labelRowsHTML(q, s);
    const all = itemsOf(q).every((it, i) => s.items[i] !== undefined);
    h += '<div class="qnav"><button class="btn" data-act="ptcheck"' + (!all || s.checked ? " disabled" : "") + ">Check Answer</button>" + nav + "</div>";
    if (s.checked) {
      const it = itemsOf(q),
        n = it.filter((x, i) => s.items[i] === x.ans).length;
      h += '<div class="fb' + (s.correct ? " ok" : n ? "" : " bad") + '"><b>' + n + " of " + it.length + " correct.</b> You earn " + fmt1(n / it.length) + " of 1 point." + topic + "</div>";
    }
  } else h += writtenHTML(q, s, nav, topic);
  return h + "</section>";
}

/* ---------- actions ---------- */
function PTinput(t) {
  const c = cur3(),
    k = t.dataset.ans;

  else c.s.ans[k] = t.value;

/* A right answer in a retest round also updates the main section. */
function syncMain() {
  const R = PT.retest;
  if (!R || R.sec !== PT.sec) return;
  const sec = PT.secs[R.sec],
    c = cur3(),
    m = sec.st[c.id],
    r = R.st[c.id];
  if (frac(c.q, r) === 1) {
    Object.assign(m, { checked: r.checked, correct: r.correct, sel: r.sel, revealed: r.revealed, mark: r.mark });
    m.items = Object.assign({}, r.items);
    m.pm = Object.assign({}, r.pm);
  }
}
function checkCur() {
  const c = cur3();
  if (isWritten(c.q)) c.s.revealed = true;
  else if (c.q.type === "label" || c.q.type === "diagram") {
    const it = itemsOf(c.q);
    if (c.s.checked || !it.every((x, i) => c.s.items[i] !== undefined)) return;
    c.s.checked = true;
    c.s.correct = it.every((x, i) => c.s.items[i] === x.ans);
  } else {
    if (c.s.sel === null || c.s.checked) return;
    c.s.checked = true;
    c.s.correct = c.s.sel === c.q.ai;
  }
  syncMain();
  render();
}

ACT.ptshuffle = () => {

ACT.ptunshuffle = () => {

ACT.ptresetsec = () => {

ACT.ptretest = () => {
  const sec = PT.secs[PT.sec],
    ids = sec.order.filter((id) => ["bad", "partial"].indexOf(status(sec.byId[id], sec.st[id])) >= 0);
  if (!ids.length) {

/* ---------- saving ---------- */
function PTpack() {
  return {
    sec: PT.sec,
    timerOn: PT.timerOn,
    elapsed: PT.elapsed,
    intro: PT.intro,
    secs: PT.secs.map((s) => ({ name: s.name, order: s.order, cur: s.cur, st: s.st, oo: s.oo, shuffled: !!s.shuffled })),
    retest: PT.retest ? { sec: PT.retest.sec, ids: PT.retest.ids, st: PT.retest.st, cur: PT.retest.cur } : null,
  };
}
function PTsave() {
  if (PTK) writeJSON(PTK, PTpack());
}
function PTload(o) {
  try {
    if (!o || !o.secs) return;
    o.secs.forEach((x) => {
      const s = PT.secs.find((y) => y.name === x.name);
      if (!s) return;
      if (Array.isArray(x.order) && x.order.length === s.orig.length && x.order.every((id) => s.byId[id])) s.order = x.order;
      if (typeof x.cur === "number") s.cur = Math.min(Math.max(0, x.cur), s.order.length - 1);
      s.shuffled = x.shuffled === undefined ? !!o.shuffled : !!x.shuffled;
      s.qs.forEach((q) => {
        const st = x.st && x.st[q.id];
        if (st && typeof st === "object") {
          const n = Object.assign(newSt(), st, { items: Object.assign({}, st.items || {}), pm: Object.assign({}, st.pm || {}), ans: Object.assign({}, st.ans || {}), elim: (st.elim || []).slice() });
          /* Old World SAQ saves kept per-part marks in "parts". */
          if (st.parts && q.type === "saq") Object.keys(st.parts).forEach((k) => st.parts[k] !== null && (n.pm[k] = st.parts[k]));
          if (st.ans && typeof st.ans === "object" && q.type === "saq") n.ans = Object.assign({}, st.ans);
          s.st[q.id] = n;
        }
        const oo = x.oo && x.oo[q.id];
        if (q.type === "mcq" && Array.isArray(oo) && oo.length === q.options.length) s.oo[q.id] = oo;
      });
    });
    if (typeof o.sec === "number" && PT.secs[o.sec]) PT.sec = o.sec;
    PT.intro = o.intro || {};
    PT.elapsed = Number(o.elapsed) || 0;
    PT.retest = null;
    if (o.retest && PT.secs[o.retest.sec] && Array.isArray(o.retest.ids)) {
      const rs = PT.secs[o.retest.sec];
      if (o.retest.ids.every((id) => rs.byId[id])) {
        PT.retest = { sec: o.retest.sec, ids: o.retest.ids, st: {}, cur: o.retest.cur || 0 };
        o.retest.ids.forEach((id) => (PT.retest.st[id] = Object.assign(newSt(), (o.retest.st || {})[id] || {})));
      }
    }
    if (o.timerOn && !PT.timerOn) {
      PT.timerOn = true;
      PT.iv = setInterval(tick, 1000);
    }
  } catch (e) {}
}
function PTreset() {
  PT.secs.forEach((s) => {
    s.qs.forEach((q) => {
      s.st[q.id] = newSt();
      if (q.type === "mcq") s.oo[q.id] = q.options.map((o, i) => i);
    });
    s.order = s.orig.slice();
    s.cur = 0;
    s.shuffled = false;
  });
  PT.retest = null;
  PT.elapsed = 0;
  PT.sec = 0;
  PTsave();
}

/* 95-results.js */
/* Per-exam results page (score with partial credit, by type, what to study next, question by question) and
   the Progress tab (every practice topic ranked weakest first). */
const topicOf = (q) => q.topic || q.skill || "Other";
function reviewDeck(topic) {
  const d = D.topicDeck && D.topicDeck[topic];
  return d === undefined ? null : D.allDecks.find((x) => x.id === d) || null;
}
const barHTML = (p) => '<span class="bar ' + (p < 60 ? "low" : p < 85 ? "mid" : "high") + '" aria-hidden="true"><i style="width:' + p + '%"></i></span>';
const jumpBtn = (si, q, label) => '<button class="lnk" data-act="progjump" data-s="' + si + '" data-id="' + esc(q.id) + '">' + esc(label) + "</button>";

function resDetail(q, s) {
  if (q.type === "mcq" || q.type === "tf")
    return "<p><b>Your answer:</b> " + (s.sel == null ? "none" : esc(q.options[s.sel])) + "</p><p><b>Correct answer:</b> " + esc(q.options[q.ai]) + '</p><p class="muted">' + esc(q.exp) + "</p>";
  if (q.type === "label" || q.type === "diagram")
    return (
      "<ul>" +
      itemsOf(q)
        .map((it, i) => {
          const sel = s.items[i],
            ok = sel === it.ans;
          return (
            "<li>" +
            esc(q.type === "diagram" ? "Pin " + (i + 1) : it.t) +
            ": " +
            (ok ? "<b>" + esc(q.labels[it.ans]) + "</b>, correct" : "you said " + (sel === undefined ? "nothing" : esc(q.labels[sel])) + ", correct is <b>" + esc(q.labels[it.ans]) + '</b>. <span class="muted">' + esc(it.exp || "") + "</span>") +
            "</li>"
          );
        })
        .join("") +
      "</ul>"
    );
  return (
    '<ol class="fparts" type="a">' +
    q.parts
      .map((p) => "<li><p><b>" + (s.pm[p.k] === true ? "Got it. " : s.pm[p.k] === false ? "Missed. " : "") + "</b>" + esc(p.prompt) + "</p><p>" + esc(p.tea ? p.tea.join(" ") : p.model) + "</p></li>")
      .join("") +
    "</ol>"
  );
}

function resHTML(group) {
  const secs = PT.secs.map((sec, si) => ({ sec: sec, si: si })).filter((x) => x.sec.mode === "exam" && x.sec.exam === group);
  let tot = 0,
    ok = 0,
    done = 0;
  const byType = {},
    byTopic = {},
    rows = [];
  secs.forEach((x) =>
    x.sec.orig.forEach((id, n) => {
      const q = x.sec.byId[id],
        s = x.sec.st[id],
        f0 = frac(q, s),
        f = f0 === null ? 0 : f0;
      tot++;
      ok += f;
      if (f0 !== null) done++;
      const T = (byType[TYPE_NAME[q.type]] = byType[TYPE_NAME[q.type]] || { ok: 0, tot: 0, n: 0 });
      T.tot++;
      T.ok += f;
      if (f0 !== null) T.n++;
      const P = (byTopic[topicOf(q)] = byTopic[topicOf(q)] || { ok: 0, tot: 0, bad: 0, none: 0 });
      P.tot++;
      P.ok += f;
      if (f0 === null) P.none++;
      else if (f0 < 1) P.bad++;
      rows.push({ x: x, q: q, s: s, f0: f0, n: n });
    }),
  );
  let h = '<section class="panel"><div class="rtop"><h2>' + esc(group) + " results</h2></div>";
  if (!done) return h + '<p class="muted">Nothing checked yet. Work through this exam, press Check Answer (or self-mark written answers), then come back. Each exam is scored on its own.</p></section>';
  const pct = Math.round((ok / tot) * 100);
  h +=
    '<div class="fb' +
    (pct >= 85 ? " ok" : pct < 60 ? " bad" : "") +
    '"><p class="big">' +
    fmt1(ok) +
    " of " +
    tot +
    " points (" +
    pct +
    "%)</p><p>Partial credit counts." +
    (done < tot ? " " + plural(tot - done, "question") + " not answered or self-marked yet, worth 0 points." : "") +
    " " +
    (pct >= 85 ? "Strong. Review the few misses below." : pct >= 70 ? "Solid, but the topics below still need work." : "Not there yet. Use the study list below, then retake this exam.") +
    "</p></div>";
  h +=
    '<h3>By question type</h3><div class="wk">' +
    Object.keys(byType)
      .map((k) => {
        const t = byType[k],
          p = Math.round((t.ok / t.tot) * 100);
        return '<div class="wkrow"><div class="wkhead"><b>' + esc(k) + "</b><span>" + fmt1(t.ok) + " of " + t.tot + " points" + (t.n < t.tot ? ", " + (t.tot - t.n) + " not answered" : "") + "</span></div>" + barHTML(p) + "</div>";
      })
      .join("") +
    "</div>";
  const need = Object.keys(byTopic)
    .filter((k) => byTopic[k].bad || byTopic[k].none)
    .sort((a, b) => byTopic[a].ok / byTopic[a].tot - byTopic[b].ok / byTopic[b].tot);
  h += "<h3>What to study next</h3>";
  if (!need.length) h += "<p>Nothing missed. Try the Practice Test sections for more.</p>";
  else
    h +=
      '<div class="wk">' +
      need
        .map((k) => {
          const t = byTopic[k],
            p = Math.round((t.ok / t.tot) * 100),
            dk = reviewDeck(k);
          const miss = rows.filter((r) => topicOf(r.q) === k && r.f0 !== 1);
          return (
            '<div class="wkrow"><div class="wkhead"><b>' +
            esc(k) +
            "</b><span>" +
            fmt1(t.ok) +
            " of " +
            t.tot +
            " points" +
            (t.none ? ", " + t.none + " not answered" : "") +
            "</span></div>" +
            barHTML(p) +
            '<p class="wkmiss">Go back to: ' +
            miss.map((r) => jumpBtn(r.x.si, r.q, r.x.sec.name + ", question " + (r.n + 1))).join(", ") +
            "</p>" +
            (dk ? '<p class="wkrev">Then review <b>' + esc(dk.name) + "</b> in the Study guide.</p>" : "") +
            "</div>"
          );
        })
        .join("") +
      "</div>";
  h += "<h3>Question by question</h3>";
  rows.forEach((r) => {
    const st = r.f0 === null ? "none" : r.f0 === 1 ? "ok" : r.f0 > 0 ? "partial" : "bad";
    const parts = isWritten(r.q) ? r.q.parts.length : r.q.type === "label" || r.q.type === "diagram" ? itemsOf(r.q).length : 1;
    const lbl = { ok: "Correct", bad: "Missed", none: "Not answered", partial: "Partly right, " + fmt1(r.f0 * parts) + " of " + parts }[st];
    const stem = r.q.title || r.q.stem || r.q.lead || "";
    h +=
      '<details class="resq ' +
      st +
      '"' +
      (st === "ok" ? "" : " open") +
      '><summary><span class="pal ' +
      st +
      '" aria-hidden="true">' +
      (r.n + 1) +
      "</span><span><b>" +
      lbl +
      "</b> " +
      esc(r.x.sec.name) +
      ", " +
      esc(TYPE_NAME[r.q.type]) +
      ' <span class="skill">' +
      esc(topicOf(r.q)) +
      "</span><br>" +
      esc(stem.length > 160 ? stem.slice(0, 160) + "..." : stem) +
      "</span></summary>" +
      (st === "ok"
        ? ""
        : '<div class="resd">' +
          (r.f0 !== null || isWritten(r.q) ? resDetail(r.q, r.s) : '<p class="muted">You did not check this question.</p>') +
          "<p>" +
          jumpBtn(r.x.si, r.q, "Go to this question") +
          "</p></div>") +
      "</details>";
  });
  return h + "</section>";
}

function progHTML() {
  const T = {};
  PT.secs.forEach((sec, si) =>
    sec.qs.forEach((q) => {
      const o = (T[topicOf(q)] = T[topicOf(q)] || { ok: 0, n: 0, miss: [], total: 0 });
      o.total++;
      const f = frac(q, sec.st[q.id]);
      if (f !== null) {
        o.n++;
        o.ok += f;
        if (f < 1) o.miss.push({ si: si, q: q });
      }
    }),
  );
  const rows = Object.keys(T)
    .map((n) => ({ n: n, o: T[n], pct: T[n].n ? T[n].ok / T[n].n : null }))
    .sort((a, b) => (a.pct === null) - (b.pct === null) || (a.pct || 0) - (b.pct || 0));
  let h = '<section class="panel"><h2>Weak topics</h2>';
  h += rows.some((r) => r.o.n)
    ? '<p class="muted">Every question you have checked or self-marked, ranked weakest first. Under 3 answers counts as an early number.</p>'
    : '<p class="muted">Answer some practice or exam questions and your topics show up here, weakest first.</p>';
  h += '<div class="wk">';
  rows.forEach((r) => {
    const p = r.pct === null ? 0 : Math.round(r.pct * 100),
      dk = reviewDeck(r.n);
    h +=
      '<div class="wkrow"><div class="wkhead"><b>' +
      esc(r.n) +
      "</b><span>" +
      (r.pct === null ? "Not started" : fmt1(r.o.ok) + " of " + r.o.n + " points (" + p + "%)" + (r.o.n < 3 ? ", early" : "")) +
      ", " +
      plural(r.o.total, "question") +
      " in the kit</span></div>" +
      barHTML(p);
    if (r.o.miss.length) h += '<p class="wkmiss">Missed: ' + r.o.miss.map((m) => jumpBtn(m.si, m.q, PT.secs[m.si].name + ", question " + (PT.secs[m.si].orig.indexOf(m.q.id) + 1))).join(", ") + "</p>";
    if (dk && (r.pct === null || r.pct < 0.85)) h += '<p class="wkrev">Review <b>' + esc(dk.name) + "</b> in the Study guide.</p>";
    h += "</div>";
  });
  h += "</div>";
  const tr = Object.keys(SAVE.trouble).filter((k) => SAVE.trouble[k] && !SAVE.known[k] && BYID[k]).length;
  if (tr) h += '<p class="muted">You also have ' + plural(tr, "trouble term") + " in the Flashcards pool.</p>";
  return h + "</section>";
}
ACT.progjump = (t) => {
  const si = Number(t.dataset.s),
    sec = PT.secs[si];
  UI.tab = sec.mode === "exam" ? "exam" : "pt";
  PT.res = null;
  PT.sec = si;
  PT.retest = null;
  const i = sec.order.indexOf(t.dataset.id);
  if (i >= 0) sec.cur = i;
  render();
  window.scrollTo(0, 0);
};

if (UNIT) {
  initShell();
  initPT();
  restoreL();
}
render();
