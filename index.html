<!doctype html>
<html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewish History Honors Study Kit</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
/* Design tokens shared by the Study Hub and every kit. The course accent comes from course.json
   (set at runtime as --accent-l / --accent-d). */
:root {
  --ground: #E9EBEE; --sheet: #FFFFFF; --sunk: #F3F4F6; --ink: #1A1D21; --ink-2: #555C65; --rule: #D6DAE0;
  --ok: #23774A; --ok-wash: #E3F2E9; --bad: #B3261E; --bad-wash: #FBE9E7; --mid: #9A5B00; --mid-wash: #FCF0DC;
  --t0: #3E6FB0; --t1: #B5552F; --t2: #3D8A5F; --t3: #7A5BB5; --t4: #A8862A; --t5: #3B8C99; --t6: #A54C79; --t7: #6B7280;
  --accent: var(--accent-l, #2C5AA0); --on-accent: #FFFFFF;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 8px; --r-sm: 6px; --fast: 120ms; --mid-t: 180ms;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #15171A; --sheet: #202328; --sunk: #1A1C20; --ink: #ECEEF0; --ink-2: #A5ABB3; --rule: #363A40;
  --ok: #6CC495; --ok-wash: #183527; --bad: #F08A80; --bad-wash: #3D1F1C; --mid: #E7B45F; --mid-wash: #3A2C14;
  --t0: #86AEEF; --t1: #E8977A; --t2: #7BC79B; --t3: #B49BEA; --t4: #D9BC63; --t5: #79C3CE; --t6: #DB8DB5; --t7: #A5ABB3;
  --accent: var(--accent-d, #86AEEF); --on-accent: #15171A; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --ground: #15171A; --sheet: #202328; --sunk: #1A1C20; --ink: #ECEEF0; --ink-2: #A5ABB3; --rule: #363A40;
    --ok: #6CC495; --ok-wash: #183527; --bad: #F08A80; --bad-wash: #3D1F1C; --mid: #E7B45F; --mid-wash: #3A2C14;
    --t0: #86AEEF; --t1: #E8977A; --t2: #7BC79B; --t3: #B49BEA; --t4: #D9BC63; --t5: #79C3CE; --t6: #DB8DB5; --t7: #A5ABB3;
    --accent: var(--accent-d, #86AEEF); --on-accent: #15171A; color-scheme: dark;
  }
}
:root { --accent-wash: color-mix(in srgb, var(--accent) 10%, var(--sheet)); }

/* Study kit layout and components. Uses tokens.css only. */
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 1rem/1.55 var(--sans); }
#app { max-width: 60rem; margin: 0 auto; padding: 0 16px 72px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h1 { font: 600 clamp(2rem, 5vw, 2.8rem)/1.05 var(--serif); letter-spacing: -.01em; }
h2 { font: 600 1.55rem/1.2 var(--serif); }
h3 { font-size: 1.05rem; font-weight: 600; margin: 22px 0 8px; }
h4 { font-size: .95rem; font-weight: 600; margin: 14px 0 6px; }
p { margin: 8px 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; }
.muted, .hint { color: var(--ink-2); }
.hint { font-size: .9rem; }
.big { font-size: 1.25rem; font-weight: 600; }

/* header */
.top { padding: 22px 0 14px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
.hublink { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .95rem; }
.hublink:hover { color: var(--accent); }
.credit { margin: 40px 0 8px; text-align: center; font-size: .85rem; color: var(--ink-2); }
.credit a { color: inherit; }
.credit a:hover { color: var(--accent); }
.kicker { margin: 0 0 6px; color: var(--accent); font-weight: 600; }
.lede { color: var(--ink-2); max-width: 60ch; }
.meter { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 16px; color: var(--ink-2); font-size: .95rem; }
.meter .bar { flex: 1 1 160px; }
.bar { display: block; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width var(--mid-t); }
.bar.low i { background: var(--bad); } .bar.mid i { background: var(--mid); } .bar.high i { background: var(--ok); }

/* tabs and chips */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--ground); border-bottom: 1px solid var(--rule); margin: 0 -16px; padding: 0 16px; }
.tabrow { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 13px 12px 10px; color: var(--ink-2); font-weight: 600; }
.tab:hover { color: var(--ink); }
.tab[aria-current] { color: var(--ink); border-bottom-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 6px 13px; font-size: .92rem; }
.chip small { color: var(--ink-2); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.t0 { background: var(--t0); } .dot.t1 { background: var(--t1); } .dot.t2 { background: var(--t2); } .dot.t3 { background: var(--t3); }
.dot.t4 { background: var(--t4); } .dot.t5 { background: var(--t5); } .dot.t6 { background: var(--t6); } .dot.t7 { background: var(--t7); }
main { padding-top: 18px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 8px 18px; border-radius: var(--r-sm); border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; transition: background-color var(--fast), border-color var(--fast); }
.btn:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.btn.sec { background: var(--sheet); color: var(--ink); border-color: var(--rule); }
.btn.sec:hover { border-color: var(--ink-2); background: var(--sheet); }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: transparent; padding: 8px 10px; min-height: 38px; font-weight: 500; }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.btn.ghost[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn:not(.ghost).danger { background: var(--sheet); border-color: var(--bad); }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }

/* panels */
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 24px; margin-bottom: 18px; }
.rtop { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 12px; }
.rtop h2 { margin-right: auto; }
.msg { color: var(--bad); font-weight: 600; }
.kbd { color: var(--ink-2); font-size: .85rem; margin-top: -6px; }

/* questions and choices */
.lockt { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--ink-2); margin-bottom: 4px; }
.qask { color: var(--ink-2); font-weight: 600; margin: 14px 0 4px; }
.qprompt, .stem { font-size: 1.12rem; line-height: 1.5; margin: 6px 0 16px; max-width: 70ch; }
.opts { display: grid; gap: 10px; }
.opts.tf { grid-template-columns: repeat(2, minmax(0, 12rem)); }
.optrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
.opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--sheet); border: 1.5px solid var(--rule); border-radius: var(--r-sm); padding: 12px 14px; transition: border-color var(--fast), background-color var(--fast); }
.opt:not(:disabled):hover { border-color: var(--ink-2); }
.opt .k { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--rule); font-size: .85rem; font-weight: 600; color: var(--ink-2); }
.opt .ot { padding-top: 1px; }
.opt.sel { border-color: var(--accent); background: var(--accent-wash); }
.opt.sel .k { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--ok); background: var(--ok-wash); }
.opt.right .k { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.opt.wrong { border-color: var(--bad); background: var(--bad-wash); }
.opt.wrong .k { border-color: var(--bad); background: var(--bad); color: var(--sheet); }
.opt:disabled { cursor: default; color: var(--ink); }
.crossed .opt .ot { text-decoration: line-through; color: var(--ink-2); }
.crossed .opt { opacity: .7; }
.xoff { width: 40px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; color: var(--ink-2); border-radius: var(--r-sm); }
.xoff:hover { background: var(--sunk); color: var(--ink); }
.xoff[aria-pressed="true"] { color: var(--accent); }
.fb { margin-top: 18px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--sunk); border-left: 4px solid var(--ink-2); }
.fb.ok { background: var(--ok-wash); border-left-color: var(--ok); }
.fb.bad { background: var(--bad-wash); border-left-color: var(--bad); }
.fb p:first-child { margin-top: 0; } .fb p:last-child { margin-bottom: 0; }
.why { margin-top: 10px; padding: 12px 16px; border-radius: var(--r-sm); border: 1px solid var(--rule); }
.why .wh { font-size: .85rem; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.why.bad .wh { color: var(--bad); } .why.good .wh { color: var(--ok); }
.why p { margin: 6px 0 0; }
.qt { display: block; font-weight: 600; }
.whyall { margin-top: 10px; }
.whyall summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 6px 0; }
.whyall ul { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 10px; }
.whyall li { padding: 10px 14px; background: var(--sunk); border-radius: var(--r-sm); }
.whyall li p { margin: 4px 0 0; }
.tag { display: inline-block; margin-top: 4px; font-size: .8rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.tag.ok { background: var(--ok-wash); color: var(--ok); } .tag.bad { background: var(--bad-wash); color: var(--bad); }
.hook { display: block; margin-top: 6px; color: var(--ink-2); font-size: .94rem; }
.hook b { color: var(--accent); font-weight: 600; margin-right: 4px; }
.skill { display: inline-block; font-size: .8rem; font-weight: 600; color: var(--ink-2); background: var(--sunk); border: 1px solid var(--rule); padding: 0 8px; border-radius: 999px; vertical-align: 1px; }

/* learn */
.lessonbar { margin-bottom: 14px; }
.lessonbar .rtop { margin-bottom: 8px; }
.lmap { margin-top: 14px; display: grid; gap: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; }
.lmdeck h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.lmlist { display: flex; flex-wrap: wrap; gap: 6px; }
.lm { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 5px 10px; font-size: .9rem; }
.lm.done { color: var(--ok); }
.lm[aria-current] { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; color: var(--ink); }
.deckname { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 600; font-size: .92rem; margin: 0 0 4px; }
.terms { margin: 16px 0 0; display: grid; gap: 0; }
.terms > div { display: grid; grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr); gap: 4px 20px; padding: 13px 0; border-top: 1px solid var(--rule); }
.terms > div:first-child { border-top: 0; }
.terms dt { font-weight: 600; }
.terms dd { margin: 0; }
.terms.guide > div { grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr) auto; }
.know { align-self: start; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 4px 10px; font-size: .85rem; color: var(--ink-2); white-space: nowrap; }
.know[aria-pressed="true"] { color: var(--ok); border-color: var(--ok); background: var(--ok-wash); font-weight: 600; }
.chain { margin: 18px 0; }
.chain figcaption { font-weight: 600; font-size: .92rem; color: var(--ink-2); margin-bottom: 8px; }
.chain ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; counter-reset: c; }
.chain li { position: relative; background: var(--accent-wash); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--rule)); border-radius: var(--r-sm); padding: 7px 12px; font-size: .95rem; }
.chain li + li { margin-left: 22px; }
.chain li + li::before { content: ""; position: absolute; left: -20px; top: 50%; width: 14px; height: 2px; background: var(--ink-2); }
.chain li + li::after { content: ""; position: absolute; left: -10px; top: calc(50% - 4px); border: 5px solid transparent; border-left-color: var(--ink-2); border-right: 0; }
.watch { margin: 16px 0; padding: 12px 16px; border-left: 4px solid var(--mid); background: var(--mid-wash); border-radius: var(--r-sm); }
.watch b { display: block; color: var(--mid); margin-bottom: 2px; }
.scorebig { font: 600 2.6rem/1 var(--serif); margin: 14px 0 0; }
.missed { padding-left: 20px; }
.missed li { margin: 6px 0; }

/* study guide */
.deckblock { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 22px 24px; margin-bottom: 18px; }
.deckblock > h2 { display: flex; align-items: center; gap: 10px; }
.tree { background: var(--sunk); border-radius: var(--r-sm); padding: 14px 16px; overflow-x: auto; font: .92rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.tablewrap { margin: 16px 0; }
.tablewrap figcaption { font-weight: 600; margin-bottom: 8px; }
.scrollx { overflow-x: auto; }
.gt { border-collapse: collapse; width: 100%; font-size: .95rem; }
.gt th, .gt td { border: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
.gt th { background: var(--sunk); font-weight: 600; }
.breakdown { max-width: 34rem; margin: 14px 0; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 16px 24px; }
.cblock h3 { margin-top: 6px; }
.cblock ul { padding-left: 18px; margin: 0; }

/* flashcards */
.ctl { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-bottom: 16px; }
.ctl label, .grp label { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: .95rem; }
select, input[type="number"] { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 6px 8px; color: var(--ink); }
input[type="number"] { width: 4.5rem; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.fcard { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; width: 100%; min-height: 15rem; padding: 32px; background: var(--sheet); border: 1px solid var(--rule); border-top: 4px solid var(--accent); border-radius: var(--r); text-align: center; }
.fterm { font: 600 2rem/1.15 var(--serif); }
.fdef { font-size: 1.15rem; max-width: 50ch; }
.fcard small { color: var(--ink-2); }
.fcnav .btn { flex: 1 1 8rem; }
.fctools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.fctools [aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.fcprog { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 12px; }
.fcprog .muted { flex: none; font-size: .92rem; }
.fcprog .bar { flex: 1 1 140px; }
.srb { margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: .8rem; font-weight: 600; white-space: nowrap; }

/* forms */
.form fieldset { border: 0; padding: 0; margin: 18px 0 0; }
.form legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.grp { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.chk { display: flex; align-items: flex-start; gap: 10px; margin: 12px 0; }
.chk input { margin-top: 3px; }
textarea { width: 100%; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 10px 12px; line-height: 1.5; resize: vertical; margin-top: 12px; }

/* practice test */
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.stab { border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 7px 13px; font-size: .92rem; color: var(--ink-2); }
.stab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); font-weight: 600; }
.stab.res { border-style: dashed; }
.ptctl { display: flex; flex-wrap: wrap; gap: 2px; margin: 0 -10px 10px; }
.score { color: var(--ink-2); font-weight: 600; font-size: .95rem; }
.banner { background: var(--accent-wash); border-radius: var(--r-sm); padding: 10px 14px; margin-bottom: 12px; }
.intro { margin-bottom: 12px; }
.disclose { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.disclose .ic { transition: transform var(--fast); }
.disclose[aria-expanded="true"] .ic { transform: rotate(90deg); }
.intro ol { margin: 8px 0; padding-left: 22px; }
.intro li { margin: 4px 0; }
.pals { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
.pal { position: relative; width: 38px; height: 38px; border-radius: var(--r-sm); border: 1.5px solid var(--rule); background: var(--sunk); color: var(--ink-2); font-weight: 600; font-size: .9rem; }
.pal.vis { background: var(--sheet); border-color: var(--mid); color: var(--ink); }
.pal.ok { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.pal.bad { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.pal.partial { background: var(--mid-wash); border-color: var(--mid); color: var(--mid); }
.pal.none { background: var(--sunk); }
.pal[aria-current] { outline: 2.5px solid var(--ink); outline-offset: 2px; }
.pal.flag::after { content: ""; position: absolute; top: -1px; right: -1px; border: 7px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); border-top-right-radius: var(--r-sm); }
.qtitle { color: var(--ink-2); font-size: .9rem; font-weight: 600; margin: 0 0 6px; }
.qhead { font: 600 1.25rem/1.25 var(--serif); margin: 4px 0 8px; }
.src { margin: 0 0 16px; padding: 16px 18px; background: var(--sunk); border: 1px solid var(--rule); border-radius: var(--r-sm); }
.src figcaption b { display: block; }
.sattr, .slab { display: block; font-size: .88rem; color: var(--ink-2); }
.srcimg { display: block; max-width: 100%; height: auto; margin: 12px 0; border-radius: 4px; }
.stext { font-family: var(--serif); font-size: 1.08rem; line-height: 1.6; max-width: 68ch; }
.pn { font-family: var(--sans); font-size: .8rem; font-weight: 600; color: var(--ink-2); margin-right: 6px; }
.litems { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.litem { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr); gap: 8px 16px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r-sm); }
.litem.pinrow { grid-template-columns: auto minmax(0, 1fr); }
.litem.right { border-color: var(--ok); background: var(--ok-wash); }
.litem.wrong { border-color: var(--bad); background: var(--bad-wash); }
.lt { display: flex; gap: 10px; align-items: baseline; font-weight: 600; }
.ln { display: inline-grid; place-items: center; min-width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--sheet); font-size: .8rem; }
.lbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.lb { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 5px 12px; font-size: .92rem; }
.lb.sel { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.lb.right { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.lb.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.lb:disabled { cursor: default; }
.lfb { grid-column: 1 / -1; font-size: .93rem; }
.diagram { margin: 0 0 16px; }
.dimg { position: relative; display: inline-block; max-width: 100%; background: #fff; border: 1px solid var(--rule); border-radius: var(--r-sm); }
.dimg img { display: block; max-width: 100%; max-height: 34rem; width: auto; height: auto; border-radius: var(--r-sm); }
.pin { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #1A1D21; color: #fff; font-size: .85rem; font-weight: 700; border: 2px solid #fff; box-shadow: 0 0 0 1px #1A1D21; }
.pin.set { background: var(--accent-l, #2C5AA0); }
.pin.right { background: #23774A; } .pin.wrong { background: #B3261E; }
.credit { font-size: .82rem; color: var(--ink-2); margin-top: 6px; }
.fparts { padding-left: 22px; }
.fparts li { margin: 6px 0; }
.part { display: block; margin-top: 16px; }
.pl { display: block; font-weight: 600; }
.pl small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.model { margin-top: 20px; padding: 18px; background: var(--accent-wash); border-radius: var(--r-sm); }
.model h4 { margin-top: 0; font-size: 1rem; }
.mpart { padding: 12px 0; border-top: 1px solid color-mix(in srgb, var(--accent) 25%, var(--rule)); }
.mpart:first-of-type { border-top: 0; }
.tea { margin: 8px 0; display: grid; gap: 6px; }
.tea > div { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 10px; }
.tea dt { font-weight: 600; color: var(--accent); }
.tea dd { margin: 0; }
.earns, .weak { font-size: .95rem; }
.weak { color: var(--ink-2); }
.selfmark { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.selfmark > span { font-weight: 600; font-size: .9rem; margin-right: 4px; }
.mk { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 6px 12px; font-size: .9rem; }
.mk.on.right { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.mk.on.wrong { border-color: var(--bad); background: var(--bad); color: var(--sheet); }

/* results and progress */
.wk { display: grid; gap: 14px; }
.wkhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 6px; }
.wkhead span { color: var(--ink-2); font-size: .92rem; }
.wkmiss, .wkrev { font-size: .92rem; margin: 6px 0 0; }
.resq { border: 1px solid var(--rule); border-radius: var(--r-sm); margin: 8px 0; }
.resq summary { display: flex; gap: 12px; padding: 10px 12px; cursor: pointer; list-style: none; }
.resq summary::-webkit-details-marker { display: none; }
.resq .pal { flex: none; }
.resd { padding: 0 14px 12px 62px; }

/* course home */
.course { margin-bottom: 4px; }
.unitlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.unitrow { display: grid; grid-template-columns: 7rem minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 20px 24px; background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: var(--r); color: inherit; text-decoration: none; transition: border-color var(--fast); }
.unitrow:hover { border-color: var(--accent); }
.ulabel { font-weight: 600; color: var(--accent); }
.ubody { display: grid; gap: 4px; }
.utitle { font: 600 1.35rem/1.2 var(--serif); }
.ublurb { color: var(--ink-2); }
.ustat { font-size: .9rem; color: var(--ink-2); }
.ugo { display: flex; align-items: center; gap: 4px; font-weight: 600; color: var(--accent); }

@media (max-width: 640px) {
  .panel, .deckblock { padding: 18px 16px; }
  .terms > div, .terms.guide > div { grid-template-columns: minmax(0, 1fr); }
  .terms.guide .know { justify-self: start; }
  .litem:not(.pinrow) { grid-template-columns: minmax(0, 1fr); }
  .tea > div { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .unitrow { grid-template-columns: minmax(0, 1fr) auto; padding: 16px; }
  .ulabel { grid-column: 1 / -1; }
  .resd { padding-left: 14px; }
  .opts.tf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  body { background: #fff; }
  .tabs, .chips, .topbar, .meter, .noprint, .qnav, .ptctl { display: none !important; }
  .panel, .deckblock { border: 0; padding: 0; }
}

/* Plain-language intros (deck big picture, section story) */
.intro { margin: 12px 0 16px; padding: 12px 16px; border-left: 4px solid var(--accent); background: var(--sunk); border-radius: var(--r-sm); }
.intro p { margin: 0 0 8px; line-height: 1.6; }
.intro p:last-child { margin-bottom: 0; }
.intro .introhead { font-weight: 700; font-size: .92rem; color: var(--accent); margin-bottom: 6px; }
.intro.bigpic { background: transparent; border: 1px solid var(--rule); border-left: 4px solid var(--accent); }
.introfold { margin: 8px 0 12px; }
.introfold summary { cursor: pointer; font-weight: 600; color: var(--accent); }

<script>
const COURSE = {"id":"jhist","name":"Jewish History Honors","tagline":"One kit per test. Pick a test to study; progress in each one is saved in this browser.","hub":"https://dn4563.github.io/Study-Hub-by-David/","accent":"#7A4E2D","accentDark":"#D9A47E","examTab":"Mock test","units":[{"id":"u1","label":"Test 1","title":"Avraham to Nation","blurb":"Avraham and the covenant, the family tree, Egypt and becoming a nation, antisemitism and evaluating claims, Israel's mandate and government, and how traditions develop.","learnMix":true}]};
const UNITDATA = {"u1":{"images":{},"decks":[{"id":1,"name":"Mesopotamia and the Call","optional":false,"sections":[{"name":"Where Avraham started","cards":[{"term":"Mesopotamia","def":"The land between the Tigris and Euphrates rivers, part of the Fertile Crescent, where Avraham was born.","hook":"Between the rivers.","asks":[{"q":"A historian says Avraham's story begins in a wealthy, river-watered region. Which detail from your evidence packet best supports this?","right":"Canals from two rivers irrigated its fields","wrong":[["Its farms depended on seasonal rainfall alone","That describes Canaan, not Mesopotamia."],["It had no cities, only nomads and herders in tents","Ur was part of a highly developed urban civilization."],["It was a small coastal strip on the Mediterranean Sea","That describes Canaan's location."]],"exp":"The Tigris and Euphrates supported irrigation, grain and wealth."}]},{"term":"Ur","def":"An important city in southern Mesopotamia with irrigation canals, temples, writing and long-distance trade.","hook":"Avraham's starting point.","asks":[{"q":"Which detail would a wealthy household in Ur most likely give as a reason to stay?","right":"Settled wealth, trade and family networks","wrong":[["Canaan was empty land that nobody had claimed yet","The packet says Canaan was already inhabited; that is not a reason to stay anyway."],["Ur depended on rainfall that failed in some years","Ur relied on river irrigation; Canaan relied on rainfall."],["Ur had no temples, writing or organized government","Ur had temples, writing and officials."]],"exp":"Ur offered an established life: livestock, goods, land rights and family and business ties."}]},{"term":"Canaan","def":"Region on the eastern Mediterranean with hill country and valleys, farmed with rain rather than river irrigation, and already inhabited.","hook":"The land G-d will show.","asks":[{"q":"According to the evidence packet, which risk did a household moving to Canaan face that Ur's farmers faced less?","right":"Drought when seasonal rain failed","wrong":[["Floods from the Tigris and Euphrates rivers","Those rivers are in Mesopotamia, not Canaan."],["Having no neighbors or other peoples nearby","Canaan was already inhabited by different groups."],["A total lack of trade routes in or out of the region","Routes linked Canaan to Egypt, the north and the coast."]],"exp":"Canaan depended on rainfall, so drought and famine were serious dangers."}]},{"term":"Haran","def":"City in northern Mesopotamia on the route between Ur and Canaan, where Avraham was living when G-d called him.","hook":"The stop before the call.","asks":[{"q":"On the trade-route map, which city sits between Ur and Canaan?","right":"Haran","wrong":[["Babylon, on the Euphrates","Babylon is in southern Mesopotamia near Ur, not between Ur and Canaan."],["Egypt, south of Canaan","Egypt is beyond Canaan, not between Ur and Canaan."],["Goshen, in Egypt","Goshen is the region in Egypt where Jacob's family settled."]],"exp":"The route ran Ur → Haran → Canaan → Egypt."}]},{"term":"Dangers of travel","def":"Journeys took weeks or months and risked weather, hard terrain, lack of water, illness, theft and attack.","hook":"The cost of the road.","asks":[{"q":"Why does the evidence packet's description of travel make Avraham's departure more striking?","right":"It shows how costly and risky leaving was","wrong":[["It proves Avraham traveled by sea to Canaan","The packet describes overland routes."],["It shows travel was quick and completely safe","It lists many dangers and long travel times."],["It explains why Avraham never reached Canaan","Avraham did reach Canaan."]],"exp":"Leaving meant risking a long, dangerous journey."}]}]},{"name":"The call (Genesis 12)","cards":[{"term":"Lech lecha","def":"G-d's command in Genesis 12:1 to go forth from your land, your birthplace and your father's house to the land I will show you.","hook":"Go — to an unknown place.","asks":[{"q":"Which detail of Genesis 12:1 shows that Avraham did not know where he was going?","right":"\"to the land that I will show you\"","wrong":[["\"I will make of you a great nation\"","That is a promise, not a statement about the destination."],["\"and Lot went with him\"","That names a companion, not the destination."],["\"Shall not the Judge of all the earth do justice?\"","That is from the Sodom story in Genesis 18."]],"exp":"The destination is not named; G-d will show it."}]},{"term":"Three things left behind","def":"Genesis 12:1 lists land, birthplace and father's house instead of simply saying 'leave.'","hook":"Land, birthplace, father's house.","asks":[{"q":"Why might the Torah list all three things instead of just saying 'Leave'?","right":"To stress how much he was giving up","wrong":[["Because Avraham owned three separate houses","The list is about what leaving costs, not property."],["Because each one was a separate journey","It describes one departure."],["Because G-d wanted him to choose only one of them","He had to leave all three."]],"exp":"Listing each layer shows the size of the sacrifice."}]},{"term":"Avraham's silence","def":"Genesis 12:4 says only that Abram went as G-d had commanded; he asks no questions.","hook":"He just went.","asks":[{"q":"What is missing from Avraham's response in Genesis 12:4?","right":"Any question or objection","wrong":[["Any mention that he actually left","The verse says he went forth."],["Any mention of G-d's command","The verse says he went as G-d commanded."],["Any companion traveling with him","Lot went with him."]],"exp":"He doesn't ask why, where, or what he will get. Class called it obedience, which could be good or bad."}]},{"term":"Suggests vs. proves","def":"Avraham's quick departure points toward trust or obedience, but the text does not establish his inner reasons.","hook":"Evidence vs. inference.","asks":[{"q":"Which statement goes beyond what Genesis 12:4 can prove?","right":"Avraham felt no fear at all about leaving","wrong":[["Avraham left as G-d had commanded him to go","The verse says exactly this."],["Avraham did not ask questions in the verse","The verse records no questions."],["Lot traveled with Avraham when he left Haran","Genesis 12:4 says Lot went with him."]],"exp":"The text shows his action. His feelings are an inference."}]}]},{"name":"Why Avraham?","cards":[{"term":"Torah's silence on the choice","def":"Genesis 12 gives no reason why G-d chose Avraham; G-d simply speaks to him.","hook":"No reason given.","asks":[{"q":"Based only on Genesis 12:1–4, what reason does the Torah give for choosing Avraham?","right":"None is stated","wrong":[["He was the most righteous man in Ur","Genesis 12 says nothing about this."],["He discovered G-d as a child in Ur","That idea comes from Rambam, not from Genesis 12."],["He argued with G-d to save Sodom","That happens later, in Genesis 18."]],"exp":"The midrash and Rambam fill a gap the Torah leaves open."}]},{"term":"Bereishit Rabbah 39:1","def":"A midrash compiled around the 5th century CE: a traveler sees a lit palace and asks if it has no owner, and the owner looks out.","hook":"The palace parable.","asks":[{"q":"In the palace parable, what does the owner looking out represent?","right":"G-d revealing Himself to Avraham","wrong":[["Avraham revealing himself to G-d in the palace","Avraham is the traveler who asks the question."],["The people of Ur rejecting their idols","The parable is about one man's search."],["Pharaoh welcoming Yaakov's family to Egypt","That is from the Joseph story."]],"exp":"Palace = the world; owner = G-d; traveler = Avraham."}]},{"term":"Rambam on Avraham","def":"Maimonides writes in the Mishneh Torah that, as a child with no teacher among idolaters in Ur, the future patriarch reasoned his way to one G-d.","hook":"He figured it out alone.","asks":[{"q":"According to Rambam, how did Avraham come to believe in one G-d?","right":"By questioning and reasoning on his own","wrong":[["By being taught by his father's teachers","Rambam says he had no teacher."],["By hearing G-d speak at Mount Sinai","Sinai came centuries later."],["By copying the beliefs of the people of Ur","Ur's people were idolaters."]],"exp":"Rambam: he wondered how the sphere could turn with no one controlling it."}]},{"term":"Who took the first step?","def":"Class debate: G-d chose Avraham (Genesis 12), Avraham chose G-d (Rambam), or they chose each other (the midrash).","hook":"Three positions.","asks":[{"q":"Which pair of sources best supports the position that Avraham and G-d chose each other?","right":"Genesis 12 and the palace midrash","wrong":[["Only Genesis 12, which shows Avraham searching first","Genesis 12 shows G-d speaking first, with no search."],["Only Rambam, which says G-d called Avraham at birth","Rambam stresses Avraham's own search."],["Exodus 1, which describes Pharaoh's fear of Israel","Exodus 1 is unrelated to Avraham's choice."]],"exp":"Genesis 12: G-d calls. Midrash: Avraham searches and G-d answers."}]},{"term":"Belief alone isn't enough","def":"Believing in one G-d does not by itself make someone Jewish; what begins in Genesis 12 is a covenant with obligations.","hook":"Belief plus commitment.","asks":[{"q":"If belief in one G-d is not enough on its own, what new element begins in Genesis 12?","right":"A two-sided covenant","wrong":[["A written law code for a nation","The law code comes at Sinai."],["A king ruling over a nation","No king appears in Genesis 12."],["A temple in Jerusalem for worship","There is no temple in Genesis."]],"exp":"Genesis 12 adds mutual commitment to belief."}]},{"term":"Why begin with Avraham","def":"Your notes suggest the story starts with Avraham because the covenant and its sign, brit milah, begin with him, making him the first Jew.","hook":"First covenant, first Jew.","asks":[{"q":"Which reason from your notes best explains why the course begins Jewish history with Avraham rather than Adam or Noah?","right":"The covenant begins with him","wrong":[["He was the first human being created","Adam and Eve were the first humans."],["He was the first person to leave a city","The notes do not make this claim."],["He received the Ten Commandments at Sinai","That was the whole people, generations later."]],"exp":"Your notes: 'Maybe Avraham is the first Jew as he had a brit milah — the brit milah is the covenant.'"}]}]}]},{"id":2,"name":"Avraham's Character","optional":false,"sections":[{"name":"Five stories","cards":[{"term":"Leaving Haran","def":"Genesis 12:1–4: Avraham leaves at G-d's word without hesitation, and Lot goes with him.","hook":"Faithful, or a sheep?","asks":[{"q":"Class notes call Avraham a 'sheep' in Genesis 12. Which reading of that story is best supported?","right":"His obedience could be read as faith or as not thinking","wrong":[["He refused to leave until G-d explained the reason to him","He left without asking."],["He left only because Lot asked him to go","He left because G-d commanded him."],["He argued that the trip was far too dangerous to make","He raised no objection."]],"exp":"Class: obedience could be good or bad."}]},{"term":"Avraham and Lot","def":"Genesis 13:5–12: when their herdsmen quarrel, Avraham lets Lot choose his land first to keep the peace.","hook":"You pick first.","asks":[{"q":"What does Avraham's offer to Lot most clearly show?","right":"He valued peace over getting the best land","wrong":[["He wanted the Jordan plain for himself","He let Lot take it."],["He was afraid of fighting his nephew's herdsmen","The text stresses peace between relatives, not fear."],["He punished Lot for the quarrel","He offered a peaceful separation."]],"exp":"\"Let there be no quarrel… for we are relatives.\" He could have taken the better land."}]},{"term":"Lot's choice","def":"Lot chose the well-watered Jordan plain, and the two separated.","hook":"The green side.","asks":[{"q":"Which detail best supports the claim that Avraham gave up an advantage in Genesis 13?","right":"Lot took the well-watered plain","wrong":[["Avraham went to Egypt instead","Genesis 13 doesn't send him to Egypt."],["The herdsmen stopped quarreling","That does not show a lost advantage."],["Avraham and Lot were both wealthy","Wealth was the cause of the problem."]],"exp":"Letting Lot choose meant Avraham might get the worse land."}]},{"term":"Avraham pleads for Sodom","def":"Genesis 18:22–25: Avraham challenges G-d, asking whether the righteous will be swept away with the wicked.","hook":"Shall not the Judge do justice?","asks":[{"q":"How does Avraham's response in Genesis 18 differ from Genesis 12?","right":"He questions G-d instead of obeying silently","wrong":[["He obeys silently, exactly as he did in Genesis 12","In Genesis 18 he argues."],["He argues for his own family's safety","He argues for strangers in Sodom."],["He refuses to speak to G-d at all","He speaks boldly to G-d."]],"exp":"Genesis 12: 'OK, I will go.' Genesis 18: 'What if there are innocents?'"}]},{"term":"\"Shall not the Judge of all the earth do justice?\"","def":"Avraham's challenge in Genesis 18:25, holding G-d to a standard of justice.","hook":"Justice even for G-d.","asks":[{"q":"What does this question assume about G-d?","right":"That G-d must act justly","wrong":[["That G-d has no power over Sodom","Avraham assumes G-d can destroy Sodom."],["That Sodom's people were all innocent","He asks about fifty righteous among the wicked."],["That G-d had already forgiven Sodom","He is arguing before any decision."]],"exp":"Avraham appeals to G-d's own justice."}]},{"term":"Hagar","def":"Genesis 16:1–6: Sarai gives her Egyptian servant to Avraham; when conflict follows, Avraham tells Sarai to do as she thinks best, and the servant flees.","hook":"A weaker moment.","asks":[{"q":"Which statement about Avraham in the Hagar story is best supported by the text?","right":"He avoided taking responsibility in the conflict","wrong":[["He defended Hagar against Sarai's harsh treatment","He said, 'Your servant is in your hands.'"],["He argued with G-d for Hagar's sake","There is no argument with G-d here."],["He sent Hagar away himself to protect Sarai's honor","Sarai treated her harshly and she ran away."]],"exp":"Unlike Sodom, he does not stand up for the vulnerable person here."}]},{"term":"Akeidat Yitzchak","def":"Genesis 22:1–9: G-d tests Avraham by commanding him to offer his son; Avraham sets out early and binds him on the altar, and G-d stops the sacrifice.","hook":"The binding of Isaac.","asks":[{"q":"Which detail best shows Avraham's readiness to obey in the Akeida?","right":"He rose early the next morning","wrong":[["He argued with G-d to save his son","He did not argue here, unlike Sodom."],["He refused to bring the knife or wood","He took the firestone and knife."],["He asked Sarai for permission to go","The text records no such request."]],"exp":"\"So early the next morning, Avraham saddled his donkey.\""}]},{"term":"\"Here I am\"","def":"Avraham's answer, hineni, when G-d calls him at the start of the Akeida.","hook":"Hineni.","asks":[{"q":"What does Avraham's answer 'Here I am' most suggest?","right":"Readiness to respond","wrong":[["Doubt about who was calling him","The phrase shows readiness, not doubt."],["A refusal to listen to G-d","He answers, so he listens."],["A plan to argue for Sodom","Sodom is a different story."]],"exp":"It signals availability before he even hears the command."}]},{"term":"Sodom vs. Akeida tension","def":"Avraham argues with G-d to save strangers in the doomed city but does not argue when told to offer his own son.","hook":"Why silent for his son?","asks":[{"q":"Which question best captures the tension between Genesis 18 and Genesis 22?","right":"Why argue for strangers but not for his son?","wrong":[["Why did Lot choose the well-watered Jordan plain?","That is a different story."],["Why did the herdsmen quarrel over grazing land?","That is Genesis 13."],["Why did Pharaoh fear the Israelites in Exodus 1?","That is Exodus 1."]],"exp":"This was a 'question I still have' in your Unit 1 reflection."}]}]},{"name":"Chosen, not perfect","cards":[{"term":"Chosen but not perfect","def":"The five stories show strengths and weaknesses; being chosen does not require perfection.","hook":"Flawed and chosen.","asks":[{"q":"Which pair of stories best supports the claim that Avraham was not perfect yet still chosen?","right":"Sodom (courage) and Hagar (passivity)","wrong":[["Leaving Haran and leaving Haran again","One story can't show both sides."],["Lot and Sodom, which both show only flaws","Both show strengths: peacemaking and courage."],["Exodus 1 and Exodus 14","Those are not Avraham stories."]],"exp":"Strength in one story, weakness in another."}]},{"term":"Chosenness as responsibility","def":"Being chosen means being given obligations to carry, not being better or flawless.","hook":"Chosen for, not chosen over.","asks":[{"q":"Which statement best matches your study guide's idea of chosenness?","right":"Being chosen means taking on duties","wrong":[["Being chosen means never making mistakes","The guide contrasts responsibility with perfection."],["Being chosen means ruling over other peoples","Nothing in your sources says this."],["Being chosen means G-d asks nothing in return","The covenant asks obligations of Avraham."]],"exp":"Moshe is your example: chosen even though he made a mistake."}]},{"term":"Moshe's mistake","def":"Your opening answer: Moshe was chosen to lead even though a mistake kept him from entering Israel.","hook":"Chosen, still human.","asks":[{"q":"Why is Moshe a useful example when asking whether someone can be chosen without being perfect?","right":"He led despite a costly mistake","wrong":[["He never made a single mistake as leader","He did make a mistake."],["He entered the land with the whole nation","His mistake kept him out of the land."],["He was chosen only after he became perfect","He was chosen as a flawed person."]],"exp":"It supports 'chosen means responsible, not perfect.'"}]},{"term":"Abrahamic religions","def":"Judaism, Christianity and Islam all trace back to Avraham; Islam traces Muhammad through Yishmael, son of Avraham and Hagar.","hook":"Three faiths, one ancestor.","asks":[{"q":"According to your family-tree chart, how does Islam connect itself to Avraham?","right":"Through Yishmael, son of Hagar","wrong":[["Through Yitzchak, son of Sarah","The Jewish people trace their line through Yitzchak and Yaakov."],["Through Esau, the ancestor of Edom","Esau is Yitzchak's son, not the line Islam claims."],["Through Lot, Avraham's nephew from Haran","Lot is not the line Islam claims."]],"exp":"The chart notes Muhammad is not in the Hebrew Bible; the link comes from later Islamic tradition."}]},{"term":"National revelation","def":"Your notes contrast G-d revealing Himself to the whole people at Sinai with traditions that rest on revelation to one person.","hook":"Everyone saw it.","asks":[{"q":"Your notes contrast a revelation seen by a whole nation with one given to a single person. Which event is the first kind?","right":"Mount Sinai","wrong":[["Avraham's call in Haran","That was to one person."],["Joseph's dreams in Egypt","Those were personal dreams."],["Rambam's account of Ur","That describes one person's discovery."]],"exp":"Sinai was public, for all Israel."}]}]}]},{"id":3,"name":"The Covenant","optional":false,"sections":[{"name":"What a covenant is","cards":[{"term":"Brit","def":"The Hebrew word for covenant: a relationship in which both sides make commitments and both receive something.","hook":"Two-way bond.","asks":[{"q":"Which situation is most like a brit?","right":"Two sides each promise and each give","wrong":[["A ruler gives an order that only subjects obey","That is a one-sided command."],["A person privately believes in one G-d","That is belief, not a two-sided agreement."],["A merchant sells goods once and leaves","A brit is an ongoing relationship, not a one-time trade."]],"exp":"Your answer: 'a push-pull relationship where both must give and take.'"}]},{"term":"Covenant vs. command","def":"A command obligates only the one who obeys; a covenant obligates both sides.","hook":"Order vs. bond.","asks":[{"q":"What turns G-d's words in Genesis 12 from a command into a covenant?","right":"G-d also commits to promises","wrong":[["Avraham writes the words down","Nothing is written in Genesis 12."],["Avraham argues before agreeing","He doesn't argue in Genesis 12."],["The people vote to accept it","That is closer to Sinai."]],"exp":"Avraham must go; G-d binds Himself to promises."}]},{"term":"Covenant vs. simple deal","def":"A covenant is an ongoing relationship passed down through generations, not a one-time exchange.","hook":"A bond, not a receipt.","asks":[{"q":"Which feature best separates the covenant from a simple deal?","right":"It continues across generations","wrong":[["Both sides receive something in return","Deals do that too."],["It involves a promise of land","A deal could include land too."],["It begins with a request to leave home","That does not make it different from a deal."]],"exp":"It is built to extend to Avraham's descendants."}]}]},{"name":"Promises and obligations","cards":[{"term":"Avraham's obligation","def":"Avraham must leave his land, birthplace and father's house and trust G-d enough to go to an unknown land.","hook":"Leave and trust.","asks":[{"q":"Which is Avraham's side of the covenant in Genesis 12?","right":"Leaving home and trusting G-d","wrong":[["Building a nation and a homeland himself","Becoming a nation is G-d's promise."],["Making his own name great among nations","G-d promises to make his name great."],["Blessing the families of the earth by law","That is part of G-d's promises."]],"exp":"One costly, immediate action."}]},{"term":"Great nation","def":"G-d's first promise in Genesis 12:2: 'I will make of you a great nation.'","hook":"Many descendants.","asks":[{"q":"A student claims this promise was fulfilled the moment Avraham arrived in Canaan. Which detail best challenges that claim?","right":"Jacob's family was still only 70 people","wrong":[["Avraham left Haran when G-d commanded him","That does not address the size of his family."],["Lot chose the well-watered Jordan plain","Lot's choice is not about nationhood."],["Avraham argued for Sodom in Genesis 18","That is about justice, not numbers."]],"exp":"Generations later, Jacob's household entering Egypt numbered 70."}]},{"term":"Make your name great","def":"G-d's promise in Genesis 12:2 that Avraham will be famous and remembered.","hook":"Remembered.","asks":[{"q":"Which evidence would best support the claim that this promise has been fulfilled?","right":"Three religions honor Avraham today","wrong":[["Lot chose the better land in Genesis 13","That doesn't show fame."],["Avraham left Haran without questions","That is his obligation, not the promise."],["Hagar ran away from Sarai","That doesn't show fame."]],"exp":"Avraham is known across Judaism, Christianity and Islam."}]},{"term":"You shall be a blessing","def":"G-d's promise that Avraham, and those who come from him, will be a source of blessing to others.","hook":"Blessing outward.","asks":[{"q":"How does 'you shall be a blessing' differ from 'I will bless you'?","right":"It points outward, toward others","wrong":[["It is a command, not a promise","Both are promises in the verse."],["It is only about wealth in Canaan","It is about Avraham's effect on others."],["It is said to Lot, not Avraham","It is said to Avraham."]],"exp":"One blessing is received; the other is given to others."}]},{"term":"All the families of the earth","def":"Genesis 12:3: all the families of the earth shall bless themselves by Avraham.","hook":"Reaching everyone.","asks":[{"q":"Why does your reflection say the covenant is not just between Avraham and G-d?","right":"It reaches all families and later generations","wrong":[["It was made with Pharaoh as a partner","Pharaoh is not part of it."],["It was cancelled after the Akeida","It continues."],["It applied only to Lot's family and his herdsmen in the plain","Lot is not its focus."]],"exp":"The covenant is built to extend beyond one man."}]},{"term":"Bless those who bless you","def":"Genesis 12:3: 'I will bless those who bless you and curse the one who curses you.'","hook":"Protection promise.","asks":[{"q":"Which of G-d's promises in Genesis 12 is about how other peoples treat Avraham?","right":"Blessing those who bless him","wrong":[["Making him a great nation","That is about his own descendants."],["Making his name great","That is about his own fame."],["Showing him a new land to live in","That is about his destination."]],"exp":"This promise concerns outsiders' behavior toward Avraham."}]},{"term":"Uneven trade","def":"Avraham's side is one costly act now; G-d's side is several promises that unfold over generations.","hook":"Now vs. later.","asks":[{"q":"What makes the Genesis 12 exchange look uneven on paper?","right":"One act now, many promises later","wrong":[["G-d asks for much more than He promises","G-d promises more than one thing."],["Avraham receives everything before leaving","The promises come true over generations."],["Neither side commits to anything","Both sides commit."]],"exp":"That is why the covenant requires trust."}]}]},{"name":"How the covenant develops","cards":[{"term":"Brit milah","def":"Circumcision, the physical sign of the covenant; your notes suggest it makes Avraham the first Jew.","hook":"The covenant in the body.","asks":[{"q":"Why might brit milah matter more than belief alone in making Avraham 'the first Jew'?","right":"It marks a lasting covenant","wrong":[["It was required of everyone in Ur","Ur's people were idolaters."],["It replaced the promise of land","Land remained part of the covenant."],["It happened at Mount Sinai","Avraham lived long before Sinai."]],"exp":"Your notes: 'brit milah / bris is the covenant.'"}]},{"term":"Covenant of the pieces","def":"Genesis 15, where G-d tells Avraham his descendants will be strangers and slaves in a foreign land before returning (about 400 years).","hook":"Slavery foretold.","asks":[{"q":"According to your notes, what did G-d tell Avraham would happen before his descendants received the land?","right":"They would be slaves in a foreign land","wrong":[["They would conquer Egypt by force","They would be enslaved, not conquer."],["They would rule Mesopotamia from Ur","That is not the promise."],["They would receive the land immediately","There would be a long wait first."]],"exp":"Your answer links this to the years in Egypt."}]},{"term":"Genesis 15:16","def":"\"The fourth generation shall return here, for the iniquity of the Amorites is not yet complete.\"","hook":"Not yet.","asks":[{"q":"Which explanation of the long wait is stated in Genesis 15:16?","right":"The Amorites' wrongdoing was not yet complete","wrong":[["The Israelites had not yet learned to farm the land","The verse doesn't say this."],["Pharaoh refused to let Joseph's family go","The verse doesn't mention Pharaoh."],["Avraham had disobeyed G-d in Haran by asking questions","Avraham obeyed."]],"exp":"This is what the Torah says; a historian might infer other reasons."}]},{"term":"Righteousness and justice","def":"Your notes: G-d chose Avraham to uphold righteousness and justice in his house, a duty passed to his descendants.","hook":"Pass it on.","asks":[{"q":"Why does passing righteousness and justice to future generations matter for the covenant?","right":"The covenant depends on later generations keeping it","wrong":[["It lets each generation ignore the covenant","The covenant asks each generation to carry it."],["It ended the covenant after Avraham died","It continues."],["It means only Avraham himself was responsible for keeping the covenant","The responsibility passes down."]],"exp":"Your notes: responsibility for Avraham's descendants — 10 commandments, 613 mitzvot, passing down beliefs."}]},{"term":"Covenant at Sinai","def":"At Mount Sinai the covenant is offered to the whole people, with conditions: 'if you obey My voice and keep My covenant.'","hook":"From one man to a nation.","asks":[{"q":"What is one major change from the covenant with Avraham to the covenant at Sinai?","right":"A whole people accepts it together","wrong":[["It no longer involves any promises","Sinai includes promises such as 'treasured possession.'"],["It is made with Pharaoh instead of Israel","It is made with Israel."],["It drops all of the conditions and duties","Sinai adds conditions."]],"exp":"Avraham: an individual. Sinai: a nation, with laws."}]},{"term":"Kingdom of priests and a holy nation","def":"Exodus 19:6: what G-d says Israel will be if they keep the covenant.","hook":"A holy nation.","asks":[{"q":"What does 'a kingdom of priests and a holy nation' suggest about the Israelites' status at Sinai?","right":"They are a nation before entering the land","wrong":[["They have become slaves again in Egypt","They had already left Egypt."],["They will only become a family much later","They are called a nation."],["They have already conquered Canaan by the time it is said","They are still in the wilderness."]],"exp":"Your answer used this as evidence they were a nation before the land."}]},{"term":"Naaseh v'Nishmah","def":"The people's answer at Sinai, 'we will do and we will obey,' given with one voice.","hook":"Do first.","asks":[{"q":"Why was saying 'we will do' first significant?","right":"It showed commitment to act on the laws","wrong":[["It showed the laws were forced on them","They chose it together."],["It meant only the leaders agreed to it","They answered with one voice."],["It showed they rejected the covenant offered at Sinai","They accepted it."]],"exp":"A shared choice to act, made as one people."}]},{"term":"Deuteronomy 27:9–10","def":"Forty years later, Moshe tells the new generation, 'This day you have become the people of the Lord.'","hook":"Renewed, not inherited.","asks":[{"q":"Why does Moshe renew the covenant with the next generation?","right":"Each generation must accept it for itself","wrong":[["The first covenant had been cancelled","It was renewed, not cancelled."],["He wanted to replace the Torah's laws","He tells them to obey the commandments."],["They had already entered the land and needed new rules","They were about to enter."]],"exp":"Nationhood and covenant must be renewed, not simply inherited."}]}]},{"name":"Responsibility","cards":[{"term":"Guilt vs. responsibility","def":"Yom Kippur lesson: you may not have caused a problem and still have responsibility for what happens next.","hook":"Not my fault, still my job.","asks":[{"q":"Ten people hear an antisemitic joke and no one responds. What does the Yom Kippur lesson say about the listeners?","right":"They share responsibility to respond","wrong":[["They are guilty of telling the joke","They didn't tell it, so it isn't guilt."],["They have no role since it wasn't theirs","Belonging asks something of them."],["Only the teacher can ever respond","Anyone can step up."]],"exp":"Covenant = I belong; responsibility = my belonging asks something of me."}]},{"term":"Teshuvah","def":"Return and repair: 'I will sometimes fall short. I can return, repair, and act.'","hook":"Return, repair, act.","asks":[{"q":"How does teshuvah connect to the idea that chosenness is not perfection?","right":"It expects mistakes and asks for repair","wrong":[["It means a chosen person never errs","It assumes people fall short."],["It replaces the covenant with feelings of guilt","It moves from guilt to action."],["It applies only to the people of Ur","It is a Yom Kippur idea for everyone."]],"exp":"Falling short is expected; returning and repairing is the duty."}]},{"term":"Ways to step up","def":"Interrupt, support, address, involve, change: more than one way to act when something is wrong.","hook":"Five ways to act.","asks":[{"q":"You see a classmate bullied and you can't stop it in the moment. Which option from the lesson is still a way to step up?","right":"Bring in someone better positioned to help","wrong":[["Do nothing, since noticing is enough","The lesson says noticing isn't the same as acting."],["Join in so the bully stops targeting you instead","That adds to the harm."],["Wait until it becomes your own problem","Belonging makes it yours to care about."]],"exp":"'Involve' is one of the five ways."}]}]}]},{"id":4,"name":"The Family Tree","optional":false,"sections":[{"name":"From Terah to Yaakov","cards":[{"term":"Terah","def":"Avraham's father; also the father of Nahor and Haran.","hook":"Where the tree begins.","asks":[{"q":"Who heads the family-tree chart 'From Terah to the 12 Tribes'?","right":"Avraham's father","wrong":[["Avraham's son by Sarah","That is Yitzchak."],["Avraham's nephew who went with him","That is Lot."],["Yaakov's eldest son by Leah","That is Reuben."]],"exp":"Terah → Abraham, Nahor and Haran."}]},{"term":"Lot","def":"Avraham's nephew, son of Avraham's brother Haran; he went with Avraham from Haran.","hook":"Nephew and companion.","asks":[{"q":"Why does Avraham say 'we are relatives' to Lot in Genesis 13?","right":"Lot is his brother's son","wrong":[["Lot is his son by Hagar","That is Yishmael."],["Lot is Sarah's younger brother","The chart shows Lot as Haran's son."],["Lot is one of Yaakov's sons","Lot lived generations earlier."]],"exp":"Lot is the son of Avraham's brother Haran."}]},{"term":"Yishmael","def":"Son of Avraham and Hagar the Egyptian; the Torah calls him the ancestor of a great nation.","hook":"Hagar's son.","asks":[{"q":"Which son of Avraham does the chart connect to later Islamic tradition?","right":"Yishmael","wrong":[["Yitzchak, son of Sarah","The Jewish line goes through Yitzchak."],["Yaakov, son of Rivka","Yaakov is Avraham's grandson."],["Esau, son of Yitzchak","Esau is the ancestor of Edom."]],"exp":"Islam traces Muhammad through Yishmael."}]},{"term":"Yitzchak","def":"Son of Avraham and Sarah, the son bound in the Akeida; the Jewish line continues through him.","hook":"Isaac.","asks":[{"q":"Through which son of Avraham do the Jewish people trace their line?","right":"Yitzchak","wrong":[["Yishmael, son of Hagar","Islam traces its line through Yishmael."],["Lot, son of Haran","Lot is a nephew."],["Nahor, son of Terah","Nahor is Avraham's brother."]],"exp":"Jewish lineage: Avraham → Yitzchak → Yaakov."}]},{"term":"Esau","def":"Son of Yitzchak and Rivka and twin brother of Yaakov; ancestor of the Edomites.","hook":"Edom.","asks":[{"q":"Which son of Yitzchak is NOT the ancestor of the 12 tribes?","right":"Esau","wrong":[["Yaakov, also called Israel","Yaakov is the father of the 12 tribes."],["Yaakov's son Joseph","Joseph is a grandson, not Yitzchak's son."],["Yaakov's son Levi","Levi is a grandson, not Yitzchak's son."]],"exp":"Esau's line is Edom."}]},{"term":"Yaakov","def":"Son of Yitzchak and Rivka, also named Israel; father of the 12 tribes.","hook":"Israel.","asks":[{"q":"Why are his descendants called 'the Israelites'?","right":"Yaakov was also named Israel","wrong":[["Avraham was renamed Israel at Sinai","The name Israel belongs to Yaakov."],["Joseph named his sons Israel","His sons were Manasseh and Ephraim."],["Pharaoh gave them the name in Egypt","The name comes from Yaakov."]],"exp":"Children of Israel = children of Yaakov."}]}]},{"name":"Yaakov's wives and children","cards":[{"term":"Leah","def":"Rachel's older sister and Yaakov's first wife; mother of Reuben, Simeon, Levi, Judah, Issachar, Zebulun and Dinah.","hook":"First wife, most sons.","asks":[{"q":"Your notes say Yaakov loved Rachel but was tricked. Who did he marry first?","right":"Leah, Rachel's older sister","wrong":[["Bilhah, Rachel's servant","Bilhah was Rachel's servant."],["Zilpah, Leah's servant","Zilpah was Leah's servant."],["Rivka, Yitzchak's wife and Yaakov's mother","Rivka was Yaakov's mother."]],"exp":"Leah was Yaakov's first wife."}]},{"term":"Rachel","def":"Leah's younger sister and Yaakov's beloved wife; mother of Joseph and Benjamin.","hook":"Beloved wife.","asks":[{"q":"Which two sons were born to Yaakov's beloved wife?","right":"Joseph and Benjamin","wrong":[["Reuben and Simeon","They were Leah's sons."],["Gad and Asher","They were Zilpah's sons."],["Dan and Naphtali, born to her servant","They were Bilhah's sons."]],"exp":"Rachel: Joseph and Benjamin."}]},{"term":"Bilhah","def":"Rachel's servant, who gave birth to Dan and Naphtali.","hook":"Rachel's servant.","asks":[{"q":"Dan and Naphtali were born to which woman?","right":"Bilhah, Rachel's servant","wrong":[["Zilpah, Leah's servant","Zilpah bore Gad and Asher."],["Leah, Yaakov's first wife","Leah bore six sons, not these two."],["Hagar, Sarah's servant","Hagar bore Yishmael to Avraham."]],"exp":"Bilhah: Dan and Naphtali."}]},{"term":"Zilpah","def":"Leah's servant, who gave birth to Gad and Asher.","hook":"Leah's servant.","asks":[{"q":"Gad and Asher were born to which woman?","right":"Zilpah, Leah's servant","wrong":[["Bilhah, Rachel's servant","Bilhah bore Dan and Naphtali."],["Rachel, Yaakov's beloved wife","Rachel bore Joseph and Benjamin."],["Sarah, Avraham's wife","Sarah bore Yitzchak."]],"exp":"Zilpah: Gad and Asher."}]},{"term":"The 12 sons","def":"Reuben, Simeon, Levi, Judah, Issachar, Zebulun, Gad, Asher, Dan, Naphtali, Joseph and Benjamin: ancestors of the 12 tribes.","hook":"Twelve tribes.","asks":[{"q":"Which name on the chart is NOT one of Yaakov's 12 sons?","right":"Dinah","wrong":[["Levi","Levi is one of Leah's sons."],["Asher","Asher is one of Zilpah's sons."],["Benjamin","Benjamin is one of Rachel's sons."]],"exp":"Dinah is Yaakov's daughter; the 12 tribes come from his sons."}]},{"term":"Manasseh and Ephraim","def":"Joseph's two sons, born in Egypt; Manasseh was the firstborn.","hook":"Joseph's sons.","asks":[{"q":"Genesis 46 counts 70 people in Yaakov's household, including two born in Egypt. Who were they?","right":"Joseph's sons","wrong":[["Reuben and Simeon","They came down from Canaan."],["Lot's daughters","They are not part of Yaakov's household."],["Moshe and Aaron","They were born generations later."]],"exp":"\"Joseph's sons who were born to him in Egypt were two in number.\""}]}]}]},{"id":5,"name":"From Family to People to Nation","optional":false,"sections":[{"name":"Family, people, nation","cards":[{"term":"Family","def":"A small group related by blood or marriage.","hook":"Blood and marriage.","asks":[{"q":"At what stage does Genesis 46 describe Yaakov's household entering Egypt?","right":"A family of 70 persons","wrong":[["A nation with its own land and laws","It had no land or government of its own."],["A people feared by Pharaoh","That comes later, in Exodus 1."],["A kingdom of priests at Sinai","That comes after the Exodus."]],"exp":"\"All the persons belonging to Jacob… 70 persons.\""}]},{"term":"People","def":"A larger group made of many families with a shared history, values and background.","hook":"Shared story.","asks":[{"q":"Which evidence best shows the Israelites had become a people by Exodus 1?","right":"Pharaoh calls them 'the Israelite people'","wrong":[["Genesis counts them as 70 persons","That is when they were still a family."],["They received laws at Mount Sinai","Sinai helps make them a nation, later."],["They crossed the Jordan River into the land of Canaan","That is much later."]],"exp":"Outsiders now see a distinct group, not just Yaakov's family."}]},{"term":"Nation","def":"A people that also has land, laws and its own government.","hook":"Land, law, leadership.","asks":[{"q":"By Exodus 1, what were the Israelites still missing to be a nation?","right":"Their own land and government","wrong":[["A shared history and religion","Those made them a people already."],["A large enough population","They had grown very large."],["A name used by outsiders such as Pharaoh","Pharaoh already called them a people."]],"exp":"Your answer: a people, but not yet a nation."}]},{"term":"70 persons","def":"Genesis 46:26–27: the total of Yaakov's household that came to Egypt was 70.","hook":"Seventy.","asks":[{"q":"Why does the number 70 matter when comparing Genesis 46 and Exodus 1?","right":"It shows how small they began","wrong":[["It shows Egypt had only 70 people","It counts Yaakov's household."],["It counts the years of slavery","It counts people, not years."],["It counts the laws given at Sinai","It is a household count."]],"exp":"From 70 people to a population that 'filled the land.'"}]},{"term":"Fertile and prolific","def":"Exodus 1:7: the Israelites multiplied and increased greatly, so the land was filled with them.","hook":"They filled the land.","asks":[{"q":"Which phrase from Exodus 1:7 best shows growth?","right":"\"the land was filled with them\"","wrong":[["\"a new king arose over Egypt\"","That is about Pharaoh, not growth."],["\"Joseph died, and all his brothers\"","That is about a death, not growth."],["\"his own issue aside from the wives\"","That is from Genesis 46's count."]],"exp":"Growth turned a family into a large, distinct group."}]}]},{"name":"Joseph and Egypt","cards":[{"term":"Joseph rations the grain","def":"Genesis 41:53–57: during the famine Yaakov's son opened the storehouses and the whole world came to Egypt for food.","hook":"Egypt feeds the world.","asks":[{"q":"Why was Egypt a place of salvation during the famine?","right":"Joseph had stored and rationed grain","wrong":[["Egypt had no famine that year","The famine reached Egypt too."],["Pharaoh refused to sell any grain at all","Pharaoh sent people to Joseph."],["Canaan had more food than Egypt did","Yaakov's family came to Egypt for food."]],"exp":"Egypt had bread because of Joseph's planning."}]},{"term":"\"G-d sent me ahead of you\"","def":"Joseph's words to his brothers in Genesis 45: it was G-d, not they, who sent him to Egypt, to save life.","hook":"Not you, but G-d.","asks":[{"q":"How does Joseph interpret his brothers selling him into slavery?","right":"As part of G-d's plan to save lives","wrong":[["As proof his brothers were righteous","He says they meant harm."],["As a reason to punish them severely","He tells them not to be distressed."],["As a sign to return to Canaan at once","He brings the family to Egypt."]],"exp":"\"You intended me harm, G-d intended it for good.\""}]},{"term":"Goshen","def":"The region of Egypt where Yaakov's family settled near Joseph, acquired holdings and grew greatly.","hook":"Fertile Goshen.","asks":[{"q":"Which detail from Genesis 47:27 best explains why the family might not want to leave Egypt?","right":"They acquired holdings and increased","wrong":[["They were slaves in Goshen right away","Slavery came later, under a new king."],["Goshen was in Canaan, not Egypt","Goshen was in Egypt."],["They were forbidden to own anything","They acquired holdings."]],"exp":"Prosperity made leaving hard."}]},{"term":"Why they stayed","def":"Practical reasons: the land was fertile, they prospered, and Joseph had power. Covenant reason: they were waiting for G-d to bring them out.","hook":"Comfort and waiting.","asks":[{"q":"Which pair gives one practical and one covenant reason the family stayed in Egypt?","right":"Fertile land; waiting for G-d's notice","wrong":[["Fear of Pharaoh; love of the pyramids","Neither is in your sources."],["Slavery; the Ten Commandments","Slavery came later; the commandments came at Sinai."],["Avraham's order; Lot's choice of the Jordan plain","Neither explains staying in Egypt."]],"exp":"Your answer: fertile land, Joseph's power; and 'pakod yifkod.'"}]},{"term":"Pakod yifkod","def":"Hebrew for 'G-d will surely take notice of you,' Joseph's words before he died: G-d would bring them up to the promised land.","hook":"Will surely take notice.","asks":[{"q":"How might pakod yifkod have encouraged later generations to stay in Egypt?","right":"They waited for G-d to bring them out","wrong":[["It ordered them to leave immediately","It promised G-d would act in the future."],["It said Egypt was the promised land","The promised land was Canaan."],["It told them to fight Pharaoh's army for their freedom","It is about waiting for G-d."]],"exp":"Leaving might have been seen as G-d's timing, not theirs."}]},{"term":"Joseph's bones","def":"Joseph made the sons of Israel swear: 'When G-d has taken notice of you, you shall carry up my bones from here.'","hook":"Carry me home.","asks":[{"q":"What does Joseph's request about his bones show he expected?","right":"A future return to Canaan","wrong":[["That Egypt would be home forever","He wanted his bones moved out."],["That he would be buried in Goshen","He asked to be carried up from Egypt."],["That his brothers would stay as slaves","He expected G-d to bring them out."]],"exp":"He expected G-d to bring them back to the land promised to Avraham, Yitzchak and Yaakov."}]},{"term":"Yaakov's burial request","def":"Yaakov died in Egypt and asked not to be left there but buried with his ancestors in the cave of Machpelah in Canaan.","hook":"Don't leave me in Egypt.","asks":[{"q":"What do Yaakov's and Joseph's burial requests have in common?","right":"Both point to Canaan as home","wrong":[["Both ask to be buried in Goshen","Both look to Canaan."],["Both reject the covenant with Avraham","Both rely on it."],["Both are made after leaving Egypt","Both are made in Egypt."]],"exp":"Even while prospering in Egypt, they saw Canaan as the promised home."}]},{"term":"400 years","def":"The long stay in Egypt that G-d foretold to Avraham, explained in Genesis 15:16.","hook":"Four centuries.","asks":[{"q":"A historian says famine and prosperity explain the long stay in Egypt. What kind of statement is this compared with Genesis 15:16?","right":"An inference, not what the Torah says","wrong":[["A direct quote from the Torah","It is the historian's interpretation."],["Something we can observe today in Egypt","It is inferred from evidence."],["A rejection of all the evidence","It uses evidence to infer."]],"exp":"Torah says / we can observe / historians may infer."}]}]},{"name":"A new Pharaoh","cards":[{"term":"A new king who did not know Joseph","def":"Exodus 1:8: a new Pharaoh arose who did not know Joseph.","hook":"Memory lost.","asks":[{"q":"Why does it matter that the new king 'did not know Joseph'?","right":"The family's protection was gone","wrong":[["He had never heard of Egypt","He ruled Egypt."],["He wanted to make Joseph's family rulers","He saw them as a threat."],["He was Joseph's own son","He did not know Joseph."]],"exp":"Joseph's power had protected them; now that link was broken."}]},{"term":"Pharaoh's fear","def":"Exodus 1:9–10: the Israelites are 'too numerous,' and in war 'they may join our enemies.'","hook":"Too many, maybe disloyal.","asks":[{"q":"What cause does Pharaoh give for treating the Israelites harshly?","right":"Their growth might make them a threat in war","wrong":[["They refused to work the land","He says nothing about work."],["They worshipped Egypt's gods instead","Religion is not his stated reason."],["They had stolen grain from Egypt's storehouses during the famine","Grain is not his stated reason."]],"exp":"Population growth plus fear of disloyalty."}]}]},{"name":"Becoming a nation (Lesson 2.3)","cards":[{"term":"Leaving Egypt","def":"Exodus 12: Pharaoh lets them go after generations of slavery, giving them freedom and a shared experience.","hook":"Freedom first.","asks":[{"q":"Why might leaving Egypt come first on any list of nation-building events?","right":"Slaves can't govern themselves","wrong":[["It gave them their homeland","That came with entering the land."],["It gave them the Ten Commandments","That came at Sinai."],["It ended the covenant with Avraham","It fulfilled part of it."]],"exp":"Your answer: freedom had to come first."}]},{"term":"Crossing the sea","def":"Exodus 14: the Israelites crossed on dry ground and 'believed in the Lord and in Moses.'","hook":"No way back.","asks":[{"q":"Which effect of crossing the sea did your answer stress?","right":"It ended any return to Egypt","wrong":[["It gave them shared laws","Laws came at Sinai."],["It gave them a homeland","The land came later."],["It gave them manna to eat every day","Manna came in Exodus 16."]],"exp":"It also united them in belief in G-d and Moshe."}]},{"term":"Manna","def":"Exodus 16: bread from heaven each day, teaching the people to rely on G-d together.","hook":"Daily bread.","asks":[{"q":"Why did your answer rank manna as contributing least to nationhood?","right":"It helped them survive but added no new national feature","wrong":[["It caused the people to leave Egypt","It came after they left."],["It gave them their laws and covenant","That was Sinai."],["It made them slaves again under a new and harsher Pharaoh","It sustained them."]],"exp":"An event can matter even if it ranks last."}]},{"term":"Ten Commandments","def":"Exodus 20: shared laws and religious responsibilities given at Sinai.","hook":"Shared law.","asks":[{"q":"Which characteristic of a nation did the Ten Commandments add?","right":"Shared laws","wrong":[["A homeland","That came with entering the land."],["Freedom from slavery","That came with leaving Egypt."],["A central place of worship","That was the Mishkan."]],"exp":"Laws hold a nation together."}]},{"term":"Mishkan","def":"Exodus 25:8: a portable sanctuary the people built together — 'that I may dwell among them.'","hook":"Worship center.","asks":[{"q":"What did building the Mishkan add to the Israelites' nationhood?","right":"A central place of worship they built together","wrong":[["A permanent capital city in Canaan","The Mishkan was carried through the wilderness."],["Their first written laws","Those were given at Sinai."],["Their escape from Pharaoh's army at the sea of Reeds","That was at the sea."]],"exp":"A shared project and shared worship."}]},{"term":"Entering the land","def":"Joshua 3: after 40 years a new generation crosses the Jordan on dry ground into Canaan.","hook":"Homeland.","asks":[{"q":"Your answer says the land 'completed their nationhood but did not create it.' Which evidence supports that?","right":"They were called a nation at Sinai","wrong":[["They had no laws before entering","They received laws at Sinai."],["Pharaoh called them a people","That supports 'people,' not the timing of nationhood."],["They crossed the Jordan on dry ground","That describes entering, not prior nationhood."]],"exp":"'A kingdom of priests and a holy nation' was said in the wilderness."}]},{"term":"Nationhood as a process","def":"The Israelites became a nation gradually: freedom, then law and covenant, then shared worship, then land.","hook":"Step by step.","asks":[{"q":"Which statement is the best-supported conclusion about when the Israelites became a nation?","right":"Gradually, through several events","wrong":[["Only when they entered Canaan","Sinai already called them a nation."],["Only when they left Egypt","Freedom alone gave no laws or land."],["Only when Joseph became powerful in Egypt","They were still a family then."]],"exp":"Each event added something new."}]}]}]},{"id":6,"name":"Antisemitism and Evaluating Claims","optional":false,"sections":[{"name":"Definitions","cards":[{"term":"Antisemitism","def":"Hostility to Jews, aimed at them for being Jewish.","hook":"Aimed at the people, not a policy.","asks":[{"q":"Which example best fits hostility toward Jews as Jews?","right":"Blaming all Jews for a government's actions","wrong":[["Criticizing one Israeli policy with evidence","Criticizing a policy is not hostility toward Jews as Jews."],["Voting for a party in the Knesset","That is ordinary politics."],["Disagreeing with a coalition decision","That criticizes a government decision."]],"exp":"The key is targeting Jews for being Jews."}]},{"term":"Criticism vs. hostility","def":"Criticizing a government or policy is different from hostility toward Jews as Jews.","hook":"Policy vs. people.","asks":[{"q":"A protester says, 'I oppose this Israeli policy.' Another says, 'Jews everywhere are to blame.' What separates them?","right":"The second targets Jews as a group","w
