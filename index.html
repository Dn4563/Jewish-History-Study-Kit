rong":[["The first is automatically antisemitic","Criticizing a policy is not automatically antisemitic."],["Both are equally just political criticism","The second blames Jews as Jews."],["Neither statement could be antisemitic","The second targets Jews as a group."]],"exp":"Your note: supporting Palestinians doesn't by itself mean hostility to Jews."}]},{"term":"Racial antisemitism","def":"Your notes: Hitler claimed Jewishness was an unchangeable 'inferior' and 'dangerous' race.","hook":"Unchangeable label.","asks":[{"q":"What made the Nazi view of Jews different from objecting to a religion?","right":"It claimed Jewishness could never change","wrong":[["It said Jews could convert to escape it","It claimed it could not be changed."],["It only criticized a government policy","It targeted Jews as a so-called race."],["It praised Jews as a superior people of the world","It called them inferior and dangerous."]],"exp":"Racial antisemitism makes Jewishness a permanent label."}]}]},{"name":"Evaluating claims","cards":[{"term":"Overgeneralization","def":"A claim that stretches a fact about some members of a group to all of them.","hook":"Some ≠ all.","asks":[{"q":"Which statement is an overgeneralization from your true/false review?","right":"Everyone at a pro-Palestinian protest supports Hamas","wrong":[["Some extremists can pose a serious risk to a community","That is limited and was marked true."],["Not all Palestinians are Muslim","That corrects a generalization."],["Not all Muslims are Arab, according to your class review","That corrects a generalization."]],"exp":"Watch for 'all,' 'everyone' and 'never.'"}]},{"term":"Most Muslims are not Arab","def":"Your class review marked 'Most Muslims are Arab' false.","hook":"Arab ≠ Muslim.","asks":[{"q":"Which statement from your review was marked FALSE?","right":"Most Muslims are Arab","wrong":[["Both the Torah and Quran contain passages about war","That was marked true."],["A tiny share of extremists can still be dangerous","That was marked true."],["Not every protester supports Hamas","That is the corrected version, which is true."]],"exp":"Arab is an ethnic and language group; Muslim is a religion."}]},{"term":"Not all Palestinians are Muslim","def":"Your class review marked 'All Palestinians are Muslim' false.","hook":"Not all.","asks":[{"q":"Why is 'All Palestinians are Muslim' a weak claim?","right":"It turns a group into one religion","wrong":[["It is a fact recorded in the Torah","The Torah says nothing of this."],["It describes a government policy","It describes people, not policy."],["It is supported by your review sheet","Your review marked it false."]],"exp":"The word 'all' makes it an overgeneralization."}]},{"term":"Small groups, serious risk","def":"Your review marked true: even if only about 0.1% of a population supports extremism, that group can still pose a serious risk.","hook":"Small share, real danger.","asks":[{"q":"Which conclusion is best supported by the 0.1% statement?","right":"A small group can still be dangerous","wrong":[["Most people in that population are extremists","0.1% is a tiny share."],["Small groups can never cause real harm","The review marked the opposite."],["The whole population must be blamed","That is an overgeneralization."]],"exp":"Size of a group and size of its danger are different questions."}]},{"term":"Violence in scripture","def":"Your review marked true: both the Torah and the Quran contain passages about warfare and violence.","hook":"Both texts.","asks":[{"q":"A classmate says only one religion's scripture mentions war. What is the best response based on your review?","right":"Both the Torah and Quran contain such passages","wrong":[["Neither text ever mentions any war","The review marked that both do."],["Only the Quran discusses fighting","The review says both do."],["Only the Torah discusses fighting and war of any kind","The review says both do."]],"exp":"Compare sources fairly before drawing conclusions."}]},{"term":"Checking a claim","def":"Ask who made it, what the evidence is, and whether it applies to all or only some.","hook":"Who, what, how many?","asks":[{"q":"A post says, 'The deadliest attacks on U.S. synagogues were all by Islamic extremists.' Your review marked this false. What should you check first?","right":"Who actually carried out each attack","wrong":[["Whether the post has many likes","Popularity isn't evidence."],["Whether it matches your opinion","Agreement isn't evidence."],["Whether it uses the word 'synagogue' in the headline","Wording isn't evidence."]],"exp":"Check the evidence behind each claim."}]}]}]},{"id":7,"name":"Israel: Mandate and Government","optional":false,"sections":[{"name":"From the Ottomans to partition","cards":[{"term":"Ottoman rule","def":"Your notes: the Turkish empire based in Istanbul controlled the land of Israel and present-day Palestine from 1517 to 1917.","hook":"Four centuries of Ottomans.","asks":[{"q":"Who controlled the land before World War I?","right":"The Ottoman Empire","wrong":[["Britain and France","They became involved after World War I."],["The League of Nations","It came after World War I."],["An independent Israel","Israel did not exist yet."]],"exp":"1517–1917, per your notes."}]},{"term":"Mandate system","def":"After World War I, the League of Nations had an established nation govern a territory and help its people prepare to rule themselves.","hook":"Help them set up.","asks":[{"q":"What was the stated purpose of the mandate system?","right":"To help a people become able to self-govern","wrong":[["To make the land part of Britain forever","It was meant to prepare self-rule."],["To return the land to the Ottomans","The Ottomans had fallen."],["To divide Europe among the winners after the war ended","It concerned former Ottoman lands."]],"exp":"Your notes: 'we are going to help them set up.'"}]},{"term":"Partition","def":"Because of Arab–Jewish conflict, the land was to be split; your notes say the split was unequal: Jews accepted a bad deal, and Arabs rejected the better share.","hook":"Split, accepted, rejected.","asks":[{"q":"According to your notes, how did each side respond to the split?","right":"Jews accepted it; Arabs rejected it","wrong":[["Both sides accepted the split gladly","Your notes say Arabs rejected it."],["Both sides rejected the split","Your notes say Jews accepted it."],["Jews rejected it; Arabs accepted it","Your notes say the reverse."]],"exp":"Your notes call it 'a very bad deal for Jews but they accepted.'"}]}]},{"name":"How the government works","cards":[{"term":"Knesset","def":"Israel's parliament, with 120 members.","hook":"120 seats.","asks":[{"q":"How many seats does a party need to govern alone in the Knesset?","right":"61 of 120","wrong":[["50 of 100","The Knesset has 120 seats."],["60 of 120","Half is not a majority; 61 is."],["120 of 120","A majority needs only 61."]],"exp":"A majority is more than half: 61."}]},{"term":"Parliamentary democracy","def":"Israel's system: voters elect a parliament, and the government needs the support of a Knesset majority.","hook":"Govern by majority.","asks":[{"q":"Which statement about Israel's government is true according to your quick check?","right":"It is a parliamentary democracy","wrong":[["It is ruled by a powerful president","The president is ceremonial."],["Voters choose the prime minister directly","They vote for a party."],["It has no political parties","It has many parties."]],"exp":"You got this one right on the quick check."}]},{"term":"Voting for a party","def":"Israelis vote for a party list, not directly for a prime minister or individual members.","hook":"Party, not person.","asks":[{"q":"What do Israelis choose on the ballot in national elections?","right":"A political party","wrong":[["A candidate for president","The president isn't elected by the public."],["A candidate for prime minister","They vote for a party."],["Individual Knesset members","They vote for a party list."]],"exp":"Seats are divided based on each party's share of the vote."}]},{"term":"Israel's president","def":"A mainly ceremonial head of state who appoints the person who will try to form a government.","hook":"Ceremonial, but picks who tries.","asks":[{"q":"On your quick check you missed this one. Which statement is TRUE?","right":"The president appoints who will try to form a government","wrong":[["The president runs the government day to day","The president is mainly ceremonial."],["The president writes Israel's laws","The Knesset passes laws."],["The president controls the Knesset and decides which laws it passes","The president does not control the Knesset."]],"exp":"Ceremonial role, with one key job after elections."}]},{"term":"Electoral threshold","def":"A party needs about 3.25% of the national vote to enter the Knesset.","hook":"Clear the bar.","asks":[{"q":"A small party wins 2% of the vote. What happens?","right":"It doesn't enter the Knesset","wrong":[["It wins exactly two seats","It is below the 3.25% threshold."],["It automatically joins the coalition","It wins no seats."],["It becomes the opposition leader","It is not in the Knesset."]],"exp":"A party that passes the threshold gets about 4 seats, not 1."}]},{"term":"Coalition","def":"Parties that agree to work together to reach at least 61 seats and form a government.","hook":"Many parties, one government.","asks":[{"q":"Why do Israeli parties usually need to form coalitions?","right":"No single party controls a majority","wrong":[["Every party must be in the government","Some parties are in the opposition."],["The president orders several parties to rule","The president doesn't choose the coalition."],["Israel does not allow single-party rule by law","It simply has never happened."]],"exp":"No party has ever won 61 seats alone."}]},{"term":"Opposition","def":"Parties that are not part of the governing coalition.","hook":"Not in government.","asks":[{"q":"After a coalition forms with 64 seats, what are the remaining parties called?","right":"The opposition","wrong":[["The president's party","The president is not a party leader."],["The threshold parties","That is not a term for parties outside government."],["The mandate","That is a historical system."]],"exp":"Everyone outside the coalition."}]},{"term":"Largest party may not govern","def":"The party with the most seats governs only if it can build a 61-seat coalition; otherwise another leader may try.","hook":"Most ≠ majority.","asks":[{"q":"Likud wins the most seats, 27, but cannot reach 61 with partners. What is the best-supported outcome?","right":"Another leader may get a chance to form a government","wrong":[["Likud governs alone with 27 seats","27 is far short of 61."],["The president becomes prime minister","The president is ceremonial."],["The Knesset is dissolved forever and never meets again after that","If no one succeeds, there are new elections."]],"exp":"Your notes: if the first can't, the second gets to try; if that fails, re-elections."}]},{"term":"Bloc","def":"A group of parties that usually work together, such as the Netanyahu bloc.","hook":"Allied parties.","asks":[{"q":"Your election tracker showed no bloc at 61. What does that mean?","right":"Neither group of allies can govern alone","wrong":[["A party has won a majority alone","No bloc, let alone a party, reached 61."],["The election results are fake","It means no majority yet."],["The president must rule the country instead of the parties","The president is ceremonial."]],"exp":"Unaligned parties or broken promises may decide the outcome."}]},{"term":"Pro of coalitions","def":"Smaller and minority parties gain influence because larger parties need their seats.","hook":"Small parties matter.","asks":[{"q":"Which is a benefit of Israel's coalition system?","right":"Smaller parties gain a voice","wrong":[["Only the largest party has a voice","Coalitions give small parties leverage."],["Elections are rarely needed","Coalitions can fall, forcing elections."],["The president has complete control","The president is ceremonial."]],"exp":"Leverage for small parties."}]},{"term":"Con of coalitions","def":"Coalitions can be fragile: if partners withdraw, the government can fall and new elections may follow.","hook":"Fragile.","asks":[{"q":"Which is a weakness of coalition governments?","right":"They can collapse if partners leave","wrong":[["They eliminate political parties","They depend on parties."],["Citizens can no longer vote","Citizens still vote."],["The Knesset cannot pass any laws at all","The Knesset still passes laws."]],"exp":"Your quick check: true that a coalition can fall apart."}]},{"term":"Ruled-out partners","def":"Party leaders often promise not to sit with certain rivals, which makes reaching 61 harder.","hook":"Red lines.","asks":[{"q":"Your coalition of 73 seats needed Yashar, which promised not to sit with Netanyahu. What best describes this coalition?","right":"Possible on paper but hard to form","wrong":[["Certain to form because it has 73 seats","Seat math doesn't overcome a promise not to join."],["Impossible because 73 is under 61","73 is over 61."],["Automatic because Likud is largest","Being largest doesn't guarantee partners."]],"exp":"\"A coalition with 61 seats is mathematically possible, but that does not mean the parties would agree.\""}]}]}]},{"id":8,"name":"How Traditions Develop","optional":false,"sections":[{"name":"Torah to tradition","cards":[{"term":"Torah to tradition","def":"Your notes: Torah → rabbinic interpretation → tradition → Jewish history.","hook":"Layers over time.","asks":[{"q":"Which example best fits the path from Torah to rabbinic interpretation to tradition?","right":"Simchat Torah, a celebration not in the Torah","wrong":[["The Ten Commandments given at Sinai","That is Torah itself."],["Avraham leaving Haran","That is a Torah story."],["Joseph rationing grain in Egypt during the famine","That is a Torah story."]],"exp":"Simchat Torah grew from the custom of finishing and restarting the Torah."}]},{"term":"Simchat Torah","def":"A celebration of finishing the yearly reading of the Five Books and starting again; it is not commanded in the text itself.","hook":"Finish and restart.","asks":[{"q":"Why do Jews begin Bereishit right after finishing Devarim on Simchat Torah?","right":"To show learning should never stop","wrong":[["Because the Torah commands that exact day","Simchat Torah is not in the Torah."],["Because Devarim was too long to finish","The cycle is finished."],["Because Moshe asked to be read twice","It is about continuous learning."]],"exp":"Your notes: 'We should never stop learning Torah.'"}]},{"term":"Shmini Atzeret","def":"An extra holy day right after Sukkot; in Israel Simchat Torah falls on the same day.","hook":"One more day.","asks":[{"q":"According to your notes, how is the extra day after Sukkot explained?","right":"The celebration was too good to end","wrong":[["It was added by Pharaoh in Egypt","It is a Jewish holiday."],["It marks the creation of Adam and Eve","That is Rosh Hashanah."],["It replaced Yom Kippur","It does not replace Yom Kippur."]],"exp":"\"A party you don't want to end.\""}]},{"term":"Oral and written Torah","def":"Your notes: the written Torah is like a constitution that can't be changed; the Talmud was passed on by speech before it was written down.","hook":"Fixed text, living talk.","asks":[{"q":"How does the idea of oral tradition help explain new customs?","right":"Interpretation can grow around a fixed text","wrong":[["The written Torah keeps being rewritten","Your notes say it can't be changed."],["Customs come only from written law","Many customs are not in the Torah."],["Oral tradition replaced the written Torah long ago","It interprets the Torah."]],"exp":"The text stays; interpretation and custom grow."}]}]},{"name":"Rosh Hashanah customs","cards":[{"term":"Common core, local form","def":"Jewish communities share the hope for a good year but express it with local foods, words and customs.","hook":"Same hope, local flavor.","asks":[{"q":"Which conclusion is best supported by the Rosh Hashanah traditions article?","right":"Communities kept a shared core but adapted it locally","wrong":[["Every community ate exactly the same foods","Foods varied widely."],["Customs never changed after the Torah","Many developed later, some in medieval times."],["Local foods replaced the holiday's meaning in every community","The meaning stayed; the form changed."]],"exp":"Bene Israel and Cochin Jews each adapted to their region's ingredients."}]},{"term":"Apples and honey","def":"A custom for a sweet year, dated to medieval Jewish sources from the 1300s.","hook":"Sweet year.","asks":[{"q":"What does the dating of apples and honey to the 1300s show about traditions?","right":"Some 'ancient' customs began later","wrong":[["All customs come straight from Sinai","This one is medieval."],["Apples and honey are commanded in the Torah","It is a later custom."],["Every community adopted it immediately","Ethiopian Jews did not."]],"exp":"Traditions develop over time."}]},{"term":"Beta Israel","def":"Ethiopian Jews, who developed apart from rabbinic communities, so apples, honey and the Rosh Hashanah seder were not central to them.","hook":"Isolation shapes custom.","asks":[{"q":"What best explains why customs that seem universal were not central to Ethiopian Jews?","right":"They developed apart from other communities","wrong":[["They rejected Rosh Hashanah entirely","They observed it as Brenha Serkan."],["They had no access to any food","They had foods like injera and lamb."],["They lived in medieval Germany near the city of Worms","They lived in Ethiopia."]],"exp":"Isolation meant a different path of development."}]},{"term":"Turkish Jews and honey","def":"Some Sephardic families in Izmir avoided the bees' product, worried it might contain bee parts, and dipped apples in sugar instead.","hook":"Sugar, not honey.","asks":[{"q":"What does the Turkish sugar custom show about how traditions adapt?","right":"The meaning is kept while the form changes","wrong":[["The wish for sweetness was abandoned","Sugar keeps the wish for sweetness."],["Honey was banned in the Torah","It was a kashrut concern."],["Every Jewish community copied it from Izmir","It was specific to some families."]],"exp":"Keep the sweetness, change the food."}]}]},{"name":"Keeping a community alive","cards":[{"term":"Knowledge","def":"Texts, laws, prayers and practices must be taught to the next generation, which is why teachers matter.","hook":"Teach it forward.","asks":[{"q":"\"A Torah scroll is valuable, but someone must know how to read it.\" What larger point is the author making?","right":"Objects need knowledge to keep meaning","wrong":[["Torah scrolls should be replaced by books","The point is about knowledge, not format."],["Only teachers should own Torah scrolls","The point is about teaching."],["Physical objects matter more than people","The opposite."]],"exp":"Education turns objects into a living tradition."}]},{"term":"Institutions","def":"Synagogue, school, cemetery, charity, court and care for the poor and sick turn individuals into an organized community.","hook":"Structures that hold.","asks":[{"q":"Why aren't texts and traditions alone enough to sustain a community?","right":"Communities also need institutions","wrong":[["Texts are always lost when people move","Texts can travel."],["Traditions are not part of Jewish life","They are central."],["Communities need only food and shelter","That helps individuals, not a community."]],"exp":"Your answer named synagogues, schools, cemeteries and courts."}]},{"term":"Adaptation balance","def":"Refusing to adapt makes survival hard; adapting completely leaves nothing distinct to preserve.","hook":"Change some, keep some.","asks":[{"q":"A community changes everything to fit its new country. What problem does the reading warn about?","right":"Nothing distinct may be left to preserve","wrong":[["It will survive more easily forever","The reading warns of losing what makes it distinct."],["It will refuse to learn the language","That is the opposite problem."],["It will have far too many institutions to support","Not the reading's concern."]],"exp":"Your teacher asked: what happens when a community totally assimilates?"}]},{"term":"Portable civilization","def":"Jewish civilization never depended on one building, job, language or country: texts travel and knowledge can be retaught.","hook":"It travels.","asks":[{"q":"Which statement best explains how Jewish communities survived many displacements?","right":"Their core could move with them","wrong":[["They never moved from one place","They moved many times."],["They depended on one building","The reading says they didn't."],["They gave up all their traditions","Traditions were carried along."]],"exp":"Texts, knowledge, rituals, institutions and memory can be rebuilt."}]}]}]}],"sq":[{"id":"SQ1","deck":1,"q":"A friend says, 'The Torah explains that G-d chose Avraham because he discovered G-d as a child.' What is the best correction?","opts":["That idea comes from Exodus 1","The Torah says Avraham was the richest man","That idea comes from Rambam, not Genesis","The Torah says G-d chose Lot first"],"ans":2,"exp":"Genesis 12 is silent; Rambam and the midrash fill the gap.","why":["Exodus 1 is about Pharaoh.","The Torah gives no reason.","","Lot isn't chosen."]},{"id":"SQ2","deck":2,"q":"Avraham argues with G-d to save strangers but rises early to obey when told to offer his son. Which statement is most accurate?","opts":["His responses differ by situation","He always argues with G-d","He never questions or challenges G-d at all","He argues only for his own family"],"ans":0,"exp":"Use the five stories as evidence.","why":["","Not in Genesis 12 or 22.","He questions G-d about Sodom.","He argues for strangers."]},{"id":"SQ3","deck":3,"q":"Which situation is a covenant rather than a command?","opts":["A ruler orders subjects to pay a tax","Both sides promise something and keep it over time","A person decides privately to believe","A one-time sale with no future contact between buyer and seller"],"ans":1,"exp":"Two-way and lasting.","why":["One-sided.","","Belief only.","Not ongoing."]},{"id":"SQ4","deck":3,"q":"Why is brit milah important in your notes about Avraham?","opts":["It was a law at Sinai","It was Pharaoh's command","It replaced belief in G-d with a ritual","It is the sign of the covenant"],"ans":3,"exp":"Your notes: brit milah is the covenant; maybe the first Jew.","why":["It begins with Avraham.","Not Pharaoh.","It adds a sign to belief.",""]},{"id":"SQ5","deck":4,"q":"Which person is NOT one of Yaakov's 12 sons?","opts":["Levi","Gad","Esau","Naphtali"],"ans":2,"exp":"Esau is Yaakov's brother.","why":["Leah's son.","Zilpah's son.","","Bilhah's son."]},{"id":"SQ6","deck":5,"q":"The Israelites have grown and Pharaoh calls them a 'people,' but they have no land or laws of their own. What are they?","opts":["A people, not yet a nation","A family of 70 persons","A nation with a government","A kingdom of priests already"],"ans":0,"exp":"Lesson 2.1.","why":["","They have grown far beyond that.","They have no government of their own.","That comes at Sinai."]},{"id":"SQ7","deck":5,"q":"Why did Joseph make his brothers swear to carry up his bones?","opts":["He wanted to be buried in Goshen","He expected G-d to bring them back","He planned to rule Canaan himself","He feared Pharaoh would take his bones away"],"ans":1,"exp":"Pakod yifkod.","why":["He wanted to leave Egypt.","","He was about to die.","No such fear is stated."]},{"id":"SQ8","deck":5,"q":"Which event added shared laws to the Israelites' nationhood?","opts":["Leaving Egypt under Pharaoh","Crossing the sea on dry land after leaving Egypt","Entering the land with Joshua","Receiving the Ten Commandments"],"ans":3,"exp":"Lesson 2.3 chart.","why":["That gave freedom.","That ended any return.","That gave a homeland.",""]},{"id":"SQ9","deck":6,"q":"A post says, 'Everyone who attends that protest supports Hamas.' What is the main problem?","opts":["It criticizes a government policy fairly","It quotes the Torah incorrectly","It overgeneralizes from some to all","It uses too many statistics"],"ans":2,"exp":"Your review marked this false.","why":["It's about people, not policy.","No Torah quote.","","It uses none."]},{"id":"SQ10","deck":7,"q":"The largest party has 27 seats. Can it govern alone?","opts":["No, it needs 61 with partners","Yes, the largest party always governs","Yes, if the president approves it","No, because 27 is over the threshold"],"ans":0,"exp":"Coalitions.","why":["","Most seats isn't a majority.","The president is ceremonial.","The threshold isn't the issue."]},{"id":"SQ11","deck":7,"q":"What was the stated purpose of the mandate system after World War I?","opts":["Return the land to the Ottomans","Help a people prepare to rule itself","Make Britain rule the land forever as a colony","Create the Knesset right away"],"ans":1,"exp":"Your notes.","why":["The Ottomans had fallen.","","It was meant to be temporary.","Israel did not exist yet."]},{"id":"SQ12","deck":8,"q":"Some Turkish Jews used sugar instead of honey on Rosh Hashanah. What does this show?","opts":["They rejected the wish for a sweet year","The Torah banned honey","Every Jewish community around the world copied them","The meaning stayed while the form changed"],"ans":3,"exp":"Common core, local form.","why":["Sugar keeps sweetness.","It was a kashrut worry.","It was local.",""]}],"flows":[{"id":"FC1","title":"Avraham's journey","deck":1,"steps":["Born in Mesopotamia (Ur)","Family moves to Haran","G-d's call: 'Go forth' (Genesis 12)","Avraham goes, with Lot","Canaan: the land G-d will show him"]},{"id":"FC2","title":"Why Avraham? Three sources","deck":1,"steps":["Genesis 12: no reason given; G-d speaks first","Bereishit Rabbah 39:1: Avraham asks 'Does the palace have no owner?'; G-d answers","Rambam: as a child, with no teacher, he reasoned his way to one G-d","Class positions: G-d chose / Avraham chose / they chose each other"]},{"id":"FC3","title":"From Canaan to Egypt","deck":5,"steps":["Famine; Joseph rations grain in Egypt","Yaakov's family (70 persons) settles in Goshen","They prosper and multiply","Joseph: 'G-d will surely take notice of you… carry up my bones'","A new king who did not know Joseph fears them","Slavery, then the Exodus"]},{"id":"FC4","title":"Six events that built a nation (Lesson 2.3)","deck":5,"steps":["Leaving Egypt: freedom","Crossing the sea: no way back; belief in G-d and Moshe","Manna: relying on G-d together","Ten Commandments: shared laws","Mishkan: shared worship","Entering the land: homeland"]},{"id":"FC5","title":"After an Israeli election","deck":7,"steps":["Voters choose party lists","Parties under ~3.25% get no seats","President appoints someone to try to form a government","Negotiate a coalition of 61+","If that fails, another leader may try","If no one can, new elections"]},{"id":"FC6","title":"Yom Kippur: from covenant to action","deck":3,"steps":["Covenant: I belong","Responsibility: my belonging asks something of me","Yom Kippur: I will sometimes fall short","Teshuvah: I can return, repair and act"]}],"trees":["THE FAMILY OF AVRAHAM\nTerah\n├─ Nahor\n├─ Haran ─ Lot\n└─ Avraham\n   ├─ + Hagar (Egyptian) → Yishmael ...... Islamic tradition traces Muhammad here\n   └─ + Sarah → Yitzchak\n                └─ + Rivka → Esau (Edom)\n                            → Yaakov (Israel)\n                               ├─ Leah ..... Reuben, Simeon, Levi, Judah, Issachar, Zebulun (+ Dinah)\n                               ├─ Zilpah ... Gad, Asher\n                               ├─ Rachel ... Joseph (→ Manasseh, Ephraim), Benjamin\n                               └─ Bilhah ... Dan, Naphtali","FROM FAMILY TO NATION\nFamily ........ Genesis 46: 70 persons of Jacob's household\nPeople ........ Exodus 1: \"the Israelite people,\" feared by Pharaoh\nNation ........ freedom (Exodus) → sea → manna → laws (Sinai) → Mishkan → land (Jordan)","HOW THE COVENANT DEVELOPS\nGenesis 12 .... the call: leave home; promises of nation, blessing, name\nGenesis 15 .... descendants will be strangers and slaves, then return (15:16)\nBrit milah .... the covenant's sign (your notes: \"maybe Avraham is the first Jew\")\nSinai ......... a whole people: \"if you obey… a kingdom of priests\"; \"we will do and obey\"\nDeut. 27 ...... renewed 40 years later: \"This day you have become the people\"","HOW A TRADITION DEVELOPS\nTorah → rabbinic interpretation → tradition → Jewish history\ne.g. Simchat Torah (not in the Torah): finish Devarim, restart Bereishit"],"tables":[{"title":"Avraham in five stories","rows":[["Story","What he does","Strength or tension"],["Leaving Haran (Gen 12)","Goes without a question","Faith or obedience; 'a sheep'?"],["Lot (Gen 13)","Lets Lot choose the land","Peacemaking, selflessness"],["Sodom (Gen 18)","Argues for the innocent","Courage, justice, caring for strangers"],["Hagar (Gen 16)","'Your servant is in your hands'","Passive; doesn't protect the vulnerable"],["Akeida (Gen 22)","Rises early, binds Yitzchak","Obedience; why no argument for his son?"]]},{"title":"Ur vs. Canaan (evidence packet)","rows":[["","Ur (southern Mesopotamia)","Canaan"],["Water","Tigris and Euphrates; irrigation canals","Seasonal rainfall"],["Settlement","Dense city, temples, writing","Towns, fortified settlements, rural and pastoral"],["Economy","Long-distance trade; imported timber, metals, stone","Grain, grapes, olives; sheep and goats"],["Risks","Leaving behind wealth and networks","Drought and famine; land already inhabited"]]},{"title":"Covenant: Avraham vs. Sinai","rows":[["","Avraham (Genesis 12)","Sinai (Exodus 19, 24)"],["Who","One man and his descendants","The whole people"],["Obligation","Leave home and trust G-d","'If you obey my voice and keep my covenant'"],["Promises","Great nation, blessing, great name, be a blessing","Treasured possession; a kingdom of priests and a holy nation"],["Response","He goes, silently","'We will do and obey,' with one voice"]]},{"title":"Family, people, nation","rows":[["","Definition","Israelite example"],["Family","Related by blood or marriage","Jacob's 70 persons (Genesis 46)"],["People","Many families with shared history, values and background","'The Israelite people' (Exodus 1)"],["Nation","A people with land, laws and government","Sinai laws, Mishkan, then the land"]]},{"title":"Promises of Genesis 12:2–3","rows":[["Promise","What it means"],["I will make of you a great nation","Descendants"],["I will bless you","Blessing for Avraham"],["I will make your name great","Fame"],["You shall be a blessing","Blessing others"],["I will bless those who bless you…","Protection"],["All the families of the earth shall bless themselves by you","Reach beyond one family"]]},{"title":"Israel's government","rows":[["Term","Fact"],["Knesset","120 seats"],["Majority","61 seats; no party has ever won it alone"],["Ballot","Vote for a party list"],["Threshold","About 3.25% to enter the Knesset"],["President","Mainly ceremonial; appoints who tries to form a government"],["Coalition pro","Smaller parties gain influence"],["Coalition con","Fragile if partners leave"]]},{"title":"Your true/false review on claims","rows":[["Claim","Answer"],["Most Muslims are Arab","False"],["All Palestinians are Muslim","False"],["Some of the deadliest attacks on U.S. synagogues were committed by Islamic extremists","False"],["Everyone at a pro-Palestinian protest supports Hamas","False"],["Both the Torah and the Quran contain passages about warfare","True"],["Even 0.1% supporting extremism can pose a serious risk","True"]]}],"watch":[{"deck":1,"text":"Same people, different spellings: Avram/Abram = Avraham/Abraham; Sarai = Sarah; Yitzchak = Isaac; Yaakov = Jacob = Israel; Yishmael = Ishmael. Your packets switch between them, and so may the test."},{"deck":1,"text":"Genesis 12 gives no reason for choosing Avraham. The idea that he discovered G-d as a child comes from Rambam; the palace story comes from the midrash (Bereishit Rabbah 39:1). If a question asks what \"the Torah says,\" don't pick the midrash or Rambam."},{"deck":2,"text":"Evidence vs. inference: Genesis 12:4 says only that Avram went. \"He was brave,\" \"he was a sheep\" and \"he trusted G-d\" are inferences. Your study guide says the response \"suggests (not proves).\""},{"deck":3,"text":"Your packets don't print Genesis 15 or 17. Brit milah as the covenant's sign and \"maybe Avraham is the first Jew\" come from your class notes. Genesis 15:16 (the fourth generation, the Amorites) is printed in Lesson 2.2."},{"deck":4,"text":"On the family-tree chart, Issachar and Zebulun are drawn in the box under Bilhah, but they are Leah's sons (her 9th and 10th children on the chart's numbering). Bilhah's sons are Dan and Naphtali. VERIFY with your teacher if a question depends on it."},{"deck":4,"text":"Dinah is Yaakov's daughter. The 12 tribes come from his 12 sons; she isn't one of them."},{"deck":5,"text":"Family / people / nation: Genesis 46 (70 persons) = family. Exodus 1 (\"the Israelite people\") = people. A nation also has land, laws and government; Sinai and the Mishkan add laws and worship, and entering the land adds a homeland."},{"deck":5,"text":"Lesson 2.2's chart: \"Torah says\" (Genesis 15:16) is different from \"we can observe\" and \"historians may infer.\" Don't treat an inference as a quote."},{"deck":6,"text":"Your class's definition of antisemitism: hostility to Jews. The key test: is it aimed at Jews for being Jewish, or at a government's policy?"},{"deck":6,"text":"Criticizing a government or policy is not the same as hostility toward Jews as Jews. Your note: supporting Palestinians doesn't by itself mean hostility to Jews."},{"deck":7,"text":"The 3.25% threshold is the minimum to ENTER the Knesset. A party that passes it gets about 4 seats, not 1. Your Israeli Gov notes say \"to get 1 seat,\" which is not quite right."},{"deck":7,"text":"Israel's president is mainly ceremonial but DOES appoint the person who tries to form a government. You missed this on the quick check."},{"deck":7,"text":"The election numbers in your JTA assignment are snapshots (poll, exit poll, partial count). Don't treat a poll as a result."},{"deck":7,"text":"Partition: your notes say the split was unequal, a bad deal for Jews that they accepted, while the Arabs got the better part and rejected it. That is your class's summary; the packets don't give the details or the year."},{"deck":2,"text":"Dates in your notes (Avraham about 2000 BCE, Islam \"638 CE,\" Christianity \"300 CE\") look uncertain. Don't rely on exact dates; questions are about ideas and evidence."}],"practice":{"sections":[{"name":"Set A: Avraham","mode":"practice","tips":["Read the question stem first so you know what you are looking for in the source.","\"Best supported\" means the answer the source actually proves. A choice can be true and still not be supported by this source.","Separate evidence (what the text says) from inference (what you conclude from it).","Watch for overgeneralization: \"all,\" \"everyone,\" \"never,\" \"only.\"","If two answers look right, pick the one that is more precise and better supported; check it against counterevidence."],"sources":{"G12":{"title":"Leaving Haran (Genesis 12:1–4)","attr":"Genesis 12:1–4, as printed in your Lesson 1.4 source sheet.","label":"From your class packet.","paras":["1. G-d said to Avram, \"Go forth from your land, from your birthplace and from your father's house to the land that I will show you.","2. I will make of you a great nation, and I will bless you; I will make your name great, and you shall be a blessing.","3. I will bless those who bless you … and all the families of the earth shall bless themselves by you.\"","4. So Avram went, as G-d had spoken to him, and Lot went with him."]},"G13":{"title":"Avraham and Lot (Genesis 13:7–11)","attr":"Genesis 13, as printed in your Lesson 1.4 source sheet.","label":"From your class packet.","paras":["7. There was quarreling between the herdsmen of Avram and the herdsmen of Lot.","8. Avram said to Lot, \"Let there be no quarrel between you and me, and between my herdsmen and yours, for we are relatives.","9. Is not the whole land before you? Please separate from me. If you go to the left, I will go to the right; and if you go to the right, I will go to the left.\"","10–11. Lot looked out, chose the well-watered Jordan plain for himself, and the two separated."]},"G16":{"title":"Hagar (Genesis 16:1–6)","attr":"Genesis 16, as printed in your Lesson 1.4 source sheet.","label":"From your class packet.","paras":["Sarai said to Avram, \"G-d has kept me from bearing. Consort with my servant; perhaps I shall have a son through her.\" And Avram listened to Sarai.","He came to Hagar and she conceived; and when she saw that she had conceived, her mistress was lowered in her esteem.","Sarai said to Avram, \"The wrong done me is your fault! … Let G-d decide between you and me!\"","Avram said to Sarai, \"Your servant is in your hands; do to her as you think best.\" Then Sarai treated her harshly, and Hagar ran away from her."]},"G18":{"title":"Avraham pleads for Sodom (Genesis 18:23–25)","attr":"Genesis 18, as printed in your Avraham text study.","label":"From your class packet.","text":"Abraham came forward and said, \"Will You indeed sweep away the innocent along with the guilty? What if there should be fifty innocent within the city; will You then wipe out the place and not forgive it for the sake of the innocent fifty who are in it? Far be it from You to do such a thing, to bring death upon the innocent as well as the guilty, so that innocent and guilty fare alike. Far be it from You! Shall not the Judge of all the earth deal justly?\""},"G22":{"title":"Akeidat Yitzchak (Genesis 22:1–3, 7–8)","attr":"Genesis 22, as printed in your Lesson 1.4 source sheet.","label":"From your class packet.","paras":["G-d tested Avraham and said to him, \"Avraham,\" and he answered, \"Here I am.\" G-d said, \"Take your son, your favored one, Yitzchak, whom you love, and go to the land of Moriah, and offer him there as a burnt offering…\"","So early the next morning, Avraham saddled his donkey … and set out for the place of which G-d had told him.","Yitzchak said, \"Father! … Here are the firestone and the wood; but where is the sheep for the burnt offering?\" Avraham said, \"G-d will see to the sheep for the burnt offering, my son.\" And the two of them walked on together."]},"BR":{"title":"The palace (Bereishit Rabbah 39:1)","attr":"Midrash compiled c. 5th century CE, as printed in \"Avraham: Why Was He Chosen?\"","label":"From your class packet.","text":"A man was traveling when he saw a beautifully illuminated palace. He wondered, 'Is it possible that this palace has no owner?' Immediately the owner looked out and said, 'I am the owner of this palace.' Likewise, Avraham looked at the world and wondered, 'Is it possible that this world has no One who governs it?' Immediately G-d revealed Himself to Avraham."},"RAM":{"title":"Rambam on Avraham","attr":"Rambam (Maimonides), Mishneh Torah, Laws of Foreign Worship 1:3, as printed in \"Avraham: Why Was He Chosen?\"","label":"From your class packet.","text":"After this mighty man was weaned, he began to explore and think. Though he was a child he began to think incessantly … wondering: how is it possible for the sphere to continue to revolve without having anyone controlling it? Who is causing it to revolve? … He had no teacher… Rather he was mired in Ur Kasdim among the foolish idolaters… He realized that there was one G-d who controlled the sphere, that He created everything, and that there is no other G-d among all the other entities… Abraham was forty years old when he became aware of his Creator."},"UR":{"title":"Ur and southern Mesopotamia","attr":"From the evidence packet \"Should He Leave Mesopotamia?\" (Source C).","label":"From your class packet.","paras":["Ur was one of the important cities of ancient Mesopotamia and was part of a highly developed urban civilization.","The Tigris and Euphrates river system supported irrigation. Canals moved water to fields and helped farmers produce grain and other crops.","Ur participated in long-distance trade. Because southern Mesopotamia lacked some natural resources, merchants imported materials such as timber, metals, and stone.","Wealthy households could own livestock, goods, land-use rights, and valuable possessions and could depend on extended family and business relationships."]}},"questions":[{"id":"A1","type":"mcq","skill":"Evidence vs. inference","topic":"Avraham","stem":"Which statement is directly stated in the passage rather than inferred?","options":["Avram felt no fear about leaving home","Avram went as G-d had spoken","Avram wanted to become a great nation","Avram trusted G-d more than his own family"],"ans":1,"exp":"Verse 4 states the action. Fear, wishes and trust are inferences.","why":["The text records his action, not his feelings.","","The text gives G-d's promise, not Avram's wishes.","That is an interpretation."],"src":"G12"},{"id":"A2","type":"mcq","skill":"Purpose of a detail","topic":"Avraham","stem":"The Torah most likely lists 'your land, your birthplace and your father's house' in order to","options":["show that Avram owned three separate homes","explain where the land of Canaan was located","show that Lot had to leave all three as well","stress how much Avram was asked to give up"],"ans":3,"exp":"Three layers of home make the request heavier.","why":["The list is about attachments, not property.","The destination isn't named at all.","The command is spoken to Avram.",""],"src":"G12"},{"id":"A3","type":"mcq","skill":"Best-supported conclusion","topic":"Covenant","stem":"Which conclusion about the relationship in the passage is best supported?","options":["Both sides take on commitments","Only Avram is bound by any obligation","Only G-d is bound by any obligation","Neither side expects anything from the other"],"ans":0,"exp":"Avram must leave; G-d promises nation, blessing, a great name.","why":["","G-d also commits to promises.","Avram must go forth.","Both expect something."],"src":"G12"},{"id":"A4","type":"mcq","skill":"Character from evidence","topic":"Avraham","stem":"Which quality is best supported by Avram's words to Lot?","options":["Fear of fighting his nephew","Desire for the best land","Putting peace before advantage","Obedience to a command from G-d"],"ans":2,"exp":"\"Let there be no quarrel… for we are relatives.\"","why":["The text stresses peace among relatives, not fear.","He lets Lot choose first.","","No command from G-d appears here."],"src":"G13"},{"id":"A5","type":"mcq","skill":"Compare two sources","topic":"Avraham","stem":"Compared with Genesis 12:4, Avraham's behavior in this passage is best described as","options":["obeying silently and without question, just as in Genesis 12","protecting his own household from harm","challenging G-d rather than simply obeying","refusing to speak with G-d at all"],"ans":2,"exp":"Genesis 12: he goes. Genesis 18: he argues for justice.","why":["Here he argues.","He argues for strangers in Sodom.","","He speaks boldly."],"src":"G18"},{"id":"A6","type":"mcq","skill":"Claim in a source","topic":"Avraham","stem":"Which claim does Avraham make in the passage?","options":["The innocent should not die with the guilty","Everyone living in the city of Sodom is innocent of any wrongdoing","G-d has no authority over the city","Lot's family alone deserves to be saved"],"ans":0,"exp":"His appeal is to justice for the innocent.","why":["","He asks about fifty innocent among the guilty.","He calls G-d 'Judge of all the earth.'","He doesn't mention Lot."],"src":"G18"},{"id":"A7","type":"mcq","skill":"Counterevidence","topic":"Avraham","stem":"A student claims, 'Avraham always stood up for people who were vulnerable.' Which detail best challenges this claim?","options":["\"Will You sweep away the innocent?\"","\"Let there be no quarrel between us\"","\"G-d has kept me from bearing\"","\"Your servant is in your hands\""],"ans":3,"exp":"With Hagar, he hands the conflict back to Sarai, and Hagar flees.","why":["That supports the claim; it's from Sodom.","That shows peacemaking, not a failure to protect.","Sarai says this; it's not about Avraham's choices.",""],"src":"G16"},{"id":"A8","type":"mcq","skill":"Evidence vs. inference","topic":"Avraham","stem":"Which detail most directly shows Avraham acted without delay?","options":["He told Yitzchak that G-d would provide","He set out early the next morning","He answered 'Here I am' when called","The two of them walked on together"],"ans":1,"exp":"\"So early the next morning, Avraham saddled his donkey.\"","why":["That shows faith or reassurance, not timing.","","That shows readiness to listen, not timing of action.","That shows closeness, not speed."],"src":"G22"},{"id":"A9","type":"mcq","skill":"Interpret a source","topic":"Avraham","stem":"According to the midrash, who takes the first step?","options":["G-d calls Avraham with no prior search","Avraham asks; then G-d answers","The palace owner searches for the traveler","Neither one acts until Sinai"],"ans":1,"exp":"This supports 'they chose each other.'","why":["That fits Genesis 12, not this midrash.","","The traveler wonders first.","G-d reveals Himself right away."],"src":"BR"},{"id":"A10","type":"mcq","skill":"Compare interpretations","topic":"Avraham","stem":"How does Rambam's account differ from Genesis 12?","options":["It says Avraham was born in Canaan","It says Avraham had a great teacher","It says G-d spoke to Avraham as a baby","It explains why Avraham was chosen"],"ans":3,"exp":"Genesis 12 gives no reason; Rambam fills the gap with Avraham's search.","why":["Rambam places him in Ur.","Rambam says he had no teacher.","Rambam stresses Avraham's own reasoning.",""],"src":"RAM"},{"id":"A11","type":"mcq","skill":"Limits of a source","topic":"Avraham","stem":"What is the strongest reason to be careful using Rambam as evidence of what Avraham thought?","options":["He wrote many centuries after Avraham","He disagreed with the Torah about where Avraham was born","He never wrote about Avraham at all","He was one of the idolaters in Ur"],"ans":0,"exp":"A later interpreter fills gaps; he is not an eyewitness.","why":["","He places Avraham in Ur, as tradition does.","This passage is about Avraham.","He lived much later, in the Middle Ages."],"src":"RAM"},{"id":"A12","type":"mcq","skill":"Apply evidence","topic":"Avraham","stem":"Which detail from this source would a wealthy household in Ur most likely use to argue for staying?","options":["Canaan's seasonal rainfall","Imported timber, metals and stone","Family and business networks","The dangers of drought in Canaan"],"ans":2,"exp":"Staying keeps an established life and relationships.","why":["That isn't in this source, and it describes Canaan, not Ur.","Shows Ur lacked some resources.","","That describes Canaan, not Ur."],"src":"UR"}]},{"name":"Set B: Family to Nation","mode":"practice","tips":["Read the question stem first so you know what you are looking for in the source.","\"Best supported\" means the answer the source actually proves. A choice can be true and still not be supported by this source.","Separate evidence (what the text says) from inference (what you conclude from it).","Watch for overgeneralization: \"all,\" \"everyone,\" \"never,\" \"only.\"","If two answers look right, pick the one that is more precise and better supported; check it against counterevidence."],"sources":{"G46":{"title":"Jacob's household (Genesis 46:26–27)","attr":"Genesis 46, as printed in Lesson 2.1.","label":"From your class packet.","text":"All the persons belonging to Jacob who came to Egypt — his own issue aside from the wives of Jacob's sons — all these persons numbered 66. And Joseph's sons who were born to him in Egypt were two in number. Thus the total of Jacob's household who came to Egypt was 70 persons."},"EX1":{"title":"A new king (Exodus 1:6–10)","attr":"Exodus 1, as printed in Lesson 2.1.","label":"From your class packet.","paras":["Joseph died, and all his brothers, and all that generation. But the Israelites were fertile and prolific; they multiplied and increased very greatly, so that the land was filled with them.","A new king arose over Egypt who did not know Joseph. And he said to his people, 'Look, the Israelite people are far too numerous for us. Let us deal shrewdly with them, so that they may not increase; otherwise in the event of war, they may join our enemies in fighting against us and rise from the ground.'"]},"G47":{"title":"Settling in Goshen (Genesis 45:10; 47:27)","attr":"Genesis 45 and 47, as printed in Lesson 2.2.","label":"From your class packet.","paras":["\"You will dwell in the region of Goshen where you will be near me — you and your children and your grandchildren, your flocks and your herds and all that is yours.\" (45:10)","\"Thus Israel settled in the country of Egypt in the region of Goshen; they acquired holdings in it, and were fertile and increased greatly.\" (47:27)"]},"G50":{"title":"Joseph's last words (Genesis 50:20–25)","attr":"Genesis 50, as printed in Lesson 2.2.","label":"From your class packet.","text":"\"Besides, although you intended me harm, G-d intended it for good, so as to bring about the present result — the survival of many people…\" So Joseph and his father's household remained in Egypt… At length, Joseph said to his brothers, 'I am about to die. G-d will surely take notice of you and bring you up from this land to the land G-d promised on oath to Abraham, to Isaac and to Jacob.' So Joseph made the sons of Israel swear, saying, 'When G-d has taken notice of you, you shall carry up my bones from here.'"},"SIN":{"title":"Sinai and after (Exodus 19, Exodus 24, Deuteronomy 27)","attr":"As printed in Lesson 2.3 \"From Family to Nation.\"","label":"From your class packet.","paras":["\"Now, therefore, if you obey my voice faithfully and keep my Covenant, you shall be my treasured possession among all peoples … you shall be to me a kingdom of priests and a holy nation.\" (Exodus 19:5–6)","\"All the people answered with one voice, saying: 'Everything that the Lord has spoken we will do' … They said, 'Everything that the Lord has spoken we will do and obey.'\" (Exodus 24:3, 7)","\"Be silent, Israel, and listen. This day you have become the people of the Lord your G-d. Therefore, obey the Lord your G-d and follow His commandments and decrees.\" (Deuteronomy 27:9–10, forty years later)"]}},"questions":[{"id":"B1","type":"mcq","skill":"Classify","topic":"Family to Nation","stem":"Using your class definitions, the group in Genesis 46 is best described as","options":["a nation with land and laws","a family","a people feared by Pharaoh","a kingdom of priests at Sinai"],"ans":1,"exp":"\"All the persons belonging to Jacob\": 70 people, three generations.","why":["They have no land or government of their own.","","That comes in Exodus 1.","That comes later."],"src":"G46"},{"id":"B2","type":"mcq","skill":"Compare two sources","topic":"Family to Nation","stem":"What changes between the language of Genesis 46 and Exodus 1:9?","options":["From 'slaves' to 'free people'","From 'a nation with laws' to 'a small family of seventy'","From 'Egyptians' to 'Canaanites'","From 'persons of Jacob' to 'the Israelite people'"],"ans":3,"exp":"Outsiders now see a distinct people.","why":["They become slaves after this, not before.","It goes the other way.","Neither passage says this.",""],"src":"EX1"},{"id":"B3","type":"mcq","skill":"Cause and effect","topic":"Family to Nation","stem":"According to Pharaoh, what is the cause of his plan to 'deal shrewdly' with the Israelites?","options":["Their numbers and possible disloyalty in war","Their refusal to farm the land of Goshen as Joseph had ordered","Joseph's order that they leave Egypt","Their worship of the gods of Egypt"],"ans":0,"exp":"\"Far too numerous… they may join our enemies.\"","why":["","He never mentions farming.","Joseph has died; no such order.","He gives no religious reason."],"src":"EX1"},{"id":"B4","type":"mcq","skill":"Point of view","topic":"Family to Nation","stem":"Which statement best describes Pharaoh's point of view in the passage?","options":["He sees the Israelites as honored guests","He sees the Israelites as a small family","He sees growth as a security threat","He sees the Israelites as Egypt's rulers"],"ans":2,"exp":"The new king 'did not know Joseph.'","why":["That was the earlier welcome under Joseph.","He calls them 'far too numerous.'","","He fears them; he doesn't call them rulers."],"src":"EX1"},{"id":"B5","type":"mcq","skill":"Cause and effect","topic":"Family to Nation","stem":"Which detail best explains why leaving Egypt might have been difficult?","options":["Pharaoh had already enslaved them","Goshen was far from Joseph","They acquired holdings and grew","They owned nothing in Egypt"],"ans":2,"exp":"Prosperity is a practical reason to stay.","why":["Slavery came later.","Goshen was 'near me.'","","They acquired holdings."],"src":"G47"},{"id":"B6","type":"mcq","skill":"Interpret a source","topic":"Family to Nation","stem":"What did Joseph most likely believe about when the Israelites should leave Egypt?","options":["When G-d took notice of them","Right after the famine ended","Only after Pharaoh asked them to go","Never, since Egypt was the promised land"],"ans":0,"exp":"Pakod yifkod: 'G-d will surely take notice of you.'","why":["","He links leaving to G-d's action.","He doesn't mention Pharaoh.","He names the land promised to Abraham."],"src":"G50"},{"id":"B7","type":"mcq","skill":"Covenant connection","topic":"Covenant","stem":"Joseph's words connect most directly to which earlier promise?","options":["Pharaoh's promise to feed the world","Lot's choice of the Jordan plain","The promise that Hagar's son would become a great nation","The land promised to Avraham, Yitzchak and Yaakov"],"ans":3,"exp":"He names Abraham, Isaac and Jacob.","why":["That isn't a covenant promise.","That isn't a promise.","Joseph names the promised land.",""],"src":"G50"},{"id":"B8","type":"mcq","skill":"Evidence of expectation","topic":"Family to Nation","stem":"Which detail best shows Joseph expected a future return to Canaan?","options":["\"You intended me harm\"","\"Carry up my bones from here\"","\"The survival of many people\"","\"Joseph and his father's household remained\""],"ans":1,"exp":"He wants his bones taken to the promised land.","why":["That is about the past.","","That explains why he came to Egypt.","That shows they stayed."],"src":"G50"},{"id":"B9","type":"mcq","skill":"Compare two covenants","topic":"Covenant","stem":"Which is the clearest difference between Exodus 19:5–6 and G-d's words to Avram in Genesis 12?","options":["Sinai removes all of G-d's promises","Sinai adds 'if' conditions for a whole people","Sinai is spoken to one man alone","Sinai happens before Avram ever leaves his father's house in Haran"],"ans":1,"exp":"\"If you obey my voice … you shall be…\"","why":["Sinai includes promises such as 'treasured possession.'","","It is spoken to the Children of Israel.","Sinai is generations later."],"src":"SIN"},{"id":"B10","type":"mcq","skill":"Significance","topic":"Covenant","stem":"Why was it significant that the people answered 'with one voice'?","options":["It showed the laws were forced on them","It meant only Moshe agreed","It showed they rejected the laws","They accepted the covenant together"],"ans":3,"exp":"A shared choice is a step from family to nation.","why":["They chose it.","The people answered.","They said 'we will do.'",""],"src":"SIN"},{"id":"B11","type":"mcq","skill":"Continuity and change","topic":"Covenant","stem":"Why might Moshe tell a new generation 'this day you have become the people of the Lord'?","options":["Each generation must accept the covenant itself","The covenant made at Sinai had been cancelled after the golden calf","They had already conquered the land","They had never heard of the covenant"],"ans":0,"exp":"Nationhood is renewed, not just inherited.","why":["","It's renewed, not cancelled.","They were about to enter.","He is renewing it, not introducing it."],"src":"SIN"},{"id":"B12","type":"mcq","skill":"Best-supported conclusion","topic":"Family to Nation","stem":"Which conclusion is best supported by all three excerpts together?","options":["They became a nation only once they had settled in Canaan","They never accepted the covenant","They were treated as a nation before entering the land","The covenant belonged only to Moshe"],"ans":2,"exp":"Your answer: the land completed nationhood but didn't create it.","why":["Two excerpts call them a nation or people in the wilderness.","They answered 'we will do.'","","The whole people answered."],"src":"SIN"}]},{"name":"Set C: Israel, Antisemitism, Traditions","mode":"practice","tips":["Read the question stem first so you know what you are looking for in the source.","\"Best supported\" means the answer the source actually proves. A choice can be true and still not be supported by this source.","Separate evidence (what the text says) from inference (what you conclude from it).","Watch for overgeneralization: \"all,\" \"everyone,\" \"never,\" \"only.\"","If two answers look right, pick the one that is more precise and better supported; check it against counterevidence."],"sources":{"KN":{"title":"Election check-ins","attr":"From your Israel Elections 2026 assignment (JTA tracker).","label":"From your class packet.","table":[["Check-in","Type of information","Largest party","Blocs"],["Tuesday, before results","Poll of polls (projected seats)","Yashar and Likud tied, 22 each","Opposition 53, Netanyahu bloc 53, unaligned 14"],["Tuesday night","Exit polls plus 33% of votes counted","Likud, 27 projected","No bloc reaches 61"],["Wednesday morning","79% of votes counted plus forecast","Likud, 27","No bloc reaches 61"]]},"AS":{"title":"Two statements about a protest","attr":"Written for practice using the distinction in your study guide.","label":"Practice source (written for practice from your class materials; not a verbatim quotation).","paras":["Statement 1: \"I oppose this Israeli government policy, and here are the reports that explain why.\"","Statement 2: \"Jews everywhere are responsible for what Israel's government does.\""]},"RH":{"title":"Rosh Hashanah traditions","attr":"From \"Unpacked for Education: Rosh Hashanah Traditions,\" as highlighted in your copy.","label":"From your class packet.","paras":["Beta Israel developed in relative isolation from the rabbinic Jewish communities of Europe, North Africa and the Middle East. As a result, many customs that now seem nearly universal — including apples and honey and the elaborate Rosh Hashanah seder — weren't historically central to Ethiopian Jewish practice.","Following the teachings of Rabbi Chaim Palachi … of Izmir, families worried that unfiltered honey might contain pieces of bees, which aren't kosher. Instead, they dipped apples into sugar, preserving the wish for sweetness without using honey.","Although both communities drew on ingredients such as coconut, cardamom and tropical fruit, Bene Israel and Cochin Jewish cuisines aren't interchangeable. Each adapted the holiday to the ingredients and cooking traditions of its own region."]},"WWS":{"title":"What would you save?","attr":"From \"What Would You Save? Rebuilding Jewish Life,\" your two-day assignment.","label":"From your class packet.","paras":["A Torah scroll is valuable, but someone must know how to read it. A Jewish calendar identifies holidays, but people must understand how to observe them.","But knowledge alone is not enough. Communities also need institutions. Jews living in a new place may establish a synagogue, school, cemetery, charitable organization, court, or system for caring for people who are poor or sick.","If a community refuses to adapt at all, survival may become difficult. But adapting too completely creates a different problem. If every distinctive tradition disappears, what exactly is being preserved?"]}},"questions":[{"id":"C1","type":"mcq","skill":"Evidence vs. inference","topic":"Israel","stem":"Which conclusion about Tuesday's first check-in is best supported by the table?","options":["Likud had won the election outright","It showed projections, not results","Yashar would form the government","A bloc had reached 61 seats"],"ans":1,"exp":"\"Do not treat polling estimates as actual election results.\"","why":["No votes were counted yet.","","A tie in polls doesn't show who governs.","Both blocs were at 53."],"src":"KN"},{"id":"C2","type":"mcq","skill":"Best-supported conclusion","topic":"Israel","stem":"Likud had the most seats in the last check-in. Which conclusion is best supported?","options":["Likud would govern alone with 27 seats","Likud had won a Knesset majority","The election would be repeated at once","Likud still needed partners to govern"],"ans":3,"exp":"Largest party ≠ governing party.","why":["27 is far short of 61.","No bloc reached 61.","Negotiations come first.",""],"src":"KN"},{"id":"C3","type":"mcq","skill":"Apply a concept","topic":"Israel","stem":"If no bloc reaches 61, what most likely decides who governs?","options":["Negotiations with other parties","The president choosing the prime minister alone","A second vote by the public the next day","The party with the most votes automatically"],"ans":0,"exp":"Coalition building after the vote.","why":["","The president picks who tries, not who wins.","Elections come only if forming a government fails.","It still needs 61."],"src":"KN"},{"id":"C4","type":"mcq","skill":"Apply a concept","topic":"Israel","stem":"A party wins 2.5% of the national vote. What happens?","options":["It wins three seats","It joins the government","It wins no seats","It leads the opposition"],"ans":2,"exp":"The threshold is about 3.25%.","why":["It is under the 3.25% threshold.","It isn't in the Knesset.","","It isn't in the Knesset."]},{"id":"C5","type":"mcq","skill":"Recall applied","topic":"Israel","stem":"After an election, who appoints the person who will try to form a government?","options":["The largest party automatically, with no appointment","The Supreme Court of Israel","Israel's president","A vote of all citizens"],"ans":2,"exp":"This was the question you missed on the quick check.","why":["Someone must be appointed to try.","That is not its role.","","Citizens vote for parties, not for who forms the government."]},{"id":"C6","type":"mcq","skill":"Distinguish claims","topic":"Antisemitism","stem":"Which statement fits your study guide's description of hostility toward Jews as Jews?","options":["Statement 2","Statement 1","Both statements equally","Neither statement"],"ans":0,"exp":"Blaming Jews everywhere for a government's actions targets Jews as Jews.","why":["","It criticizes a policy and cites reports.","Statement 1 targets a policy, not Jews.","Statement 2 blames Jews as a group."],"src":"AS"},{"id":"C7","type":"mcq","skill":"Evaluate a claim","topic":"Antisemitism","stem":"What makes Statement 1 different from Statement 2?","options":["It is louder and more emotional","It mentions Israel's government","It was said out loud at a public protest","It targets a policy and gives evidence"],"ans":3,"exp":"Policy plus evidence vs. a whole people.","why":["Tone isn't the difference.","Both relate to Israel's government.","Setting doesn't decide it.",""],"src":"AS"},{"id":"C8","type":"mcq","skill":"Overgeneralization","topic":"Antisemitism","stem":"Which statement is an overgeneralization?","options":["Some people at a protest may hold extreme views","Everyone at a protest holds the same view","A small extremist group can still be dangerous","Protesters' views should be checked with evidence"],"ans":1,"exp":"'Everyone' turns some into all.","why":["'Some' is limited, not overgeneralized.","","Your review marked this true.","That is careful reasoning."]},{"id":"C9","type":"mcq","skill":"Evaluate a claim","topic":"Antisemitism","stem":"Your review marked 'Most Muslims are Arab' false. What mistake does that statement make?","options":["It confuses Israel with Egypt","It confuses an ethnic group with a religion","It confuses the Torah with the Quran","It confuses a government policy with a single person"],"ans":1,"exp":"Arab is an ethnic and language group; Muslim is a religion.","why":["Neither is mentioned.","","Neither is mentioned.","It is about group identity, not policy."]},{"id":"C10","type":"mcq","skill":"Best-supported conclusion","topic":"Traditions","stem":"Which conclusion is best supported by the excerpts?","options":["Every community used honey on Rosh Hashanah","Rosh Hashanah customs never changed over time in any community","Only Ethiopian Jews kept Rosh Hashanah at all","Communities adapted a shared holiday to local conditions"],"ans":3,"exp":"Shared hope for a sweet year; local forms.","why":["Some used sugar; Ethiopian Jews didn't center it.","The excerpts show change and variation.","Many communities kept it.",""],"src":"RH"},{"id":"C11","type":"mcq","skill":"Cause and effect","topic":"Traditions","stem":"According to the first excerpt, why weren't apples and honey central to Ethiopian Jewish practice?","options":["They developed apart from other communities","Honey was forbidden to Ethiopian Jews by law","They didn't observe Rosh Hashanah at all","Rabbi Chaim Palachi told them to avoid it"],"ans":0,"exp":"Isolation shaped which customs developed.","why":["","The excerpt gives isolation as the reason.","They observed it.","That's the Turkish custom."],"src":"RH"},{"id":"C12","type":"mcq","skill":"Main idea","topic":"Traditions","stem":"Which statement best expresses the author's main point?","options":["Physical objects alone can preserve a community","Communities should never change anything","A community needs knowledge, institutions and balance","Communities should adapt completely to fit in with their new neighbors"],"ans":2,"exp":"Knowledge, institutions, and adapting without disappearing.","why":["The scroll needs a reader.","Refusing to adapt makes survival hard.","","Then nothing distinct is left."],"src":"WWS"}]},{"name":"Mock Test (40 questions)","mode":"exam","exam":"Mock test","examTips":["Like the real test: 40 multiple-choice questions in 42 minutes. Turn the Timer on and leave Shuffle off.","About one minute per question. Flag hard ones and come back.","When two answers look right, choose the one the source proves most directly."],"tips":["Read the question stem first so you know what you are looking for in the source.","\"Best supported\" means the answer the source actually proves. A choice can be true and still not be supported by this source.","Separate evidence (what the text says) from inference (what you conclude from it).","Watch for overgeneralization: \"all,\" \"everyone,\" \"never,\" \"only.\"","If two answers look right, pick the one that is more precise and better supported; check it against counterevidence."],"sources":{"UR":{"title":"Ur and southern Mesopotamia","attr":"From the evidence packet \"Should He Leave Mesopotamia?\" (Source C).","label":"From your class packet.","paras":["Ur was one of the important cities of ancient Mesopotamia and was part of a highly developed urban civilization.","The Tigris and Euphrates river system supported irrigation. Canals moved water to fields and helped farmers produce grain and other crops.","Ur participated in long-distance trade. Because southern Mesopotamia lacked some natural resources, merchants imported materials such as timber, metals, and stone.","Wealthy households could own livestock, goods, land-use rights, and valuable possessions and could depend on extended family and business relationships."]},"CAN":{"title":"Canaan","attr":"From the evidence packet \"Should He Leave Mesopotamia?\" (Source D).","label":"From your class packet.","paras":["Unlike southern Mesopotamia, much of Canaan depended heavily on seasonal rainfall rather than a large river-based irrigation system.","Canaan contained towns and fortified settlements as well as rural and pastoral communities.","The region was already inhabited by different groups. Land and water were not simply unclaimed.","Rainfall and harvests could vary from year to year. Drought and famine were serious dangers in the ancient Near East."]},"G12":{"title":"Leaving Haran (Genesis 12:1–4)","attr":"Genesis 12:1–4, as printed in your Lesson 1.4 source sheet.","label":"From your class packet.","paras":["1. G-d said to Avram, \"Go forth from your land, from your birthplace and from your father's house to the land that I will show you.","2. I will make of you a great nation, and I will bless you; I will make your name great, and you shall be a blessing.","3. I will bless those who bless you … and all the families of the earth shall bless themselves by you.\"","4. So Avram went, as G-d had spoken to him, and Lot went with him."]},"BR":{"title":"The palace (Bereishit Rabbah 39:1)","attr":"Midrash compiled c. 5th century CE, as printed in \"Avraham: Why Was He Chosen?\"","label":"From your class packet.","text":"A man was traveling when he saw a beautifully illuminated palace. He wondered, 'Is it possible that this palace has no owner?' Immediately the owner looked out and said, 'I am the owner of this palace.' Likewise, Avraham looked at the world and wondered, 'Is it possible that this world has no One who governs it?' Immediately G-d revealed Himself to Avraham."},"RAM":{"title":"Rambam on Avraham","attr":"Rambam (Maimonides), Mishneh Torah, Laws of Foreign Worship 1:3, as printed in \"Avraham: Why Was He Chosen?\"","label":"From your class packet.","text":"After this mighty man was weaned, he began to explore and think. Though he was a child he began to think incessantly … wondering: how is it possible for the sphere to continue to revolve without having anyone controlling it? Who is causing it to revolve? … He had no teacher… Rather he was mired in Ur Kasdim among the foolish idolaters… He realized that there was one G-d who controlled the sphere, that He created everything, and that there is no other G-d among all the other entities… Abraham was forty years old when he became aware of his Creator."},"G13":{"title":"Avraham and Lot (Genesis 13:7–11)","attr":"Genesis 13, as printed in your Lesson 1.4 source sheet.","label":"From your class packet.","paras":["7. There was quarreling between the herdsmen of Avram and the herdsmen of Lot.","8. Avram said to Lot, \"Let there be no quarrel between you and me, and between my herdsmen and yours, for we are relatives.","9. Is not the whole land before you? Please separate from me. If you go to the left, I will go to the right; and if you go to the right, I will go to the left.\"","10–11. Lot looked out, chose the well-watered Jordan plain for himself, and the two separated."]},"G18":{"title":"Avraham pleads for Sodom (Genesis 18:23–25)","attr":"Genesis 18, as printed in your Avraham text study.","label":"From your class packet.","text":"Abraham came forward and said, \"Will You indeed sweep away the innocent along with the guilty? What if there should be fifty innocent within the city; will You then wipe out the place and not forgive it for the sake of the innocent fifty who are in it? Far be it from You to do such a thing, to bring death upon the innocent as well as the guilty, so that innocent and guilty fare alike. Far be it from You! Shall not the Judge of all the earth deal justly?\""},"G16":{"title":"Hagar (Genesis 16:1–6)","attr":"Genesis 16, as printed in your Lesson 1.4 source sheet.","label":"From your class packet.","paras":["Sarai said to Avram, \"G-d has kept me from bearing. Consort with my servant; perhaps I shall have a son through her.\" And Avram listened to Sarai.","He came to Hagar and she conceived; and when she saw that she had conceived, her mistress was lowered in her esteem.","Sarai said to Avram, \"The wrong done me is your fault! … Let G-d decide between you and me!\"","Avram said to Sarai, \"Your servant is in your hands; do to her as you think best.\" Then Sarai treated her harshly, and Hagar ran away from her."]},"G22":{"title":"Akeidat Yitzchak (Genesis 22:1–3, 7–8)","attr":"Genesis 22, as printed in your Lesson 1.4 source sheet.","label":"From your class packet.","paras":["G-d tested Avraham and said to him, \"Avraham,\" and he answered, \"Here I am.\" G-d said, \"Take your son, your favored one, Yitzchak, whom you love, and go to the land of Moriah, and offer him there as a burnt offering…\"","So early the next morning, Avraham saddled his donkey … and set out for the place of which G-d had told him.","Yitzchak said, \"Father! … Here are the firestone and the wood; but where is the sheep for the burnt offering?\" Avraham said, \"G-d will see to the sheep for the burnt offering, my son.\" And the two of them walked on together."]},"SIN":{"title":"Sinai and after (Exodus 19, Exodus 24, Deuteronomy 27)","attr":"As printed in Lesson 2.3 \"From Family to Nation.\"","label":"From your class packet.","paras":["\"Now, therefore, if you obey my voice faithfully and keep my Covenant, you shall be my treasured possession among all peoples … you shall be to me a kingdom of priests and a holy nation.\" (Exodus 19:5–6)","\"All the people answered with one voice, saying: 'Everything that the Lord has spoken we will do' … They said, 'Everything that the Lord has spoken we will do and obey.'\" (Exodus 24:3, 7)","\"Be silent, Israel, and listen. This day you have become the people of the Lord your G-d. Therefore, obey the Lord your G-d and follow His commandments and decrees.\" (Deuteronomy 27:9–10, forty years later)"]},"G46":{"title":"Jacob's household (Genesis 46:26–27)","attr":"Genesis 46, as printed in Lesson 2.1.","label":"From your class packet.","text":"All the persons belonging to Jacob who came to Egypt — his own issue aside from the wives of Jacob's sons — all these persons numbered 66. And Joseph's sons who were born to him in Egypt were two in number. Thus the total of Jacob's household who came to Egypt was 70 persons."},"EX1":{"title":"A new king (Exodus 1:6–10)","attr":"Exodus 1, as printed in Lesson 2.1.","label":"From your class packet.","paras":["Joseph died, and all his brothers, and all that generation. But the Israelites were fertile and prolific; they multiplied and increased very greatly, so that the land was filled with them.","A new king arose over Egypt who did not know Joseph. And he said to his people, 'Look, the Israelite people are far too numerous for us. Let us deal shrewdly with them, so that they may not increase; otherwise in the event of war, they may join our enemies in fighting against us and rise from the ground.'"]},"G47":{"title":"Settling in Goshen (Genesis 45:10; 47:27)","attr":"Genesis 45 and 47, as printed in Lesson 2.2.","label":"From your class packet.","paras":["\"You will dwell in the region of Goshen where you will be near me — you and your children and your grandchildren, your flocks and your herds and all that is yours.\" (45:10)","\"Thus Israel settled in the country of Egypt in the region of Goshen; they acquired holdings in it, and were fertile and increased greatly.\" (47:27)"]},"G50":{"title":"Joseph's last words (Genesis 50:20–25)","attr":"Genesis 50, as printed in Lesson 2.2.","label":"From your class packet.","text":"\"Besides, although you intended me harm, G-d intended it for good, so as to bring about the present result — the survival of many people…\" So Joseph and his father's household remained in Egypt… At length, Joseph said to his brothers, 'I am about to die. G-d will surely take notice of you and bring you up from this land to the land G-d promised on oath to Abraham, to Isaac and to Jacob.' So Joseph made the sons of Israel swear, saying, 'When G-d has taken notice of you, you shall carry up my bones from here.'"},"KN":{"title":"Election check-ins","attr":"From your Israel Elections 2026 assignment (JTA tracker).","label":"From your class packet.","table":[["Check-in","Type of information","Largest party","Blocs"],["Tuesday, before results","Poll of polls (projected seats)","Yashar and Likud tied, 22 each","Opposition 53, Netanyahu bloc 53, unaligned 14"],["Tuesday night","Exit polls plus 33% of votes counted","Likud, 27 projected","No bloc reaches 61"],["Wednesday morning","79% of votes counted plus forecast","Likud, 27","No bloc reaches 61"]]},"AS":{"title":"Two statements about a protest","attr":"Written for practice using the distinction in your study guide.","label":"Practice source (written for practice from your class materials; not a verbatim quotation).","paras":["Statement 1: \"I oppose this Israeli government policy, and here are the reports that explain why.\"","Statement 2: \"Jews everywhere are responsible for what Israel's government does.\""]},"WWS":{"title":"What would you save?","attr":"From \"What Would You Save? Rebuilding Jewish Life,\" your two-day assignment.","label":"From your class packet.","paras":["A Torah scroll is valuable, but someone must know how to read it. A Jewish calendar identifies holidays, but people must understand how to observe them.","But knowledge alone is not enough. Communities also need institutions. Jews living in a new place may establish a synagogue, school, cemetery, charitable organization, court, or system for caring for people who are poor or sick.","If a community refuses to adapt at all, survival may become difficult. But adapting too completely creates a different problem. If every distinctive tradition disappears, what exactly is being preserved?"]}},"questions":[{"id":"M1","type":"mcq","skill":"Compare sources","topic":"Avraham","stem":"Using this source and your evidence packet's description of Canaan, which contrast between Ur and Canaan is best supported?","options":["Ur was empty; Canaan was crowded with cities","Ur relied on rivers; Canaan on rain","Ur had no trade; Canaan traded widely","Ur was inhabited; Canaan was unclaimed land"],"ans":1,"exp":"Irrigation vs. seasonal rainfall.","why":["Ur was a developed city; Canaan had towns and rural areas.","","Ur traded long-distance.","Canaan was already inhabited."],"src":"UR"},{"id":"M2","type":"mcq","skill":"Counterevidence","topic":"Avraham","stem":"A student says moving to Canaan was simply a move to free, empty land. Which detail best refutes this?","options":["Canaan grew grain, grapes and olives for its towns and villages","Canaan depended on seasonal rainfall","Canaan had coastal plains and valleys","Canaan was already inhabited by different groups"],"ans":3,"exp":"\"Land and water were not simply unclaimed.\"","why":["That doesn't address whether land was claimed.","That's about farming, not ownership.","That's geography, not ownership.",""],"src":"CAN"},{"id":"M3","type":"mcq","skill":"Cause and effect","topic":"Family to Nation","stem":"Which detail from this source best helps explain why Yaakov's family later went down to Egypt?","options":["Drought and famine were serious dangers","Canaan had fortified settlements","Canaan grew grapes and olives","Routes through Canaan led north and east to other regions"],"ans":0,"exp":"The famine in Joseph's time drove them to Egypt.","why":["","That doesn't explain going to Egypt.","That doesn't explain leaving.","Egypt is to the south."],"src":"CAN"},{"id":"M4","type":"mcq","skill":"Inference","topic":"Avraham","stem":"Which inference is best supported by verse 4 alone?","options":["Avram wanted to escape from his father's family in Haran","Avram knew exactly where he was going","Avram responded with obedience, not debate","Avram argued before agreeing to go"],"ans":2,"exp":"The verse records action without discussion.","why":["Nothing says he wanted to escape.","The land is 'the land
